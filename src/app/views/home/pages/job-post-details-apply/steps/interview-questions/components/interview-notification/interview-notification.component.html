<div class="py-3">
	<div class="d-flex align-items-center justify-content-center w-100 mb-3">
		<div class="image-placeholder">
			<img src="/assets/images/placeholder/icons/interview-notification.png">
		</div>
	</div>

	<div class="text-center px-lg-4">
		<h5 class="title-main">The Recruiter would like to ask you some questizons.</h5>

		<p class="title-description">Answering Interviews during your application helps improve your success rate. Please click proceed to continue answering the interview questions. Prepare your camera. Get a good lighting and don't forget to smile. Let's Begin.</p>
	</div>

	<div class="justify-content-center align-self-center d-flex mt-4">
		<button class="btn btn-cancel me-2" (click)="close()">Skip for now</button>

		<button class="btn btn-save" (click)="save()">Proceed</button>
	</div>
</div>
