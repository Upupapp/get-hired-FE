<div class="admin-pager">
  <span>{{ rangeLabel }}</span>
  <div class="admin-pager-actions">
    <button type="button" class="admin-btn admin-btn--ghost" (click)="pageChange.emit(page - 1)" [disabled]="page <= 1">
      Previous
    </button>
    <span>Page {{ page }} of {{ pageCount }}</span>
    <button type="button" class="admin-btn admin-btn--ghost" (click)="pageChange.emit(page + 1)" [disabled]="page >= pageCount">
      Next
    </button>
  </div>
</div>
