<section style="transition: all 0.4s ease !important;">
	<!-- TITLE -->
	<div class="mt-3" [@animate]="{value:'*', params:{ y:'10px', delay:'200ms' }}">
		<h5 class="main-title">Job Post Preview</h5>
	</div>

	<section class="card card-body mb-3">
		<div class="banner-container">
			<img src="/assets/images/placeholder/category-2.png" class="banner-image">
		</div>

		<div class="job-details-container p-4">
			<h5 class="job-title">
				Lead UI/UX Designer
			</h5>


			<div class="mt-3">
				<div class="d-flex">
					<h5 class="d-flex title-details me-3 ms-1">
						<img src="/assets/images/placeholder/icons/job-icon-type.png" class="me-2" style="width: 15px; height: 15px; margin-top: 4px;"> 
						Full-time
					</h5>

					<h5 class="d-flex title-details me-2">
						<img src="/assets/images/placeholder/icons/job-icon-type.png" class="me-2" style="width: 15px; height: 15px; margin-top: 4px;"> 
						Hybrid
					</h5>
				</div>

				<div class="d-flex mt-1">
					<h5 class="d-flex title-details me-3 ms-1">
						<img src="/assets/images/placeholder/icons/job-icon-address.png" class="me-1" style="width: 17px; height: 17px; margin-top: 3px;"> 
						Ranchview, California
					</h5>

				</div>

				<div class="d-flex mt-1">
					<h5 class="d-flex title-details me-3 ms-1">
						<img src="/assets/images/placeholder/icons/job-icon-salary.png" class="me-2" style="width: 15px; height: 15px; margin-top: 4px;"> 
						PHP 25,000 - PHP 50,000
					</h5>
				</div>
			</div>
		</div>
	</section>
</section>
