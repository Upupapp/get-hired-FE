<div class="card card-body">
  <!-- BRAND AUDIT FIX-4/5: destructive border when caller sets data.destructive=true
       (e.g. permanent job deletion). Falls back to standard border for all other callers. -->
  <div [ngClass]="data.destructive ? 'border-solid-destructive' : 'border-solid'">
    <div class="d-flex p-1">
      <img src="/assets/images/placeholder/icons/info-red.png" class="mt-1"
      style="height: 34px" aria-hidden="true">

      <div class="ms-3">
        <!-- LOGOUT-CONFIRM: data.title lets a caller (e.g. the shared
             logout confirmation) supply an exact heading instead of the
             generic "{action} Confirmation" pattern below. Every existing
             caller leaves data.title unset and is unaffected. -->
        <h5 class="title-label">{{ data.title ? data.title : (data.action + ' Confirmation') }}</h5>
        <p>
          <!-- P2 FIX: show a caller-supplied message when present (e.g. "This
               action cannot be undone." for delete-job). Falls back to the
               original generic text for all other callers. -->
          {{ data.message ? data.message : ('Would you like to save your progress in ' + data.action + ' ?') }}
        </p>
      </div>
    </div>

    <div class="w-100 mt-1 text-end">
      <!-- BL-011: cdkFocusInitial on Cancel so focus lands here on dialog open.
           Cancel-first is the WCAG-safe default for destructive confirm dialogs
           (prevents accidental confirmation by keyboard users). -->
      <button type="button" (click)="submit(2)"
      class="btn btn-default px-2 me-2"
      cdkFocusInitial>
        {{ data.cancelLabel ? data.cancelLabel : ('DELETE_WARNING.CANCEL_BUTTON' | translate) }}
      </button>

      <!-- BRAND AUDIT FIX-4: use btn-destructive class when data.destructive=true
           to signal irreversibility clearly. Standard btn-primary for all other callers. -->
      <button type="button" (click)="submit(1)"
      [ngClass]="data.destructive ? 'btn btn-destructive px-2 me-2' : 'btn btn-primary px-2 me-2'"
      [attr.aria-label]="data.destructive ? 'Confirm permanent deletion' : null">
        {{ data.confirmLabel ? data.confirmLabel : ('DELETE_WARNING.CONTINUE_BUTTON' | translate) }}
      </button>
    </div>
  </div>
</div>
