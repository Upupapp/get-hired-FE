<button type="button" class="role-card gh-pressable" (click)="onActivate()" [attr.aria-label]="ariaLabel || title">
  <div class="role-card-icon" *ngIf="icon" aria-hidden="true">
    <img [src]="icon" alt="" class="role-card-icon-img">
  </div>
  <h3 class="role-card-title">{{ title }}</h3>
  <p class="role-card-description">{{ description }}</p>
  <span class="role-card-cta">
    {{ ctaLabel }}
    <span class="role-card-cta-arrow" aria-hidden="true">&#8594;</span>
  </span>
</button>
