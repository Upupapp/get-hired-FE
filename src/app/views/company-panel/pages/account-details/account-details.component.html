<div class="p-3">
	<h5 class="title-main">Account Details</h5>
	
	<div class="p-lg-3">
		<section class="mb-4">
			<app-banner-account-details></app-banner-account-details>
		</section>

		<h5 class="title-main ms-3">Latest Jobs and Careers
			<button class="float-end btn edit-details">
				<img src="/assets/images/placeholder/icons/company-edit-2.png" style="height: 12px; margin-top: -3px;" class="me-2">Edit
			</button>
		</h5>
		<p class="ms-3">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed <br>do eiusmod tempor incididunt ut labore et dolore magna aliqua. </p>

		<div class="row px-lg-3">
			<ng-container *ngFor="let data of latestjobs.slice(0, 3); let i = index">
				<div class="col-12 col-md-6 col-lg-4" [@animate]="{value:'*', params:{ y:'-10px', delay: (i * 150) + 'ms' }}">

					<ng-container>
						<app-latest-job-account-details [data]="data" [i]="i"></app-latest-job-account-details>
					</ng-container>
				</div>
			</ng-container>
		</div>

		<h5 class="title-main ms-3 mt-3 mb-4">Featured Top Jobs
			<button class="float-end btn edit-details">
				<img src="/assets/images/placeholder/icons/company-edit-2.png" style="height: 12px; margin-top: -3px;" class="me-2">Edit
			</button>
		</h5>

		<div class="row px-lg-3">
			<ng-container *ngFor="let data of latestjobs.slice(0, 3); let i = index">
				<div class="col-12 col-md-6 col-lg-4" [@animate]="{value:'*', params:{ y:'-10px', delay: (i * 150) + 'ms' }}">

					<ng-container>
						<app-featured-top-jobs-account-details [data]="data" [i]="i"></app-featured-top-jobs-account-details>
					</ng-container>
				</div>
			</ng-container>
		</div>
	</div>
</div>
