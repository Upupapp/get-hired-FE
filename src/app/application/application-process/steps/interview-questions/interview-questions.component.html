<!-- RECORD INTERVIEW -->
<app-record-interview [interviews]="interviews" [index]="selectedIndex" (next)="changeQuestion($event)"
  (submitRecord)="submitAnswer($event)"></app-record-interview>

<!-- Always-available escape hatch: skip the entire screening interview
     section and proceed directly to Summary & Submit for Evaluation. -->
<div class="d-flex justify-content-end mb-3">
  <button class="btn btn-outline-secondary" type="button" (click)="skipToSummary()">
    {{ 'INTERVIEW_PAGE_SECTION.SKIP_INTERVIEW_BUTTON' | translate }}
  </button>
</div>

<!-- INTERVIEW QUESTIONS -->
<section class="card card-body my-3">
  <div class="p-4">
    <div class="d-flex">
      <label class="title-job-interview text-capitalize me-3" [ngClass]="interviewTab === 'questions' ? 'active' : ''"
        (click)="interviewTab = 'questions'">{{ 'INTERVIEW_PAGE_SECTION.QUESTIONS' | translate }}</label>

      <label class="title-job-answer text-capitalize" [ngClass]="interviewTab === 'answers' ? 'active' : ''"
        (click)="interviewTab = 'answers'">{{ 'INTERVIEW_PAGE_SECTION.ANSWERS' | translate }}</label>
    </div>

    <hr style="color: #6e6e6e">

    <ng-container *ngIf="interviewTab === 'questions'">
      <section class="interview-card card-body p-2 px-1 mb-1">
        <!-- INTERVIEWS -->
        <div *ngFor="let item of interviews; let i = index">
          <app-view-interview-question [index]="i" [item]="item" *ngIf="i != selectedIndex"
            (record)="changeQuestion($event)">
          </app-view-interview-question>
        </div>
      </section>
    </ng-container>

    <ng-container *ngIf="interviewTab === 'answers' && interviewAnswers.controls.length > 0">
      <section class="interview-card card-body p-2 px-1 mb-1" id="interview-list2"
        *ngFor="let item of interviewAnswers.controls; let i = index">
        <div class="row" [@animate]="{value:'*', params:{ y:'10px', delay:  (i * 150) + 'ms' }}"
          (click)="previewVideo(interviews[item.value.index].question, item.value.answerBlob)">
          <div class="col-12">
            <div class="float-end">
              <div class="mt-3 me-2 text-end">
                <span class="title-label-sub-duration d-block mb-1"
                  [class.text-danger]="answerSizeMb(item.value.answerFile) > 50">
                  {{ answerSizeMb(item.value.answerFile).toFixed(1) }} MB
                </span>
                <button type="button" class="btn btn-outline-secondary btn-sm"
                  (click)="removeAnswer(i, $event)">
                  Remove
                </button>
              </div>
            </div>

            <div class="d-flex">
              <div class="logo-thumbnail me-3 d-flex align-items-center justify-content-center">
                <img src="/assets/images/check-icon.png">
              </div>

              <div class="mt-2">
                <p class="title-label-sub">
                  <img src="/assets/images/placeholder/icons/interview-logo-3.png" class="me-2" style="height: 20px;">
                  Answer {{item.value.index + 1}}
                </p>
                <h5 class="title-label">{{interviews[item.value.index].question}}</h5>
                <p class="title-label-sub-duration text-danger mb-0" *ngIf="answerSizeMb(item.value.answerFile) > 50">
                  This video is large and may fail to submit. Consider removing it and recording a shorter answer.
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </ng-container>
  </div>
</section>
