<div class="video-interview-badge" *ngIf="job?.hasVideoInterview">
  <button type="button" class="video-interview-badge-toggle" (click)="toggle()"
    [attr.aria-expanded]="expanded">
    <span class="video-interview-badge-icon" aria-hidden="true">&#9658;</span>
    Includes video questions
  </button>

  <div class="video-interview-badge-explainer" *ngIf="expanded" role="status">
    <p>
      This job includes
      <ng-container *ngIf="job.interviewQuestionCount > 0">{{ job.interviewQuestionCount }} short</ng-container>
      video question<ng-container *ngIf="job.interviewQuestionCount !== 1">s</ng-container>
      as part of the application.
    </p>
    <p>
      You'll record your answers using your device's camera once you start applying — no
      separate app or download needed. There's no need to prepare a script; just answer
      naturally.
    </p>
  </div>
</div>
