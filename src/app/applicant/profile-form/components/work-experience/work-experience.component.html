<form [formGroup]="workForm">
  <div class="mt-2" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
    <div class="row">
      <div class="col-12">
        <div class="row">
          <div class="col-12 col-md-9 align-self-center">
            <h5 class="title-label">
              <span *ngIf="workForm.controls.jobTitle.value">
                {{workForm.controls.jobTitle.value|| '-'}}
              </span>

              <ng-container *ngIf="workForm.controls.companyName.value">
                <span class="mx-2">|</span>
                <i>{{workForm.controls.companyName.value || '-'}}</i>
              </ng-container>
            </h5>
          </div>
          <div class="col-12 col-md-3">
            <span (click)="cancel()" class="float-end btn btn-add">
              <img src="/assets/images/placeholder/icons/remove-gray.png" style="height: 15px">
            </span>
            <!-- <button class="float-end btn btn-save-draft" type="button"
            [disabled]="!workForm.valid"
            (click)="addWorkExp()" *ngIf="controlIndex == 0">
            {{ 'SKILLS_AND_EXPERIENCE.ADD_ITEM_BUTTON' | translate }}</button>-->
          </div>
        </div>
        <hr style="border: dashed 1px #868686">
      </div>

      <div class="col-12 col-lg-6">
        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.JOB_TITLE' | translate }}</label>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="i.e. Full Stack Developer" formControlName="jobTitle">
          </div>
        </div>

        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.LOCATION' | translate }}</label>
          <div class="form-group">
            <input type="text" class="form-control" formControlName="location" placeholder="Office Full Address">
          </div>
        </div>

        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.DURATION' | translate }}</label>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" formControlName="isCurrentJob" value="isCurrentJob">
            <label class="form-check-label">
              {{ 'SKILLS_AND_EXPERIENCE.DURATION_TYPE' | translate }}
            </label>
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-lg-6">
            <div class="title-container mb-3">
              <label>{{ 'SKILLS_AND_EXPERIENCE.START_DATE' | translate }}</label>
              <select class="form-select" formControlName="startMonth">
                <option selected disabled [ngValue]="null">Select Month</option>
                <ng-container *ngFor="let item of month; let i = index">
                  <option [value]="item">{{item}}</option>
                </ng-container>
              </select>
            </div>
          </div>

          <div class="col-12 col-lg-6">
            <div class="title-container mb-3">
              <label> </label>
              <select class="form-select" formControlName="startYear">
                <option selected disabled [ngValue]=null>Select Year</option>
                <ng-container *ngFor="let item of year; let i = index">
                  <option [value]="item">{{item}}</option>
                </ng-container>
              </select>
            </div>
          </div>
        </div>

        <div class="row justify-content-between">
          <div class="col-12 col-lg-4 align-items-center d-flex">
            <label class="m-0">End Date</label>
          </div>
          <div class="col-12 col-lg-8">
            <div class="form-check row d-flex h-100 align-items-center justify-content-end">
              <input class="form-check-input col-12 col-lg-4" type="checkbox" formControlName="isCurrentJob">
              <label class="form-check-label col-12 col-lg-8 m-0">
                I currently work here
              </label>
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-12 col-lg-6">
            <div class="title-container mb-3">
              <label>{{ 'SKILLS_AND_EXPERIENCE.END_DATE' | translate }}</label>
              <select class="form-select" formControlName="endMonth">
                <option selected disabled [ngValue]=null>Select Month</option>
                <ng-container *ngFor="let item of month; let i = index">
                  <option [value]="item">{{item}}</option>
                </ng-container>
              </select>
            </div>
          </div>

          <div class="col-12 col-lg-6">
            <div class="title-container mb-3">
              <select class="form-select" formControlName="endYear">
                <option selected disabled [ngValue]=null>Select Year</option>
                <ng-container *ngFor="let item of year; let i = index">
                  <option [value]="item">{{item}}</option>
                </ng-container>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.COMPANY' | translate }}</label>
          <div class="form-group">
            <input type="text" class="form-control" formControlName="companyName"
              placeholder="i.e. Microsoft, Google, Apple">
          </div>
        </div>

        <div class="title-container mb-3" *ngIf="jobType$ | async as jobType">
          <label>Job Type</label>
          <select class="form-select" formControlName="jobTypeId">
            <option selected disabled [ngValue]="null">Select Job Type</option>
            <ng-container *ngFor="let item of jobType; let i = index">
              <option [value]="item.id">{{ item.name }}</option>
            </ng-container>
          </select>
        </div>

        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.DETAILS' | translate }}</label>
          <div class="form-group">
            <textarea type="text" class="form-control" formControlName="details"
              placeholder="Subject to the terms and conditions set forth in this Agreement, Company will perform the Services described in each Quote/Proposal. Company retains ownership of any portion of Company developed tools or products that are used in or form a part of computer programs or documentation resulting from a particular service provided. "
              rows="9"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="row justify-content-end">
      <div class="col-12 col-md-3">
            <button class="float-end btn btn-save-draft" type="button"
            [disabled]="!workForm.valid"
            (click)="addWorkExp()">
              Add Item</button>
          </div>
    </div>
  </div>
</form>
