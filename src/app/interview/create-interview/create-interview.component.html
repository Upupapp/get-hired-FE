<div class="card card-body mb-4" *ngIf="forJob">
  <div class="row justify-content-end">
    <div class="col-12 col-lg-8">
      <span class="main-title mt-3">Create Template</span>
    </div>
    <div class="col-12 col-md-4 text-end">
      <button class="btn btn-save-draft me-2" (click)="getBack()">Cancel</button>
      <button class="btn btn-save me-2" (click)="submitForm()">Create Template</button>
    </div>
  </div>
</div>
<div class="card card-body" [formGroup]="interviewForm">
  <div class="row" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
    <div class="col-12" *ngIf="!forJob">
      <h5 class="title-label">Interview Questions</h5>
    </div>
    <div class="col-12 col-lg-6 mt-3" *ngIf="forJob">
      <div class="title-container">
        <label>Template Name</label>
        <div class="form-group">
          <input type="text" class="form-control" formControlName="templateName"
            placeholder="ex. Interview Questions for Visual Assistant">
          <div class="mt-1 ms-4" *ngIf="
            (templateName_validators?.invalid && templateName_validators?.touched) || templateName_validators?.dirty">
            <small *ngIf="templateName_validators?.errors?.required" class="text-danger">Name is required</small>
          </div>
        </div>
      </div>
    </div>

    <hr style="border: dashed 1px #868686" class="my-3">

    <app-create-question (addItem)="addQuestion($event)"
      [questionIndex]="interviewQuestions && questionsContainer.length + 1"></app-create-question>
  </div>
</div>

<div *ngIf="interviewQuestions">

  <h5 class="title-label mt-4" *ngIf="interviewQuestions && questionsContainer.length > 0"
    [@animate]="{value:'*', params:{ y:'10px', delay:  (250) + 'ms' }}">
    Questions Preview
  </h5>

  <section class="card card-body mt-3" *ngFor="let item of questionsContainer; let i = index"
    [@animate]="{value:'*', params:{ y:'10px', delay:  (i + 150) + 'ms' }}">
    <!-- INTERVIEWS -->
    <div class="mt-2 row">
      <div class="col-12">
        <div class="float-end">
          <div class="mt-2">
            <button class="btn btn-upload me-2" type="button"
              (click)="removeItem(i, this.interviewQuestions)">Delete</button>

            <button class="btn btn-record" *ngIf="allowedToEdit" (click)="editItem(i)">Edit</button>
          </div>
        </div>

        <div class="d-flex">
          <div class="logo-thumbnail me-3 d-flex align-items-center justify-content-center">
            <img src="/assets/images/placeholder/icons/interview-logo-4.png">
          </div>

          <div class="mt-2">
            <p class="title-label-sub">
              <img src="/assets/images/placeholder/icons/interview-logo-3.png" class="me-2" style="height: 20px;">
              Question {{i + 1}}
            </p>
            <h5 class="title-label">{{item?.question}}</h5>
            <p class="title-label-sub-duration"><span>Estimated Duration:</span> {{item?.answerDuration}} minutes</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
