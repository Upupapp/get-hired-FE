<div class="p-2">
	<h5 class="title-main">Interview Settings</h5>
	<br>
	<div class="card card-body">
			<app-recorder-setting
        (chosenAudioIn)="audioIn = $event"
        (chosenAudioOut)="audioSrc = $event"
        (chosenVideo)="videoSrc = $event"></app-recorder-setting>
			<div class="justify-content-center align-self-center d-flex mt-2">
				<button class="btn btn-cancel me-2" (click)="close()">Cancel</button>
				<button class="btn btn-save" (click)="close()">Save</button>
			</div>
	</div>
</div>
