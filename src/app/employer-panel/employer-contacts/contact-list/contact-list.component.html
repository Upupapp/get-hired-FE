<div class="mt-3 ps-4 pe-4" id="job-order-main-container">
	<div [@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}">
		<div class="mb-3 ms-2">
			<span class="breadcrumbs">
				Contact / Lists
			</span>
		</div>

		<div class="displayFlex">
            <button class="btn-primary" (click)="addEmployee()">
                Add Contact
                <img src="/assets/images/placeholder/icons/add-new.png" 
                style="width: 35px;" class="ms-1">
            </button>
        </div>
		<br>
		<div class="mt-2 card card-body" *ngIf="listView && !loading">
			<app-reusable-table
				[loading]="loading"
				(updateSelectedRowDialog)="viewContact($event)"
				(viewDetails)="viewContact($event)"
				[componentTitle]="'Contacts'"								
				[displayedColumns]="displayedColumns"
				[selectedColumns]="selectedColumns"
				[selectedColumnsMobile]="selectedColumns"
				[searchSource]="searchSource"
				[maxRows]="10"
				[listDataSource]="contactList">
			</app-reusable-table>
		</div>

		
		<!-- LOADING ANIMATION SCREEN -->
		<custom-profile-loader 
			[withSideBar]="false"
			[fromDetailTab]="true"
			[loading]="loading">
		</custom-profile-loader>
	</div>
</div>
