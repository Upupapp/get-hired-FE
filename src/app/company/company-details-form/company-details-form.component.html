<form [formGroup]="companyDetailsForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
  <div class="text-end submit-container" [@animate]="{value:'*', params:{ y:'10px', delay:  (150) + 'ms' }}">
    <!-- <button class="btn btn-save-draft me-3"
    *ngIf="canView" type="button" (click)="redirectToPreview()">
    Company Preview
  </button> -->
    <button class="btn btn-save me-2" type="submit" [disabled]="!companyDetailsForm.valid">
      {{ 'EDIT_COMPANY_DETAILS.SUBMIT_BUTTON' | translate }}</button>
  </div>

  <div class="card card-body mt-3">
    <div class="row" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
      <!-- EMPLOYMENT DETAILS -->
      <div class="col-12">
        <h5 class="title-label">{{ 'EDIT_COMPANY_DETAILS.COMPANY_DESCRIPTION' | translate }}</h5>
        <hr style="border: dashed 1px #868686">
      </div>

      <div class="col-12 col-lg-3" *ngIf="profileImage">
        <div>
          <div class="text-center mb-3 bg-gray" *ngIf="profileImage">
            <img [src]="profileImage" class="avatar-image">
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-9" *ngIf="!profileImage"></div>

      <div class="col-12 col-lg-6" [ngClass]="profileImage ? 'mt-3' : ''">
        <div class="title-container mb-3">
          <label>{{ 'EDIT_COMPANY_DETAILS.COMPANY_LOGO_TEXT' | translate }}</label>
          <app-file-upload formControlName="companyLogoFile" (upload)="onUpload($event)" label="Select Profile Photo"
            [labelTop]="false"></app-file-upload>
        </div>

        <div class="title-container mb-3" *ngIf="profileImage">
          <label>{{ 'EDIT_COMPANY_DETAILS.COMPANY_NAME_TEXT' | translate }}</label>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="i.e. Google, Apple, Microsoft"
              formControlName="companyName">
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="title-container mb-3" *ngIf="!profileImage">
          <label>{{ 'EDIT_COMPANY_DETAILS.COMPANY_NAME_TEXT' | translate }}</label>
          <div class="form-group">
            <input type="text" class="form-control" formControlName="companyName"
              placeholder="i.e. Google, Apple, Microsoft">
          </div>
        </div>
      </div>


      <div class="col-lg-6" *ngIf="!profileImage">
      </div>

      <div class="col-12 mb-3" *ngIf="profileImage">
        <hr style="border: dashed 1px #868686">
      </div>

      <div class="col-12 col-lg-12 mb-3">
        <div class="title-container mb-3">
          <label>{{ 'EDIT_COMPANY_DETAILS.COMPANY_DESCRIPTION' | translate }}</label>
          <div class="form-group">
            <textarea type="text" class="form-control"
              placeholder="Subject to the terms and conditions set forth in this Agreement, Company will perform the Services described in each Quote/Proposal. Company retains ownership of any portion of Company developed tools or products that are used in or form a part of computer programs or documentation resulting from a particular service provided."
              rows="4" formControlName="companyDetails"></textarea>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6 mb-3" *ngIf="industry$ | async as industries">
        <div class="title-container mb-3">
          <label>{{ 'EDIT_COMPANY_DETAILS.TYPE_INDUSTRY' | translate }}</label>
          <select class="form-select" formControlName="industryId">
            <option selected disabled [ngValue]="null">Select Industry</option>
            <ng-container *ngFor="let item of industries; let i = index">
              <option [value]="item.id">{{item.name}}</option>
            </ng-container>
          </select>
        </div>

        <div class="title-container mb-3">
          <label>{{ 'EDIT_COMPANY_DETAILS.NUMBER_OF_EMPLOYEES' | translate }}</label>
          <div class="form-group">
            <input type="number" class="form-control" placeholder="0-1000" formControlName="numberOfEmployee">
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6 mb-3" *ngIf="workSetup$ | async as workSetup">
        <div class="title-container mb-3">
          <label>Work Setup</label>
          <select class="form-select" formControlName="workSetupId">
            <option selected disabled [ngValue]="null">Select Work Setup</option>
            <ng-container *ngFor="let item of workSetup; let i = index">
              <option [value]="item.id">{{item.name}}</option>
            </ng-container>
          </select>
        </div>
      </div>

      <!-- CONTACT DETAILS -->
      <div class="col-12 mt-2">
        <h5 class="title-label">Contact Details</h5>
        <hr style="border: dashed 1px #868686">
      </div>

      <div class="row">
        <div class="col-12 col-lg-6 mb-3">
          <div class="title-container mb-3">
            <label>Email</label>

            <div class="form-group">
              <input type="email" class="form-control" placeholder="sample.email@gmail.com"
                formControlName="companyEmail">
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6 mb-3">
          <div class="title-container mb-3">
            <label>Work Phone</label>

            <div class="form-group">
              <input type="text" class="form-control" placeholder="000-000000" formControlName="companyContactNumber">
            </div>
          </div>
        </div>
      </div>
      <div class="row" *ngIf="rawAddress">
        <label>Company Address</label>
        <app-google-address-search [rawAddress]="rawAddress" (addressChange)="addressChange($event)"></app-google-address-search>
      </div>
    </div>
  </div>
</form>
