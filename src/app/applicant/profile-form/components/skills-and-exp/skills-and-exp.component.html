<div class="card card-body mt-3" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
  <div class="row mt-3">
    <div class="col-12 col-md-6 mb-3">
      <label class="text-center">Professional Skills</label>

      <div class="form-group d-flex with-add search-group" style="height: 60px;">
        <input type="text" name="search" class="form-control form-control-main" formControlName="skillsTxt"
          style="background: white !important" placeholder="ex. Data Encoding, Ruby, JavaScript"
          (keyup.up)="addItem('skillsTxt', this.professionalSkills)">
        <button class="btn btn-add-now" (click)="addItem('skillsTxt', this.professionalSkills)">
          Add
        </button>
      </div>

      <div class="d-flex flex-wrap">
        <div class="mt-3 d-flex" *ngIf="professionalSkills && professionalSkills.controls.length > 0">
          <ng-container *ngFor="let item of professionalSkills.controls; let i = index">
            <div class="flex-wrap me-2">
              <h5 class="w-100 requirement-badge">
                {{item.value}}
                <img src="/assets/images/placeholder/icons/remove-white.png" style="height: 10px; margin-top: 3px"
                  class="ms-2 float-end" (click)="removeItem(i, this.professionalSkills)">
              </h5>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>

<div [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
  <div class="my-3 ms-2 w-100">
    <h5 class="mt-3 main-title">Work Experience</h5>
  </div>
  <div class="ms-2 w-100 text-center card m-0 py-3">
    <img src="assets/images/empty-list-grayscale.png" style="width: 5rem" class="text-center mx-auto" />
    <h5 class="text-center sub-title">No Work Experience</h5>
    <button class="btn btn-light-red mx-auto w-20 text-primary-red" type="button">
      Add</button>
  </div>
</div>
