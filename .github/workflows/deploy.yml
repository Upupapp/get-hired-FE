name: Deploy to Linode

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production
        run: NODE_OPTIONS=--max-old-space-size=4096 npx ng build --configuration production

      - name: Deploy to active GetHired web roots
        env:
          LINODE_HOST: ${{ secrets.LINODE_HOST }}
          LINODE_USER: ${{ secrets.LINODE_USER }}
          LINODE_SSH_KEY: ${{ secrets.LINODE_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$LINODE_SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$LINODE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" dist/get-hired/ "$LINODE_USER@$LINODE_HOST:/var/www/gethired/.deploy-staging/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$LINODE_USER@$LINODE_HOST" 'set -e; found=0; for live_dir in $(nginx -T 2>/dev/null | sed -n "s/^[[:space:]]*root[[:space:]]*\([^;]*\);/\1/p" | sort -u); do case "$live_dir" in /var/www/gethired*) if [ -f "$live_dir/index.html" ]; then rsync -a --delete /var/www/gethired/.deploy-staging/ "$live_dir/"; found=1; fi ;; esac; done; test "$found" -eq 1; nginx -s reload'
          echo "Deploy complete."
