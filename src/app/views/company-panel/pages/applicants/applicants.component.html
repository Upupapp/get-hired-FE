<div class="mt-4 ps-4 pe-4" id="job-order-main-container">
	<div [@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}">
		<div class="card card-body py-3">
			<div class="w-100">
				<div class="float-end">			
					<button class="btn btn-add-service" (click)="inviteApplicant()">
						Invite Applicant
						<img src="/assets/images/placeholder/icons/add-new.png" 
						style="width: 16px;" class="ms-1">
					</button>
				</div>

				<div class="float-end me-2">
					<button class="btn btn-save-draft" (click)="goBack()">Back</button>
				</div>

				<span class="main-title mt-3 mb-0">
				{{selectedJob?.id}} - {{selectedJob?.title}}

				</span> (<small>{{selectedJob?.work_setup}}, {{selectedJob?.job_type}}</small>)

				<span class="d-flex flex-wrap">
					<ng-container *ngFor="let tag of selectedJob?.tags, 'skill_requirements'">
						<span class="flex-wrap me-2 talent-badge">{{tag}}
						</span>
					</ng-container>
				</span>
				

				

				
				
			</div>
		</div>
		<br>
		<div class="card card-body" *ngIf="listView && !loading">
			<!-- <app-reusable-org-chart></app-reusable-org-chart>
			 --><app-reusable-table
				[loading]="loading"
				[statusArray]="status"
				[statusFilter]="true"
				statusName="Status"
				(updateSelectedRowDialog)="viewMenu($event)"
				(viewDetails)="viewMenu($event)"			
				[componentTitle]="'Applicants'"								
				[displayedColumns]="displayedColumns"
				[selectedColumns]="selectedColumns"
				[selectedColumnsMobile]="selectedColumns"
				[searchSource]="searchSource"
				[maxRows]="10"
				[listDataSource]="applicantLists">
			</app-reusable-table>
		</div>


		<!-- LOADING ANIMATION SCREEN -->
		<custom-profile-loader 
			[withSideBar]="false"
			[fromDetailTab]="true"
			[loading]="loading">
		</custom-profile-loader>
	</div>
</div>
