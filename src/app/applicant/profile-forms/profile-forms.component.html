<div class="bg-gray position-relative" *ngIf="!loading">
  <div class="bg-upper-gray">
    <app-main-stepper [stepper]="stepper" [stepperItems]="stepperItems"
      (changeStepper)="saveProgressConfirmation($event)">
    </app-main-stepper>
  </div>
  <div class="text-end submit-container" [@animate]="{value:'*', params:{ y:'10px', delay:  (150) + 'ms' }}">
    <!-- Every section (skills, work experience, education, docs, video) already
         saves itself independently the moment it's submitted -- nothing on this
         final step is required to "complete" the profile. This button was the
         only way to leave the wizard once here, but its old "Profile Preview"
         label read as purely informational, not as an explicit finish action --
         relabeled on Step 3 specifically so it's unambiguous that clicking it
         is how you're done, video/docs optional. -->
    <button class="btn btn-save-draft me-3" *ngIf="applicantProfileId" (click)="redirectToProfile()">{{
      stepper === 3 ? 'Finish & View Profile' : 'Profile Preview'
    }}</button>
    <!-- <button class="btn btn-save me-2" type="button" (click)="basicInfo.submitForm()" *ngIf="stepper==1"
      [disabled]="basicInfo ? !basicInfo.profileDetailsForm.valid : !basicFormValid">
      Submit Changes</button> -->
      <!-- BUGFIX (QA JS-14, P1): this used to stay [disabled] while the
           form was invalid -- Step 1's own required-field validation is
           still mandatory before advancing, unchanged, but a disabled
           button silently explains nothing, so clicking it while empty
           looked like Next simply didn't work. Now always clickable
           (only guarded against double-submit while a save is already in
           flight); saveProgressConfirmation(2) -> saveProgress() ->
           basicInfo.submitForm() already marks every field touched and
           shows a clear error toast when invalid -- that path just could
           never be reached by a click before. -->
      <button class="btn btn-save me-2" type="button" (click)="saveProgressConfirmation(2)" *ngIf="stepper==1"
      [disabled]="basicInfo?.submitting">
      Next</button>
      <button class="btn btn-save me-2" type="button" (click)="saveProgressConfirmation(3)" *ngIf="stepper==2">
      Next</button>
  </div>
</div>

<div class="p-4 mt-5">
  <ng-container *ngIf="stepper === 1">
    <app-profile-basic-info [user]="user" (submitBasicInfo)="submitBasicInfo($event)"
      (saveResult)="onBasicInfoSaveResult($event)"></app-profile-basic-info>
  </ng-container>
  <ng-container *ngIf="stepper === 2 && applicantProfileId">
    <app-skills-experience [user]="user" [applicantProfileId]="applicantProfileId"></app-skills-experience>
  </ng-container>
  <ng-container *ngIf="stepper === 3 && applicantProfileId">
    <app-docs-videocv [user]="user" [applicantProfileId]="applicantProfileId"></app-docs-videocv>
  </ng-container>
</div>
