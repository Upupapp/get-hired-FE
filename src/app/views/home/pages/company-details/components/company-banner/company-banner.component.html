
<div class="main-banner"
[@animate]="{value:'*', params:{ y:'-10px', delay: (150) + 'ms' }}">
	<div class="float-end" style="margin-top: -40px;">
		<div class="d-flex">
			<img src="/assets/images/placeholder/icons/star.svg" width="17" height="17" class="me-1">
			<img src="/assets/images/placeholder/icons/star.svg" width="17" height="17" class="me-1">
			<img src="/assets/images/placeholder/icons/star.svg" width="17" height="17" class="me-1">
			<img src="/assets/images/placeholder/icons/star.svg" width="17" height="17" class="me-1">
			<img src="/assets/images/placeholder/icons/star.svg" width="17" height="17" class="me-2">

			(4.5) Rating
		</div>
	</div>

	<img [src]="bannerImage ? bannerImage?.file : '/assets/images/placeholder/job-post-banner.png'" class="banner-image-main" [ngStyle]="{
		'height': bannerHeight + 'px'
	}">
	
	<div class="row bg-details" id="bg-details">
		<div class="col-12 col-lg-12">
			<div class="card-transparent text-center">
				
				<img [src]="companyData?.logo" class="company-logo">
				<div class="row">
					<div class="col-12 col-lg-10 offset-lg-1">
						<h5 class="title-company">{{companyData?.name}} ({{companyData?.type}})</h5>
						<p class="title-verified">{{ 'EMPLOYER_BRANDING.VERIFIED_BADGE' | translate }}
							<img src="/assets/images/placeholder/icons/verified-employer.png" 
							style="height: 40px; margin-top: 5px; margin-left: -10px;">

							{{companyData?.number_of_employee}} Employees
						</p>

						<div class="px-lg-5">
							<h5 class="title-company-description">
								{{firstSentence}}
							</h5>
							<p>
								{{companyData?.description}}
							</p>
						</div>

						<div class="d-flex align-items-center justify-content-center">
							<button class="btn btn-review">Write a review</button>
							<img src="/assets/images/placeholder/icons/share-2.png" 
							title="Share"
							class="ms-2 hvr-grow share">
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

</div>
