<div class="gh-404">
  <div class="gh-404__card">

    <div class="gh-404__brandbar">
      <span class="gh-404__brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2C8 6 5 9 5 14a7 7 0 0014 0c0-5-3-8-7-12z" fill="#FF5A36"/>
        </svg>
        <span class="gh-404__brand-text">GET<span class="gh-404__brand-accent">HIRED</span></span>
      </span>
    </div>

    <div class="gh-404__body">
      <p class="gh-404__code">404</p>
      <h1 class="gh-404__title">Page Not Found</h1>
      <p class="gh-404__description">
        The page you are looking for doesn't seem to be available.
        Try browsing open jobs or return to the homepage.
      </p>

      <div class="gh-404__illustration">
        <img
          src="/assets/images/404_3d_img.png"
          alt=""
          aria-hidden="true"
          width="420"
          height="252"
        />
      </div>

      <div class="gh-404__actions">
        <button type="button" class="gh-404__btn gh-404__btn--primary hvr-grow" (click)="goToJobs()">Browse Jobs</button>
        <button type="button" class="gh-404__btn gh-404__btn--secondary hvr-grow" (click)="goHome()">Go to Homepage</button>
      </div>

      <nav aria-label="Recovery navigation" class="gh-404__links">
        <a href="/home">Homepage</a>
        <a href="/jobs">Browse Jobs</a>
      </nav>
    </div>

  </div>
</div>
