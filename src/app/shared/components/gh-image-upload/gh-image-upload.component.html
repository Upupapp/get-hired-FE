<div class="gh-image-upload" [class.gh-image-upload--disabled]="disabled" [class.gh-image-upload--drag-over]="isDragOver">

  <!-- Hidden file input -->
  <input
    #fileInput
    type="file"
    [accept]="accept"
    class="gh-image-upload__input"
    aria-hidden="true"
    (change)="onFileChange($event)"
  />

  <!-- Label -->
  <span class="gh-image-upload__label" *ngIf="label">{{ label }}</span>

  <!-- Drop zone / preview -->
  <div
    class="gh-image-upload__zone"
    [class.gh-image-upload__zone--circle]="previewShape === 'circle'"
    [class.gh-image-upload__zone--wide]="previewShape === 'wide'"
    [class.gh-image-upload__zone--has-preview]="hasPreview"
    [class.gh-image-upload__zone--uploading]="state === 'uploading'"
    [class.gh-image-upload__zone--error]="state === 'error'"
    (click)="onPickFile()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
    role="button"
    [attr.aria-label]="hasPreview ? 'Change image' : 'Upload image'"
    tabindex="0"
    (keydown.enter)="onPickFile()"
    (keydown.space)="onPickFile()"
  >

    <!-- Preview image -->
    <ng-container *ngIf="hasPreview && state !== 'uploading'">
      <img
        [src]="displayUrl"
        class="gh-image-upload__preview"
        [class.gh-image-upload__preview--circle]="previewShape === 'circle'"
        alt="Image preview"
        loading="lazy"
      />
      <div class="gh-image-upload__overlay">
        <span class="gh-image-upload__overlay-icon" aria-hidden="true">&#128247;</span>
        <span class="gh-image-upload__overlay-text">Change</span>
      </div>
    </ng-container>

    <!-- Uploading spinner -->
    <ng-container *ngIf="state === 'uploading'">
      <div class="gh-image-upload__spinner" aria-label="Uploading…" role="status">
        <svg class="gh-image-upload__spinner-svg" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="16" fill="none" stroke-width="3" />
        </svg>
        <span class="gh-image-upload__spinner-label">Optimizing…</span>
      </div>
    </ng-container>

    <!-- Empty state -->
    <ng-container *ngIf="!hasPreview && state !== 'uploading'">
      <div class="gh-image-upload__empty">
        <svg class="gh-image-upload__empty-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
          <path d="M3 15l5-4 4 3 3-2 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="gh-image-upload__empty-cta">Click or drag to upload</span>
        <span class="gh-image-upload__hint" *ngIf="hint">{{ hint }}</span>
      </div>
    </ng-container>

  </div>

  <!-- Success badge -->
  <div class="gh-image-upload__savings" *ngIf="state === 'success' && savingsPercent > 0" aria-live="polite">
    <span class="gh-image-upload__savings-badge">{{ savingsPercent | number:'1.0-0' }}% smaller · looks the same</span>
  </div>

  <!-- Error message -->
  <div class="gh-image-upload__error" *ngIf="state === 'error' && errorMessage" role="alert" aria-live="assertive">
    {{ errorMessage }}
  </div>

  <!-- Clear button -->
  <button
    *ngIf="hasPreview && state !== 'uploading'"
    type="button"
    class="gh-image-upload__clear gh-pressable"
    (click)="onClear(); $event.stopPropagation()"
    aria-label="Remove image"
  >
    Remove
  </button>

</div>
