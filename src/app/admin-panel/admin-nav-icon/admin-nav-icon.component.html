<svg [attr.width]="size" [attr.height]="size" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true" focusable="false">
  <ng-container [ngSwitch]="name">
    <ng-container *ngSwitchCase="'dashboard'">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
    </ng-container>
    <ng-container *ngSwitchCase="'users'">
      <circle cx="9" cy="7" r="4"/>
      <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
    </ng-container>
    <ng-container *ngSwitchCase="'jobs'">
      <rect x="3" y="7" width="18" height="13" rx="2"/>
      <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </ng-container>
    <ng-container *ngSwitchCase="'companies'">
      <rect x="4" y="3" width="16" height="18" rx="1"/>
      <path d="M8 7h2M12 7h2M8 11h2M12 11h2M8 15h2M12 15h2"/>
    </ng-container>
    <ng-container *ngSwitchCase="'finance'">
      <rect x="2" y="5" width="20" height="14" rx="2"/>
      <path d="M2 10h20"/>
    </ng-container>
    <ng-container *ngSwitchCase="'applications'">
      <path d="M8 6h13"/>
      <path d="M8 12h13"/>
      <path d="M8 18h13"/>
      <path d="M3 6h.01"/>
      <path d="M3 12h.01"/>
      <path d="M3 18h.01"/>
    </ng-container>
    <ng-container *ngSwitchCase="'alerts'">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
      <path d="M10.3 21a1.7 1.7 0 0 0 3.4 0"/>
    </ng-container>
    <ng-container *ngSwitchDefault>
      <path d="M14.7 6.3a4.5 4.5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a4.5 4.5 0 0 0 6.4-6.4l-2.8 2.8-2.2-2.2 2.8-2.8z"/>
    </ng-container>
  </ng-container>
</svg>
