runtime: nodejs14

handlers:
  - url: /
    secure: always
    static_files: dist/get-hired/index.html
    upload: dist/get-hired/index.html

  #  Routing rules for resources, css, js, images etc. Any file with format filename.ext
  - url: /(.*\.(.+))$
    secure: always
    static_files: dist/get-hired/\1
    upload: dist/get-hired/(.*\.(.+))$

  #  Routing rule for Angular Routing
  - url: /(.*)
    secure: always
    static_files: dist/get-hired/index.html
    upload: dist/get-hired/index.html
