<div class="card card-body mt-3" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
	<div class="row">
		<div class="col-12">
			<h5 class="title-label"><span *ngIf="length !== 1">{{index}}.</span> Educational Background
				<span class="float-end btn btn-add"  *ngIf="length !== 1" 
				(click)="removeEducationBackground(index)">
					<img src="/assets/images/placeholder/icons/remove-gray.png" style="height: 15px">
				</span>

				<span class="float-end btn btn-add" (click)="addEducationBackground()">Add Item</span>
			</h5>
			<hr style="border: dashed 1px #868686">
		</div>

		<div class="col-12 col-lg-6">
			<div class="title-container mb-3">
				<label>Level of Education</label>
				<select class="form-select" [(ngModel)]="education_background.level_of_education">
					<option selected disabled value="">Select Level of Education</option>
					<ng-container *ngFor="let item of levelOfEducation; let i = index">
						<option [value]="item">{{item}}</option>
					</ng-container>
				</select>
			</div>

			<!-- <div class="title-container mb-3">
				<label>Time Period</label>
				<div class="form-check">
				  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
				  <label class="form-check-label" for="flexCheckDefault">
				    I currently work here
				  </label>
				</div> 
			</div>-->

			<div class="row">
				<div class="col-12 col-lg-6">
					<div class="title-container mb-3">
						<label>Start Date</label>
						<select class="form-select" [(ngModel)]="start_date.month">
							<option selected disabled value="">Select Month</option>
							<ng-container *ngFor="let item of month; let i = index">
								<option [value]="item">{{item}}</option>
							</ng-container>
						</select>
					</div>
				</div>

				<div class="col-12 col-lg-6">
					<div class="title-container mb-3 select-option">
						<label> </label>
						<select class="form-select" [(ngModel)]="start_date.year">
							<option selected disabled value="">Select Year</option>
							<ng-container *ngFor="let item of year; let i = index">
								<option [value]="item">{{item}}</option>
							</ng-container>
						</select>
					</div>
				</div>
			</div>

			<div class="row">
				<div class="col-12 col-lg-6">
					<div class="title-container mb-3">
						<label>End Date</label>
						<select class="form-select" [(ngModel)]="end_date.month">
							<option selected disabled value="">Select Month</option>
							<ng-container *ngFor="let item of month; let i = index">
								<option [value]="item">{{item}}</option>
							</ng-container>
						</select>
					</div>
				</div>

				<div class="col-12 col-lg-6">
					<div class="title-container mb-3">
						<label> </label>
						<select class="form-select" [(ngModel)]="end_date.year">
							<option selected disabled value="">Select Year</option>
							<ng-container *ngFor="let item of year; let i = index">
								<option [value]="item">{{item}}</option>
							</ng-container>
						</select>
					</div>
				</div>
			</div>
		</div>

		<div class="col-12 col-lg-6">
			<div class="title-container mb-3">
				<label>Field of Study</label>
				<div class="form-group">
					<input type="text"  class="form-control" 
					[(ngModel)]="education_background.field_of_study"
					placeholder="i.e. Communication, Engineering, Advertising, Psychology, etc" >
				</div>
			</div>

			<div class="title-container mb-3">
				<label>School</label>
				<div class="form-group">
					<input type="text"  class="form-control" 
					[(ngModel)]="education_background.school"
					placeholder="Name of the University or School" >
				</div>
			</div>

			<div class="title-container mb-3">
				<label>School Address</label>
				<div class="form-group">
					<input type="text"  class="form-control" 
					[(ngModel)]="education_background.school_address"
					placeholder="School Location or Landmark" >
				</div>
			</div>

			<!-- <div class="title-container mb-3">
				<label>Description</label>
				<div class="form-group">
					<textarea type="text"  class="form-control" placeholder="Subject to the terms and conditions set forth in this Agreement, Company will perform the Services described in each Quote/Proposal. Company retains ownership of any portion of Company developed tools or products that are used in or form a part of computer programs or documentation resulting from a particular service provided. " rows="9"></textarea>
				</div>
			</div> -->
		</div>
	</div>
</div>
