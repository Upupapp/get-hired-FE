<div class="applications-page">
  <h1 class="applications-title">My Applications</h1>

  <app-inline-loading *ngIf="loading"></app-inline-loading>

  <div class="applications-error" *ngIf="error && !loading" role="alert">
    <p>We couldn't load your applications right now.</p>
    <button type="button" class="btn-link-cta" (click)="retry()">Try again</button>
  </div>

  <ng-container *ngIf="!loading && !error">
    <div class="applications-list" *ngIf="applications.length > 0">
      <div class="application-row" *ngFor="let app of applications; trackBy: trackByAppId">
        <div class="application-row-header">
          <div class="application-row-info">
            <h3>{{ app.jobTitle }}</h3>
            <p>{{ app.companyName }}</p>
            <span class="application-status">{{ app.applicantStatusName || 'Submitted' }}</span>
          </div>

          <!-- Completeness badge: compact pill shown in the list row -->
          <div class="application-row-badge" *ngIf="app.jobApplicationId">
            <button type="button"
                    class="app-completeness-toggle"
                    [attr.aria-expanded]="expandedSnapshotId === app.jobApplicationId"
                    [attr.aria-controls]="'completeness-' + app.jobApplicationId"
                    (click)="toggleSnapshot(app.jobApplicationId)"
                    title="View application completeness details">
              <app-application-completeness-badge
                [level]="snapshotsLoaded ? snapshotFor(app.jobApplicationId)?.completenessLevel ?? null : null"
                [score]="snapshotsLoaded ? snapshotFor(app.jobApplicationId)?.completenessScore ?? null : null"
                [loading]="!snapshotsLoaded"
                [compact]="true">
              </app-application-completeness-badge>
              <span class="app-completeness-toggle-chevron"
                    [class.app-completeness-toggle-chevron--open]="expandedSnapshotId === app.jobApplicationId"
                    aria-hidden="true">&#8250;</span>
            </button>
          </div>
        </div>

        <!-- Expandable completeness detail card -->
        <div class="app-snapshot"
             *ngIf="app.jobApplicationId && expandedSnapshotId === app.jobApplicationId"
             [id]="'completeness-' + app.jobApplicationId"
             role="region"
             aria-label="Application completeness details"
             aria-live="polite"
             aria-atomic="false">
          <app-application-completeness-card
            [snapshot]="snapshotsLoaded ? snapshotFor(app.jobApplicationId) : null"
            [loading]="!snapshotsLoaded"
            [error]="snapshotsError"
            (retryClick)="onSnapshotRetry()">
          </app-application-completeness-card>
        </div>

        <div class="app-row-actions">
          <button type="button" class="btn-link-cta" (click)="toggleMessages(app.jobId)">
            {{ expandedJobId === app.jobId ? 'Hide messages' : 'Message employer' }}
          </button>
        </div>

        <div class="application-row-messages" *ngIf="expandedJobId === app.jobId">
          <app-message-thread
            [jobId]="app.jobId"
            [otherPartyLabel]="app.companyName || 'the employer'"
            currentUserRole="applicant">
          </app-message-thread>
        </div>
      </div>
    </div>

    <div class="applications-empty" *ngIf="applications.length === 0">
      <h2>No applications yet</h2>
      <p>Find a job that fits your profile and start your first application.</p>
      <button type="button" class="btn-cta-primary" (click)="goToJobs()">Find jobs</button>
    </div>
  </ng-container>
</div>
