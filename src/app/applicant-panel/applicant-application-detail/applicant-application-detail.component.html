<div class="aad-page">

  <!-- Back navigation -->
  <button type="button" class="aad-back" (click)="goBack()">
    <span aria-hidden="true">‹</span> My Applications
  </button>

  <!-- Application metadata header (populated from list navigation state) -->
  <div class="aad-header" *ngIf="jobTitle || companyName">
    <h1 class="aad-job-title">{{ jobTitle || 'Application' }}</h1>
    <p class="aad-company" *ngIf="companyName">{{ companyName }}</p>
    <span class="aad-status" *ngIf="statusName">{{ statusName }}</span>
  </div>
  <h1 class="aad-job-title" *ngIf="!jobTitle && !companyName">Application Details</h1>

  <!-- Completeness card: uses the single endpoint (includes snapshotCreatedAt) -->
  <section class="aad-completeness" aria-label="Application completeness">
    <h2 class="aad-section-title">Application completeness</h2>
    <app-application-completeness-card
      [snapshot]="snapshot"
      [loading]="loading"
      [error]="error"
      [applicationId]="applicationId"
      (retryClick)="retry()">
    </app-application-completeness-card>
  </section>

</div>
