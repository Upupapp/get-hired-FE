<div *ngIf="!loading && restrictions$ | async">
  <!-- CONTROLS -->
  <section
    class="bg-upper-gray"
    style="width:83%"
    [ngStyle]="{
      position: delayControl ? '' : 'fixed',
      top: delayControl ? '' : '80px'
    }"
  >
    <div class="card card-body py-3 d-flex flex-row justify-content-between">
        <span class="col-12 col-md-8 main-title">{{ jobId ? 'Update':'Create' }} a Job</span>

        <span class="col-12 col-md-4 d-flex align-items-center justify-content-end">
          <ng-template [ngTemplateOutlet]="stepperButtons"></ng-template>
        </span>
    </div>

    <div class="mt-3">
      <div class="mt-2" [ngClass]="delayControl ? 'd-none' : 'adjust-flex'">
        <!-- <span class="text-primary-red cursor-pointer me-2"
        (click)="saveAsDraft()" *ngIf="initialFormValid && status === 1">Save as Draft</span> -->
        <button
            *ngIf="initialFormValid && status === 1"
            class="btn btn-create-interview me-2"
            (click)="saveAsDraft()"
          >
            Save as Draft
          </button>

          <button class="btn btn-create-interview me-2" (click)="cancel()">
            Cancel
          </button>
      </div>

      <app-main-stepper
        [stepper]="stepper"
        [stepperItems]="stepperItems"
        (changeStepper)="changeStep($event)">
      </app-main-stepper>
    </div>
  </section>

  <!-- FORM -->
  <div class="py-4" style="position: relative">
    <form [formGroup]="jobForm">
      <section
        class="py-3"
        id="job-create-forms"
        [ngStyle]="{ 'margin-top': delayControl ? '-30px' : '140px' }"
        style="padding-left: 25px; padding-right: 45px"
      >
        <ng-container *ngIf="stepper === 1">
          <app-job-post-detail-step
            formGroupName="initialData"
          ></app-job-post-detail-step>
        </ng-container>

        <ng-container *ngIf="stepper === 2">
          <app-create-job-post-step
            formGroupName="jobInfo"
          ></app-create-job-post-step>
        </ng-container>

        <ng-container *ngIf="stepper === 3">
          <app-create-interview-questions
            (publishChanges)="publishJobPost()"
            [questions]="questions"
            [jobId]="jobId"
            formGroupName="interview"
          ></app-create-interview-questions>
        </ng-container>

        <ng-container *ngIf="stepper === 4">
          <app-preview-job-post-step></app-preview-job-post-step>
        </ng-container>
      </section>

      <!-- <div class="card card-body py-3">
      <div class="w-100">
        <div class="text-end">
          <button class="btn btn-add-service me-2" (click)="cancel()">
            Cancel
          </button>

          <button class="btn btn-save-draft" (click)="saveAsDraft()" [disabled]="!initialFormValid">
            Save as Draft
          </button>

          <ng-template [ngTemplateOutlet]="stepperButtons"></ng-template>

        </div>
      </div>
    </div> -->
    </form>

    <ng-template #stepperButtons>
      <button
        class="btn btn-add-service me-2"
        (click)="changeStep(2)"
        *ngIf="stepper == 1"
        [disabled]="!initialFormValid"
        type="submit"
      >
        Next<ng-container >: Job Requirements</ng-container>
      </button>

      <button
        class="btn btn-save-draft me-2"
        (click)="changeStep(1)"
        *ngIf="stepper == 2"
      >
        <ng-container *ngIf="screenWidth < 1281">
          <img src="/assets/images/placeholder/icons/caret-left.png" style="height: 10px">
        </ng-container>
        <ng-container *ngIf="screenWidth >= 1281">Prev: Job Details</ng-container>
      </button>

      <button
        class="btn btn-add-service me-2"
        (click)="changeStep(3)"
        *ngIf="stepper == 2"
        [disabled]="!jobInfoValid"
      >
        Next<ng-container >: Create Interview</ng-container>
      </button>

      <button
        class="btn btn-save-draft me-2"
        (click)="changeStep(2)"
        *ngIf="stepper == 3"
      >
        <ng-container *ngIf="screenWidth < 1281">
          <img src="/assets/images/placeholder/icons/caret-left.png" style="height: 10px">
        </ng-container>
        <ng-container *ngIf="screenWidth >= 1281">Prev: Job Requirements</ng-container>
      </button>

      <button
        class="btn btn-add-service me-2"
        (click)="changeStep(4)"
        *ngIf="stepper == 3"
        [disabled]="!interviewValid"
      >
        Next<ng-container >: Preview Job Post</ng-container>
      </button>

      <button
        class="btn btn-save-draft me-2"
        (click)="changeStep(3)"
        *ngIf="stepper == 4"
      >
        <ng-container *ngIf="screenWidth < 1281">
          <img src="/assets/images/placeholder/icons/caret-left.png" style="height: 10px">
        </ng-container>
        <ng-container *ngIf="screenWidth >= 1281">Prev: Create Interview</ng-container>
      </button>

      <!-- B05 V1: Publish button with loading state (spinner while saving)
           and micro-scale press effect (defined in job-create.component.scss).
           Disabled while loading to prevent double-submit. -->
      <button
        class="btn btn-add-service me-2 btn-publish-post"
        (click)="publishJobPost()"
        *ngIf="stepper == 4"
        [disabled]="!isAllowedToPublish || loading"
        [attr.aria-label]="loading ? 'Publishing...' : 'Publish Job Post'"
      >
        <span *ngIf="!loading">Publish Job Post</span>
        <span *ngIf="loading" class="btn-publish-loading" aria-live="polite">
          <span class="publish-spinner" aria-hidden="true"></span>
          Publishing...
        </span>
      </button>

      <span *ngIf="!isAllowedToPublish && stepper == 4" class="cursor-pointer" (click)="restrictJobCreation(true)"><i class="bi bi-exclamation-circle text-danger fs-3"></i></span>

    </ng-template>
  </div>
</div>

<div class="mt-5">
  <app-inline-loading *ngIf="!(!loading && restrictions$ | async)"></app-inline-loading>
</div>
