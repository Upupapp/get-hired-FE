<!-- INTERVIEW QUESTIONS -->
<section class="card card-body my-3">
	<div class="p-4">
		<div class="d-flex">
			<label class="title-job-interview text-capitalize me-3" 
			[ngClass]="interviewTab === 'questions' ? 'active' : ''"
			(click)="interviewTab = 'questions'">Interview Questions</label>

			<label class="title-job-answer text-capitalize"
			[ngClass]="interviewTab === 'answers' ? 'active' : ''"
			(click)="interviewTab = 'answers'">Interview Answers</label>
		</div>

		<hr style="color: #6e6e6e">

		<ng-container *ngIf="interviewTab === 'questions'">
			<section class="interview-card card-body p-2 px-1 mb-1" 
				id="interview-list"
				*ngFor="let item of interview_questions; let i = index">
				<!-- INTERVIEWS -->
				<div class="row" [@animate]="{value:'*', params:{ y:'10px', delay:  (i * 150) + 'ms' }}">
					<div class="col-12">
						<div class="float-end">
							<div class="mt-3 me-2">
								<button class="btn btn-upload me-2">Upload</button>

								<button class="btn btn-record"
								routerLink="/job-post/answer-interview/{{data?.id}}/{{i + 1}}"><img src="/assets/images/placeholder/icons/make-video.png" style="height: 10px" class="me-2">Record Interview</button>
							</div>
						</div>

						<div class="d-flex">
							<div class="logo-thumbnail me-3 d-flex align-items-center justify-content-center">
								<img src="/assets/images/placeholder/icons/interview-logo-4.png">
							</div>

							<div class="logo-thumbnail-2 me-3 d-flex align-items-center justify-content-center">
								<img src="/assets/images/placeholder/icons/interview-logo-4-active.png">
							</div>

							<div class="mt-3">
								<p class="title-label-sub">
									<img src="/assets/images/placeholder/icons/interview-logo-3.png" class="me-2" style="height: 20px;">
									Question {{i + 2}}
								</p>
								<h5 class="title-label">{{item}}</h5>
								<p class="title-label-sub-duration"><span>Estimated Duration:</span> 3 minutes</p>
							</div>
						</div>
					</div>
				</div>
			</section>
		</ng-container>

		<ng-container *ngIf="interviewTab === 'answers'">
			<section class="interview-card card-body p-2 px-1 mb-1" 
				id="interview-list"
				*ngFor="let item of interview_answers; let i = index">
				<!-- INTERVIEWS -->
				<div class="row" [@animate]="{value:'*', params:{ y:'10px', delay:  (i * 150) + 'ms' }}">
					<div class="col-12">
						<div class="float-end">
							<div class="mt-3 me-2">
								<button class="btn btn-upload me-2">Upload</button>

								<button class="btn btn-record"
								routerLink="/job-post/answer-interview/{{data?.id}}/{{i + 1}}"><img src="/assets/images/placeholder/icons/retake-interview.png" style="height: 10px" class="me-2">Retake</button>
							</div>
						</div>

						<div class="d-flex">
							<div class="logo-thumbnail me-3 d-flex align-items-center justify-content-center">
								<img src="/assets/images/placeholder/icons/interview-logo-4.png">
							</div>

							<div class="logo-thumbnail-2 me-3 d-flex align-items-center justify-content-center">
								<img src="/assets/images/placeholder/icons/interview-logo-4-active.png">
							</div>

							<div class="mt-3">
								<p class="title-label-sub">
									<img src="/assets/images/placeholder/icons/interview-logo-3.png" class="me-2" style="height: 20px;">
									Answer {{i + 1}}
								</p>
								<h5 class="title-label">{{item}}</h5>
								<p class="title-label-sub-duration"><span>Date Recorded:</span> September 21, 2022 4:00pm</p>
							</div>
						</div>
					</div>
				</div>
			</section>
		</ng-container>
	</div>
</section>
