<div class="row" style="min-height: 30vh">
  <div class="col-12 mb-3 ps-4">
    <h5 class="title-latest-job" [@animate]="{value:'*', params:{ y:'10px', delay: '200ms' }}">{{ label }}

      <button class="btn btn-menu me-3 float-end" (click)="listView ? listView = false : listView = true">
        <img src="/assets/images/placeholder/icons/menu-icon.png" [title]="'Grid View'"
          [@animate]="{value:'*', params:{ scale:'0.7', delay:'200ms' }}" *ngIf="listView" width="15px"
          class="img-fluid">

        <img src="/assets/images/placeholder/icons/list-icon.png"
          [@animate]="{value:'*', params:{ scale:'0.7', delay:'200ms' }}" [title]="'List View'" *ngIf="!listView"
          width="15px" class="img-fluid">
      </button>
    </h5>
    <p class="title-latest-job-description" [@animate]="{value:'*', params:{ y:'10px', delay: '200ms' }}">


      <span [innerHtml]="subLabel"></span>
    </p>
  </div>

  <app-inline-loading *ngIf="loading$ | async"></app-inline-loading>

  <ng-container *ngIf="list$ | async as jobLists">
    <!-- GH-ACT-021/13 fix: emptiness must be checked against the FILTERED
    list, not the raw jobLists -- previously, narrowing a search/filter down
    to zero matches rendered a silently blank grid with no empty state at
    all (jobLists.length was still > 0). The two empty-state blocks also had
    identical, overlapping conditions and would have rendered stacked
    together; now there is exactly one true-empty case and one
    zero-search-results case, each with [search] set correctly so the
    right illustration shows. -->
    <ng-container *ngIf="filterJobList(jobLists) as filteredJobs">
      <ng-container *ngFor="let data of filteredJobs; let i = index">
        <div [ngClass]="listView ? 'col-12 col-md-12 col-lg-6' : 'col-12 col-md-6 col-lg-3'"
          [@animate]="{value:'*', params:{ y:'-10px', delay: (i * 150) + 'ms' }}">
          <ng-container *ngIf="!listView">
            <app-job-card [data]="data" [i]="i"></app-job-card>
          </ng-container>

          <ng-container *ngIf="listView">
            <app-job-card-list-view [data]="data" [i]="i"></app-job-card-list-view>
          </ng-container>
        </div>
      </ng-container>

      <ng-container *ngIf="filteredJobs.length === 0 && !fromSearch && !companyId && !(loading$ | async)">
        <app-empty-section [title]="'No Jobs Created Yet'"
          [subTitle]="'There is no activity at the momemnt, but we <br>can totally solve that.'" [detailSize]="'large'"
          [search]="false"></app-empty-section>
      </ng-container>

      <ng-container *ngIf="filteredJobs.length === 0 && !fromSearch && companyId && !(loading$ | async)">
        <app-empty-section title="{{ 'COMPANY_DETAILS.EMPTY_CONTENT_MESSAGE' | translate }}"
          subTitle="{{ 'COMPANY_DETAILS.EMPTY_CONTENT_SUB' | translate }}" [detailSize]="'large'"
          [search]="false"></app-empty-section>
      </ng-container>

      <ng-container *ngIf="filteredJobs.length === 0 && fromSearch && !(loading$ | async)">
        <app-empty-section [title]="'No jobs match your search'"
          [subTitle]="'Try a different keyword, remove a filter, or browse all open roles.'"
          [detailSize]="'large'" [search]="true"></app-empty-section>
      </ng-container>
    </ng-container>
  </ng-container>

</div>
