<section id="body-main-container" *ngIf="user$ | async as user">

  <!-- MOBILEVIEW: Mobile top bar — visible only below md breakpoint (768px).
       Sticky so it stays visible while scrolling content. -->
  <div class="gh-ap-mobile-topbar d-flex d-md-none" role="banner">
    <button
      class="gh-ap-mobile-menu-btn"
      type="button"
      (click)="openMobileNav()"
      [attr.aria-expanded]="mobileNavOpen"
      [attr.aria-label]="mobileNavOpen ? 'Close navigation menu' : 'Open navigation menu'"
      aria-controls="gh-ap-mobile-drawer">
      <svg class="gh-ap-menu-icon" [class.gh-ap-menu-icon--open]="mobileNavOpen"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <line class="gh-ap-menu-line gh-ap-menu-line--top" x1="3" y1="6" x2="21" y2="6"/>
        <line class="gh-ap-menu-line gh-ap-menu-line--mid" x1="3" y1="12" x2="21" y2="12"/>
        <line class="gh-ap-menu-line gh-ap-menu-line--bot" x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="gh-ap-mobile-topbar-title" aria-hidden="true">GetHired</span>
  </div>

  <!-- MOBILEVIEW: Scrim overlay — dismisses drawer on tap -->
  <div class="gh-ap-mobile-scrim"
       [class.gh-ap-mobile-scrim--visible]="mobileNavOpen"
       (click)="closeMobileNav()"
       aria-hidden="true">
  </div>

  <!-- MOBILEVIEW: Mobile drawer for applicant nav -->
  <nav id="gh-ap-mobile-drawer"
       class="gh-ap-mobile-drawer"
       [class.gh-ap-mobile-drawer--open]="mobileNavOpen"
       role="navigation"
       aria-label="Applicant navigation">

    <div class="gh-ap-drawer-header">
      <img src="assets/images/placeholder/logo.png"
           class="gh-ap-drawer-logo"
           alt="GetHired"
           aria-hidden="true">
      <button class="gh-ap-drawer-close-btn"
              type="button"
              aria-label="Close navigation menu"
              (click)="closeMobileNav()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             width="20" height="20" aria-hidden="true" focusable="false">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <ul class="gh-ap-drawer-nav" role="list">
      <li role="listitem">
        <a #firstApDrawerLink
           routerLink="/user/dashboard"
           routerLinkActive="gh-ap-drawer-nav-item--active"
           [routerLinkActiveOptions]="{exact:true}"
           #rla0="routerLinkActive"
           [attr.aria-current]="rla0.isActive ? 'page' : null"
           class="gh-ap-drawer-nav-item"
           (click)="closeMobileNav()">
          <svg class="gh-ap-drawer-nav-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
          </svg>
          <span class="gh-ap-drawer-nav-label">Dashboard</span>
        </a>
      </li>
      <li role="listitem">
        <a routerLink="/user/profile"
           routerLinkActive="gh-ap-drawer-nav-item--active"
           [routerLinkActiveOptions]="{exact:false}"
           #rla1="routerLinkActive"
           [attr.aria-current]="rla1.isActive ? 'page' : null"
           class="gh-ap-drawer-nav-item"
           (click)="closeMobileNav()">
          <svg class="gh-ap-drawer-nav-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
            <circle cx="12" cy="7" r="4"/>
            <path d="M5.5 21a8.38 8.38 0 0 1 13 0"/>
          </svg>
          <span class="gh-ap-drawer-nav-label">Profile</span>
        </a>
      </li>
      <li role="listitem">
        <a routerLink="/user/jobs"
           routerLinkActive="gh-ap-drawer-nav-item--active"
           [routerLinkActiveOptions]="{exact:false}"
           #rla2="routerLinkActive"
           [attr.aria-current]="rla2.isActive ? 'page' : null"
           class="gh-ap-drawer-nav-item"
           (click)="closeMobileNav()">
          <svg class="gh-ap-drawer-nav-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
          </svg>
          <span class="gh-ap-drawer-nav-label">Find Jobs</span>
        </a>
      </li>
      <li role="listitem">
        <a routerLink="/user/applications"
           routerLinkActive="gh-ap-drawer-nav-item--active"
           [routerLinkActiveOptions]="{exact:false}"
           #rla3="routerLinkActive"
           [attr.aria-current]="rla3.isActive ? 'page' : null"
           class="gh-ap-drawer-nav-item"
           (click)="closeMobileNav()">
          <svg class="gh-ap-drawer-nav-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span class="gh-ap-drawer-nav-label">Applications</span>
        </a>
      </li>
      <li role="listitem">
        <a routerLink="/user/video-answers"
           routerLinkActive="gh-ap-drawer-nav-item--active"
           [routerLinkActiveOptions]="{exact:false}"
           #rla4="routerLinkActive"
           [attr.aria-current]="rla4.isActive ? 'page' : null"
           class="gh-ap-drawer-nav-item"
           (click)="closeMobileNav()">
          <svg class="gh-ap-drawer-nav-icon" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          <span class="gh-ap-drawer-nav-label">Video Answers</span>
        </a>
      </li>
    </ul>

    <div class="gh-ap-drawer-footer">
      <a routerLink="/user/settings"
         class="gh-ap-drawer-settings-link"
         (click)="closeMobileNav()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" width="16" height="16"
             aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </a>
    </div>
  </nav>

  <div class="d-flex" id="body-row">
    <!-- SIDEBAR — hidden on mobile, shown on md+ -->
    <div class="d-none d-md-block" id="sidebar-container">
      <app-applicant-sidebar [user]="user"></app-applicant-sidebar>
    </div>

    <div id="main-applicant-component">
      <!-- Header -->
      <div style="margin-bottom: 80px; ">
        <app-header [isPublic]="false"
        [isUserLoggedIn]="isUserLoggedIn" [user]="user"></app-header>
      </div>

      <div id="sub-applicant-component">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

  <!-- MOBILEVIEW: Applicant mobile bottom nav bar -->
  <nav class="gh-ap-mobile-nav d-flex d-md-none" aria-label="Mobile applicant navigation" role="navigation">
    <a routerLink="/user/dashboard" routerLinkActive="gh-ap-mobile-nav-item--active"
      class="gh-ap-mobile-nav-item" aria-label="Dashboard">
      <svg class="gh-ap-mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" aria-hidden="true" focusable="false">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
      </svg>
      <span class="gh-ap-mobile-nav-label">Home</span>
    </a>
    <a routerLink="/user/jobs" routerLinkActive="gh-ap-mobile-nav-item--active"
      class="gh-ap-mobile-nav-item" aria-label="Find Jobs">
      <svg class="gh-ap-mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" aria-hidden="true" focusable="false">
        <rect x="2" y="7" width="20" height="14" rx="2"/>
        <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
      </svg>
      <span class="gh-ap-mobile-nav-label">Jobs</span>
    </a>
    <a routerLink="/user/applications" routerLinkActive="gh-ap-mobile-nav-item--active"
      class="gh-ap-mobile-nav-item" aria-label="Applications">
      <svg class="gh-ap-mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" aria-hidden="true" focusable="false">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span class="gh-ap-mobile-nav-label">Applied</span>
    </a>
    <a routerLink="/user/profile" routerLinkActive="gh-ap-mobile-nav-item--active"
      class="gh-ap-mobile-nav-item" aria-label="Profile">
      <svg class="gh-ap-mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" aria-hidden="true" focusable="false">
        <circle cx="12" cy="7" r="4"/>
        <path d="M5.5 21a8.38 8.38 0 0 1 13 0"/>
      </svg>
      <span class="gh-ap-mobile-nav-label">Profile</span>
    </a>
    <a routerLink="/user/video-answers" routerLinkActive="gh-ap-mobile-nav-item--active"
      class="gh-ap-mobile-nav-item" aria-label="Video Answers">
      <svg class="gh-ap-mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" aria-hidden="true" focusable="false">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
      </svg>
      <span class="gh-ap-mobile-nav-label">Video</span>
    </a>
  </nav>
</section>
