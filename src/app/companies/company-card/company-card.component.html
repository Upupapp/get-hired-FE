<a [routerLink]="company.slug ? ['/companies', company.slug] : ['/companies', 'details']"
   [queryParams]="company.slug ? {} : {id: company.companyId}"
   class="card card-body company-card-anchor"
   [attr.aria-label]="company.companyName + ' company profile'">
  <img [src]="company.companyLogo" class="img img-fluid company-image">

  <div class="d-flex flex-column align-items-evenly text-center h-100">
    <h5 class="title-company text-capitalize mt-3">{{company?.companyName}}</h5>
    <p class="title-company-category text-capitalize">{{company?.companyIndustry}}</p>

    <span class="btn btn-job-opening mt-auto">
     {{ company.companyJobsOpening == 0 ? 'View details': company?.companyJobsOpening + ' Job Openings' }}
    </span>
  </div>
</a>
