<div class="gh-psc-card">
  <div class="gh-psc-icon" aria-hidden="true">&#127881;</div>
  <h5 class="gh-psc-title">Profile details saved!</h5>
  <p class="gh-psc-body">
    You can apply for the job right now with what you've entered, or add a bit more
    detail first (Skills &amp; Experience, Documents) to strengthen your application.
    Both options are optional -- you can always finish your profile later.
  </p>

  <div class="gh-psc-actions">
    <button type="button" class="btn btn-save gh-psc-btn" (click)="choose('apply-now')" cdkFocusInitial>
      Apply Now with This Info
    </button>
    <button type="button" class="btn btn-outline-secondary gh-psc-btn" (click)="choose('continue-setup')">
      Add More Details First
    </button>
  </div>
</div>
