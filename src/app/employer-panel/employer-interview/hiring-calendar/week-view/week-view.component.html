<div class="wv">

  <!-- Desktop/tablet: 7-column time grid -->
  <div class="wv-desktop-grid" role="region" aria-label="Week schedule">
    <div class="wv-grid-header">
      <div class="wv-hours-spacer"></div>
      <div class="wv-day-header" *ngFor="let day of days; trackBy: trackByDayKey" [class.wv-day-header--today]="day.isToday">
        {{ dayHeaderLabel(day.date) }}
      </div>
    </div>

    <div class="wv-grid-body">
      <div class="wv-hours">
        <div class="wv-hour-row" *ngFor="let hour of hours">
          <span class="wv-hour-label">{{ hourLabel(hour) }}</span>
        </div>
      </div>

      <div class="wv-day-col" *ngFor="let day of days; trackBy: trackByDayKey" [class.wv-day-col--today]="day.isToday" [style.height.px]="hours.length * 48">
        <div class="wv-hour-line" *ngFor="let hour of hours"></div>

        <div
          class="wv-event-wrap"
          *ngFor="let laid of day.laidOutEvents; trackBy: trackByInterviewId"
          [style.top.%]="topPct(laid.item)"
          [style.height.%]="heightPct(laid.item)"
          [style.left.%]="leftPct(laid)"
          [style.width.%]="widthPct(laid)">
          <app-calendar-event-card
            [interview]="laid.item.interview"
            [displayTimeZone]="displayTimeZone"
            [compact]="true"
            (activated)="onActivate(laid.item.interview)">
          </app-calendar-event-card>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile: day strip + single-day agenda -->
  <div class="wv-mobile" role="region" aria-label="Week schedule">
    <div class="wv-mobile-strip" role="tablist" aria-label="Select a day">
      <button
        type="button"
        class="wv-mobile-day-btn"
        *ngFor="let day of days; let i = index; trackBy: trackByDayKey"
        role="tab"
        [attr.aria-selected]="i === selectedMobileDayIndex"
        [class.wv-mobile-day-btn--selected]="i === selectedMobileDayIndex"
        [class.wv-mobile-day-btn--today]="day.isToday"
        (click)="selectMobileDay(i)">
        {{ dayHeaderLabel(day.date) }}
      </button>
    </div>

    <div class="wv-mobile-agenda" *ngIf="selectedMobileDay as day">
      <div class="wv-mobile-empty" *ngIf="day.laidOutEvents.length === 0">
        No interviews scheduled for this day.
      </div>
      <div class="wv-mobile-list" *ngIf="day.laidOutEvents.length > 0">
        <app-calendar-event-card
          *ngFor="let laid of day.laidOutEvents; trackBy: trackByInterviewId"
          [interview]="laid.item.interview"
          [displayTimeZone]="displayTimeZone"
          (activated)="onActivate(laid.item.interview)">
        </app-calendar-event-card>
      </div>
    </div>
  </div>

</div>
