<div class="gh-search-skeletons" aria-busy="true" aria-label="Loading results…" role="status">
  <div class="gh-sk-card" *ngFor="let i of items">
    <div class="gh-sk-logo gh-sk-shimmer"></div>
    <div class="gh-sk-body">
      <div class="gh-sk-title gh-sk-shimmer"></div>
      <div class="gh-sk-company gh-sk-shimmer"></div>
      <div class="gh-sk-chips">
        <span class="gh-sk-chip gh-sk-shimmer"></span>
        <span class="gh-sk-chip gh-sk-shimmer" style="width:72px"></span>
        <span class="gh-sk-chip gh-sk-shimmer" style="width:88px"></span>
      </div>
    </div>
  </div>
</div>
