<div class="card card-body mt-3">
  <form class="row" [formGroup]="profileDetailsForm" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
    <!-- EMPLOYMENT DETAILS -->
    <div class="col-12">
      <h5 class="title-label">{{ 'PROFILE_DETAILS.PROFILE_DETAILS_TITLE' | translate }}</h5>
      <hr style="border: dashed 1px #868686">
    </div>

    <div class="col-12 col-lg-3" *ngIf="!profileImage && photo.value">
      <div>
        <div class="text-center mb-3 bg-gray">
          <img [src]="photo.value" class="avatar-image">
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-3" *ngIf="profileImage">
      <div>
        <div class="text-center mb-3 bg-gray" *ngIf="profileImage">
          <img [src]="profileImage.file" class="avatar-image">
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-9" *ngIf="!(profileImage || photo.value)"></div>

    <div class="col-12 col-lg-6" [ngClass]="(profileImage || photo.value ) ? 'mt-3' :''">
      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.PROFILE_DETAILS_TITLE' | translate }}</label>

        <app-file-upload (upload)="onUpload($event)" label="{{ 'PROFILE_DETAILS.UPLOAD_PHOTO_BUTTON' | translate }}" [labelTop]="false"
          formControlName="photoUrl"></app-file-upload>
      </div>

      <div class="title-container mb-3" *ngIf="profileImage || photo.value">
        <label>{{ 'PROFILE_DETAILS.CURRENT_JOB_TITLE_TEXT' | translate }}</label>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="i.e. Full Stack Developer" formControlName="jobTitle">
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">

      <div class="title-container mb-3" *ngIf="!profileImage && !photo.value">
        <label>{{ 'PROFILE_DETAILS.CURRENT_JOB_TITLE_TEXT' | translate }}</label>
        <div class="form-group">
          <input type="text" class="form-control" placeholder="i.e. Full Stack Developer" formControlName="jobTitle">
        </div>
      </div>
    </div>



    <div class="col-lg-6" *ngIf="!profileImage">
    </div>

    <div class="col-12 mb-3" *ngIf="profileImage">
      <hr style="border: dashed 1px #868686">
    </div>

    <div class="col-12 col-lg-12 mb-3">
      <div class="title-container mb-3">
        <label>Short Bio</label>
        <div class="form-group">
          <textarea type="text" class="form-control" formControlName="shortBio"
            placeholder="What Is a Short Bio? A short bio is a short paragraph that serves as a brief professional biography for résumés, company websites, personal branding, and more. These little blurbs sum up your current position, your years of experience in education and the workforce, plus your professional goals"
            rows="4"></textarea>
        </div>
      </div>

      <div class="title-container mb-3">
        <label>Services Provided</label>
        <div class="form-group">
          <textarea type="text" class="form-control" formControlName="servicesProvided"
            placeholder="Subject to the terms and conditions set forth in this Agreement, Company will perform the Services described in each Quote/Proposal. Company retains ownership of any portion of Company developed tools or products that are used in or form a part of computer programs or documentation resulting from a particular service provided. "
            rows="4"></textarea>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6 mb-3" *ngIf="typeList$ | async as jobType">
      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.JOB_TYPE' | translate }}</label>
        <select class="form-select" formControlName="jobTypeId">
          <option selected disabled [ngValue]="null">Select Job Type</option>
          <ng-container *ngFor="let item of jobType; let i = index">
            <option [value]="item.id">{{item.name}}</option>
          </ng-container>
        </select>
      </div>

      <div class="title-container mb-3" *ngIf="workSetup$ | async as workSetup">
        <label>{{ 'PROFILE_DETAILS.WORK_SETUP' | translate }}</label>
        <select class="form-select" formControlName="workSetupId">
          <option selected disabled [ngValue]="null">Select Work Setup</option>
          <ng-container *ngFor="let item of workSetup; let i = index">
            <option [value]="item.id">{{item.name}}</option>
          </ng-container>
        </select>
      </div>
    </div>

    <div class="col-12 col-lg-6 mb-3">


      <div class="title-container mb-3" *ngIf="level$ | async as jobLevel">
        <label>{{ 'PROFILE_DETAILS.EXPERIENCE_LEVEL' | translate }}</label>
        <select class="form-select" formControlName="jobLevelId">
          <option selected disabled [ngValue]="null">Select Level Experience</option>
          <ng-container *ngFor="let item of jobLevel; let i = index">
            <option [value]="item.id">{{item.name}}</option>
          </ng-container>
        </select>
      </div>

      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.SALARY_RANGE' | translate }}</label>

        <div class="row">
          <div class="col-2 form-group pe-0">
            <select class="form-select px-2 text-center" formControlName="salaryCurrency">
              <ng-container *ngFor="let item of salaryCurrencies; let i = index">
                <option [value]="item.name">{{item.name}}</option>
              </ng-container>
            </select>
          </div>
          <div class="col-5 form-group pe-0">
            <input type="number" name="search" formControlName="salaryMinimum" class="form-control form-control-main"
              placeholder="Php 25,000">
          </div>

          <div class="col-5 form-group pe-0">
            <input type="number" name="search" class="form-control form-control-main" formControlName="salaryMaximum"
              placeholder="Php 35,500">
          </div>
        </div>
      </div>
    </div>

    <!-- CONTACT DETAILS -->
    <div class="col-12 mt-3">
      <h5 class="title-label">Contact Details</h5>
      <hr style="border: dashed 1px #868686">
    </div>

    <div class="col-12 col-lg-6 mb-3">
      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.FIRSTNAME_TEXT' | translate }}</label>

        <div class="form-group">
          <input type="text" class="form-control" placeholder="George" formControlName="firstName">
        </div>
      </div>

      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.LASTNAME_TEXT' | translate }}</label>

        <div class="form-group">
          <input type="text" class="form-control" placeholder="Cruz" formControlName="lastName">
        </div>
      </div>

      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.PHONE_TEXT' | translate }}</label>

        <div class="form-group">
          <input type="text" class="form-control" placeholder="000-000000" formControlName="contactNumber">
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6 mb-3">
      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.ADDRESS_TEXT' | translate }}</label>

        <div class="form-group">
          <input type="text" class="form-control" placeholder="Subdivision, Street No, Building No, Barangay"
            formControlName="address">
        </div>
      </div>

      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.CITY_MUNICIPALITY_TEXT' | translate }}</label>

        <div class="form-group">
          <input type="text" class="form-control" placeholder="Manila" formControlName="city">
        </div>
      </div>

      <div class="title-container mb-3">
        <label>{{ 'PROFILE_DETAILS.COUNTRY_TEXT' | translate }}</label>

        <div class="form-group">
          <input type="text" class="form-control" placeholder="Philippines" formControlName="country">
        </div>
      </div>
    </div>
  </form>
</div>
