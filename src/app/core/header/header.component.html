<nav class="gh-public-nav fixed-top" [class.gh-public-nav--shadow]="isPublic" role="banner">
  <div class="gh-public-nav-inner">

    <!-- Logo -->
    <a class="gh-nav-logo" routerLink="/home" aria-label="GetHired — go to home" *ngIf="isPublic">
      <img src="assets/brand/Gethired-horizontal-logo.png?v=3"
           class="gh-nav-logo-img"
           alt="GetHired Online">
    </a>

    <!-- Mobile hamburger (collapse) -->
    <button class="navbar-toggler gh-nav-toggler" type="button"
      data-bs-toggle="collapse" data-bs-target="#ghNavCollapse"
      aria-controls="ghNavCollapse" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Nav items -->
    <div class="collapse navbar-collapse" id="ghNavCollapse">
      <ul class="navbar-nav ms-auto align-items-center gh-nav-list">

        <!-- Browse jobs CTA (public) -->
        <li class="nav-item" *ngIf="isPublic">
          <a routerLink="/jobs" class="gh-nav-btn-primary gh-pressable">Browse jobs</a>
        </li>

        <!-- Jobs link (dashboard) -->
        <li class="nav-item" *ngIf="!isPublic">
          <button class="gh-nav-btn-primary" type="button" (click)="navigateToJobs()">
            Jobs
          </button>
        </li>

        <!-- Start hiring (mobile collapse only) -->
        <li class="nav-item d-lg-none" *ngIf="isPublic && !isUserLoggedIn">
          <a routerLink="/employers" class="gh-nav-hire-link d-block">
            Start hiring
          </a>
        </li>

        <!-- Language selector -->
        <li class="nav-item gh-nav-lang">
          <app-language-selection title="Language"></app-language-selection>
        </li>

        <!-- Auth / Avatar -->
        <li class="nav-item">
          <!-- Logged out: Sign In -->
          <div *ngIf="!isUserLoggedIn">
            <button class="gh-nav-btn-signin gh-pressable" type="button"
              (click)="redirectToRegister()" aria-label="Sign in to your account">
              Sign In
            </button>
          </div>

          <!-- Logged in: Avatar dropdown -->
          <div class="gh-nav-avatar-wrap dropdown" *ngIf="isUserLoggedIn && user">
            <button class="gh-nav-avatar gh-pressable" type="button"
              id="navAvatarBtn"
              data-bs-toggle="dropdown" aria-expanded="false"
              [attr.aria-label]="'Account menu for ' + user.firstName">
              <img [src]="user.photoUrl" *ngIf="user.photoUrl" class="gh-nav-avatar-img" alt="">
              <span *ngIf="!user.photoUrl" class="gh-nav-avatar-initials" aria-hidden="true">
                {{ initials }}
              </span>
            </button>
            <ul class="dropdown-menu gh-nav-dropdown" aria-labelledby="navAvatarBtn">
              <li class="gh-nav-dropdown-header" (click)="goToDashboard()">
                <img [src]="user.photoUrl" *ngIf="user.photoUrl" class="gh-dropdown-avatar" alt="">
                <div *ngIf="!user.photoUrl" class="gh-dropdown-avatar gh-dropdown-initials" aria-hidden="true">
                  {{ initials }}
                </div>
                <div>
                  <p class="gh-dropdown-name">{{ user.firstName + ' ' + user.lastName }}</p>
                  <p class="gh-dropdown-company">{{ user.companyName }}</p>
                </div>
              </li>
              <li>
                <span class="gh-nav-dropdown-item" (click)="logout()">Log out</span>
              </li>
            </ul>
          </div>
        </li>

      </ul>
    </div>
  </div>
</nav>
