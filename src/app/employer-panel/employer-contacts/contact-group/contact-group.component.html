<div class="mt-4 ps-4 pe-4" id="job-order-main-container">
    <div [@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}">
      <!-- TALENT-WORKSPACE-REDESIGN: added an explanatory subtitle and
           renamed the CTA to state the outcome ("Create Candidate Group")
           instead of the generic "Add Group". Route/component/API
           unchanged. -->
      <div class="card card-body py-3">
        <div class="w-100">
          <span class="main-title mt-3">Candidate Groups</span>
          <p class="gh-field-helper mb-0">Organize candidates into reusable groups for sourcing, hiring, and follow-up.</p>

          <div class="float-end">
            <button class="gh-btn-primary" (click)="addCandidate()" aria-label="Create a new candidate group">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
              Create Candidate Group
            </button>
          </div>
        </div>
      </div>
      <br>
      <div class="card card-body" *ngIf="listView && !loading">
        <app-reusable-table [loading]="loading"
          [componentTitle]="'Candidate Groups'" [displayedColumns]="displayedColumns"
          [selectedColumns]="selectedColumns"
          [selectedColumnsMobile]="selectedColumns"
          [searchSource]="searchSource"
          [maxRows]="10"
          [listDataSource]="groupList"
          (deleteSelectedRow)="deleteRow($event)"
          (updateSelectedRowDialog)="editGroup($event)"
          (customButtonEvent)="showMembers($event)">
        </app-reusable-table>
      </div>


      <!-- LOADING ANIMATION SCREEN -->
      <custom-profile-loader [withSideBar]="false" [fromDetailTab]="true" [loading]="loading">
      </custom-profile-loader>
    </div>
</div>
