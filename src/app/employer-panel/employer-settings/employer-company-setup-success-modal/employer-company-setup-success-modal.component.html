<div class="gh-setup-modal" role="dialog" aria-modal="true" aria-labelledby="gh-setup-modal-title">

  <!-- ── SUCCESS HEADER ──────────────────────────────────────────────────────── -->
  <div class="gh-setup-modal__header" aria-hidden="true">
    <div class="gh-setup-modal__confetti-ring">
      <svg class="gh-setup-modal__check-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="32" r="30" stroke="#10B981" stroke-width="3" fill="rgba(16,185,129,0.08)"/>
        <polyline points="18,33 28,43 47,22" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <p class="gh-setup-modal__eyebrow">You're all set</p>
    <h2 class="gh-setup-modal__title" id="gh-setup-modal-title">
      Welcome to GetHired,<br>
      <span class="gh-setup-modal__company-name">{{ companyName }}</span>
    </h2>

    <div class="gh-setup-modal__trial-badge" aria-label="Free trial active for 7 days">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M7 1L8.8 4.6L13 5.3L10 8.2L10.7 12.5L7 10.6L3.3 12.5L4 8.2L1 5.3L5.2 4.6L7 1Z"
          fill="#F59E0B" stroke="#F59E0B" stroke-width="0.5" stroke-linejoin="round"/>
      </svg>
      7-day free trial active
    </div>
  </div>

  <!-- ── CHECKLIST ────────────────────────────────────────────────────────────── -->
  <ul class="gh-setup-modal__checklist" role="list" aria-label="Getting started checklist">
    <li
      *ngFor="let item of checklist"
      class="gh-setup-modal__checklist-item"
      [class.gh-setup-modal__checklist-item--done]="item.done"
      [attr.aria-label]="item.done ? item.label + ' — completed' : item.label + ' — to do'"
    >
      <span class="gh-setup-modal__check-bubble" aria-hidden="true">
        <svg *ngIf="item.done" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <polyline points="2.5,7 5.5,10 11.5,4" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg *ngIf="!item.done" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5" stroke="#D1D5DB" stroke-width="1.5"/>
        </svg>
      </span>
      <span class="gh-setup-modal__checklist-label">{{ item.label }}</span>
    </li>
  </ul>

  <!-- ── CTAs ────────────────────────────────────────────────────────────────── -->
  <div class="gh-setup-modal__actions">

    <!-- Primary: Post first job -->
    <button
      class="gh-setup-modal__btn gh-setup-modal__btn--primary gh-pressable"
      (click)="postFirstJob()"
      type="button"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <rect x="1" y="3" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6 3V2a3 3 0 016 0v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M9 9v3M7.5 10.5H10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Post your first job
    </button>

    <!-- Secondary: Complete company profile -->
    <button
      class="gh-setup-modal__btn gh-setup-modal__btn--secondary gh-pressable"
      (click)="completeProfile()"
      type="button"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Complete company profile
    </button>

    <!-- Tertiary: View public profile (only if slug available) -->
    <button
      *ngIf="companySlug"
      class="gh-setup-modal__btn gh-setup-modal__btn--tertiary gh-pressable"
      (click)="viewPublicProfile()"
      type="button"
      aria-label="View public company profile — opens in new tab"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/>
        <path d="M9 2C9 2 7 5 7 9s2 7 2 7M9 2c0 0 2 3 2 7s-2 7-2 7M2 9h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      View public profile
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" class="gh-setup-modal__external-icon">
        <path d="M2 10L10 2M5 2h5v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

  </div>

  <!-- ── DASHBOARD LINK ───────────────────────────────────────────────────────── -->
  <div class="gh-setup-modal__footer">
    <button
      class="gh-setup-modal__dashboard-link"
      (click)="goToDashboard()"
      type="button"
    >
      Go to dashboard
    </button>
  </div>

</div>
