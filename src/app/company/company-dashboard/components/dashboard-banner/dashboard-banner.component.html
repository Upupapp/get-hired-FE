
<div class="bg-banner" [@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}">
	<div class="p-5 d-flex">
		<div class="company-logo me-4">
			<img [src]="details.companyLogoUrl" class="img-fluid company-logo-image">
		</div>
		<div class="mt-1">
			<h5 class="title-banner mb-3" >{{ details.companyName }}
				<img src="/assets/images/placeholder/icons/company-edit.png"
        class="me-1 hvr-grow" (click)="redirectToEdit()"
				style="height: 25px; cursor: pointer !important; z-index: 999 !important">
			</h5>

			<p class="title-banner-description">
				<img src="/assets/images/placeholder/icons/location-white.png" class="me-1"
				style="height: 18px;"> {{ details.companyCity }}, {{details.companyCountry }}
			</p>
			<p class="title-banner-description mt-2">
				<img src="/assets/images/placeholder/icons/email-white.png" class="me-1"
				style="height: 12px;">
				{{ details.companyEmail }}
			</p>
		</div>
	</div>
</div>

<div class="px-3 px-lg-5" style="margin-top: -60px;">
	<div class="row">
		<div class="col-12 col-md-6 col-lg-4 mb-3">
			<div class="card-application green mb-2 mt-md-3 mt-lg-0"
			[@animate]="{value:'*', params:{ y:'10px', delay:'550ms' }}">
				<h5 class="title-card">Active Jobs
					<img src="/assets/images/placeholder/icons/card-applicant-icon.png" class="card-img" style="width: 30px; margin-top: -5px;">
				</h5>
        <div class="d-flex" style="margin-top: 20px">
          <h3 class="title-stat mt-0 pe-1">{{ charts.activeJobs || 0}}</h3>
          <label class="subheading align-items-end">this month</label>
        </div>
				<img src="/assets/images/placeholder/icons/arrow-right-white.png"
				style="height: 16px; margin-top: -25px" class="float-end me-2">
			</div>
		</div>

		<div class="col-12 col-md-6 col-lg-4 mb-3">
			<div class="orange mb-2 card-application"
			[@animate]="{value:'*', params:{ y:'10px', delay:'550ms' }}">
				<h5 class="title-card">Applicants
					<img src="/assets/images/placeholder/icons/card-interview-icon.png" class="card-img" style="width: 30px; margin-top: -5px;">
				</h5>
				<div class="d-flex" style="margin-top: 20px">
          <h3 class="title-stat mt-0 pe-1">{{ charts.applicants || 0}}</h3>
          <label class="subheading align-items-end">on active Jobs</label>
        </div>
				<img src="/assets/images/placeholder/icons/arrow-right-white.png"
				style="height: 16px; margin-top: -25px" class="float-end me-2">
			</div>
		</div>

		<div class="col-12 col-md-6 col-lg-4 mb-3">
			<div class="card-application yellow mb-2"
			[@animate]="{value:'*', params:{ y:'10px', delay:'550ms' }}">
				<h5 class="title-card">Video Interviews
					<img src="/assets/images/placeholder/icons/card-video-icon.png" class="card-img" style="width: 30px; margin-top: -5px;">
				</h5>
        <div class="d-flex" style="margin-top: 20px">
          <h3 class="title-stat mt-0 pe-1">{{ charts.interviews || 0}}</h3>
          <label class="subheading align-items-end">this month</label>
        </div>
				<img src="/assets/images/placeholder/icons/arrow-right-white.png"
				style="height: 16px; margin-top: -25px" class="float-end me-2">
			</div>
		</div>
	</div>
</div>
