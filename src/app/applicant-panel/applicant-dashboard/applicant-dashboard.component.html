<section *ngIf="profile$ | async as profile; else noProfile">
  <app-applicant-panel-banner [details]="profile"></app-applicant-panel-banner>

  <app-applicant-stat-chart></app-applicant-stat-chart>

  <app-applicant-stat-total></app-applicant-stat-total>
</section>

<div class="alert" [class.visible]="isVisible" *ngIf="isVisible">
  <h5>Stay Up to Date</h5>
  <span>Update your profile to showcase your skills</span>
  <button class="btn" (click)="closeSnackbar()"><i class="bi bi-x"></i></button>
</div>

<ng-template #noProfile>
  <section class="text-center p-5 w-100">
    <img src="assets/images/showcase.png" class="w-25" />
    <h5 class="my-2">Update your profile to showcase your skills</h5>
    <button class="btn btn-primary me-3 hvr-grow" (click)="redirectToEdit()">
      Update Profile</button>
  </section>
</ng-template>
