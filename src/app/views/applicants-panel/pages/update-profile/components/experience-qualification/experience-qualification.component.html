<!-- WORK EXPERIENCE -->
<ng-container *ngFor="let data of workExperienceArr; let i = index">
	<app-work-experience 
		[work_experience]="data"
		[index]="i + 1"
		[length]="workExperienceArr?.length"
		(addExperienceEvent)="addMoreExperience($event)">
	</app-work-experience>
</ng-container>

<!-- EDUCATION BACKGROUND -->
<ng-container *ngFor="let data of educationBackgroundArr; let i = index">
	<app-educational-background 
		[education_background]="data"
		[index]="i + 1"
		[length]="educationBackgroundArr?.length"
		(addEducationBackgroundEvent)="addMoreEducation($event)">
	</app-educational-background>
</ng-container>

<div class="card card-body mt-3" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
	<div class="row">
		<div class="col-12 col-md-6 mb-3">
			<label>Professional Skills</label>

			<div class="form-group d-flex">
				<input type="text" name="search" class="form-control" placeholder="ex. Data Encoding, Ruby, JavaScript" [(ngModel)]="skillModel"
				(keyup.enter)="this.skill_requirements?.length < 10 ? addItem($event, this.skill_requirements, 'skill_requirements'): ''">
			</div>

			<div class="d-flex flex-wrap">
				<ng-container *ngFor="let talent of skill_requirements, 'skill_requirements'">
					<div class="flex-wrap me-3 talent-badge">{{talent}}
						<img src="/assets/images/placeholder/icons/remove-white.png" 
						style="height: 10px; margin-top: -3px" class="ms-2"
						(click)="removeItem(talent, this.skill_requirements, 'skill_requirements')">
					</div>
				</ng-container>
			</div>
		</div>
	</div>
</div>

<!-- AWARDS  -->
<ng-container *ngFor="let data of awardsArr; let i = index">
	<app-awards-details
		[awards]="data"
		[index]="i + 1"
		[length]="awardsArr?.length"
		(addAwardEvent)="addMoreAwards($event)">
	</app-awards-details>
</ng-container>

<div class="text-end mt-4" [@animate]="{value:'*', params:{ y:'10px', delay:  (150) + 'ms' }}">
	<button class="btn btn-save-draft me-3">Profile Preview</button>
	<button class="btn btn-save me-2">Submit Changes</button>
</div>
