<div class="text-center p-3 position-relative">
  <button type="button" class="btn-close position-absolute" style="top: 8px; right: 8px;"
    aria-label="Close" (click)="dialogRef.close()"></button>

  <h1 class="fs-3 mb-0">
    Welcome to Get<span class="text-primary-red fw-bold">Hired</span>!
  </h1>
  <p class="text-center">
    Setup your company now to start hiring with us.
  </p>

  <div class="alert alert-danger alert-dismissible fade show error-message"
    [@animate]="{value:'*', params:{ y:'50px', delay:'600ms' }}" *ngIf="error" role="alert">
    <button type="button" class="btn-close hvr-buzz-out" data-bs-dismiss="alert" aria-label="Close"
      (click)="onAlertClose()"></button>
    <span>{{ error }}</span>
  </div>


  <form [formGroup]="companyBasicForm" (ngSubmit)="onSubmit()">
    <div class="title-container my-3">
      <label>Company Name</label>
      <div class="form-group">
        <input type="text" class="form-control" formControlName="companyName"
          placeholder="i.e. Google, Apple, Microsoft"
          [class.is-invalid]="companyName_validators?.invalid && companyName_validators?.touched" />

        <div class="mt-1 ms-4" *ngIf="
      (companyName_validators?.invalid && companyName_validators?.touched) || companyName_validators?.dirty">
          <small *ngIf="companyName_validators?.errors?.required" class="text-danger">Name is required</small>
        </div>
      </div>
    </div>

    <div class="title-container mb-3">
      <label for="company-basic-email">Company Email <div class="fst-italic fw-light">(Will be publicly viewed)</div></label>
      <div class="form-group">
        <input type="email" id="company-basic-email" class="form-control" formControlName="companyEmail" placeholder="i.e. name@email.com"
          [class.is-invalid]="companyEmail_validators?.invalid && companyEmail_validators?.touched"
          [attr.aria-invalid]="companyEmail_validators?.invalid && companyEmail_validators?.touched ? 'true' : null"
          [attr.aria-describedby]="companyEmail_validators?.invalid && companyEmail_validators?.touched ? 'company-basic-email-error' : null">

        <div class="mt-1 ms-4" id="company-basic-email-error" *ngIf="
      (companyEmail_validators?.invalid && companyEmail_validators?.touched) || companyEmail_validators?.dirty">
          <small *ngIf="companyEmail_validators?.errors?.required" class="text-danger">Email is required</small>
          <!-- EMP-008 fix: Validators.email sets an `email` error key (not
               `required`) on a non-empty malformed address -- nothing here
               ever showed it, so a bad company email looked accepted with
               zero feedback while the submit button stayed silently
               disabled. Same fix pattern as signup's EM-03. -->
          <small *ngIf="companyEmail_validators?.errors?.email" class="text-danger">Please enter a valid email address</small>
          <small *ngIf="companyEmail_validators?.errors?.maxlength" class="text-danger">Email address is too long (max 254 characters)</small>
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary d-block w-100 float-end mt-4 mb-3" [disabled]="submitting || !companyBasicForm.valid">
      Create Company
      <img src="/assets/images/placeholder/loading-login.gif" width="20px" class="img-fluid float-end mt-1 me-2"
        *ngIf="submitting">
    </button>
  </form>
</div>
