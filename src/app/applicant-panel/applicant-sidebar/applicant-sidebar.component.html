<nav class="gh-sidebar" role="navigation" aria-label="Job seeker navigation">

  <!-- Logo -->
  <div class="gh-sidebar-logo" role="link" tabindex="0"
    (click)="changeRoute('/user/dashboard')"
    (keydown.enter)="changeRoute('/user/dashboard')"
    (keydown.space)="$event.preventDefault(); changeRoute('/user/dashboard')"
    aria-label="GetHired — go to dashboard">
    <img src="assets/brand/Gethired-horizontal-logo.png?v=3" class="gh-sidebar-logo-img" alt="GetHired">
  </div>

  <!-- Nav items -->
  <ul class="gh-sidebar-nav" role="list">
    <li role="listitem" *ngFor="let item of sidebarItems">
      <div class="gh-sidebar-item"
        role="button"
        tabindex="0"
        [attr.aria-current]="isItemActive(item) ? 'page' : null"
        [attr.aria-label]="item.title"
        [class.gh-sidebar-item--active]="isItemActive(item)"
        (click)="changeRoute(item.route)"
        (keydown.enter)="changeRoute(item.route)"
        (keydown.space)="$event.preventDefault(); changeRoute(item.route)">
        <span class="gh-sidebar-icon" aria-hidden="true">
          <ng-container [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'dashboard'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
            <svg *ngSwitchCase="'jobs'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><rect x="2" y="6" width="16" height="12" rx="2"/><path d="M13 6V4a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2"/></svg>
            <svg *ngSwitchCase="'applications'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M12 2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6z"/><polyline points="12 2 12 6 16 6"/></svg>
            <svg *ngSwitchCase="'career'" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><circle cx="10" cy="6" r="3.2"/><path d="M4.5 17.5a5.5 5.5 0 0 1 11 0"/></svg>
            <svg *ngSwitchDefault viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><circle cx="10" cy="10" r="8"/></svg>
          </ng-container>
        </span>
        <span class="gh-sidebar-label">{{ item.title }}</span>
        <svg *ngIf="item.sub_routes?.length > 0" class="gh-sidebar-caret"
          [class.gh-sidebar-caret--open]="isSubnavOpen(item)"
          viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"
          width="12" height="12" aria-hidden="true"
          (click)="toggleCollapse($event, item.route)">
          <path d="M3 4.5l3 3 3-3"/>
        </svg>
      </div>

      <ul class="gh-sidebar-subnav" *ngIf="item.sub_routes?.length > 0 && isSubnavOpen(item)" role="list">
        <li *ngFor="let sub of item.sub_routes" role="listitem">
          <div class="gh-sidebar-subitem"
            role="button"
            tabindex="0"
            [attr.aria-current]="subRouteActive(sub.route) ? 'page' : null"
            [class.gh-sidebar-subitem--active]="subRouteActive(sub.route)"
            (click)="changeRoute(sub.route)"
            (keydown.enter)="changeRoute(sub.route)"
            (keydown.space)="$event.preventDefault(); changeRoute(sub.route)">
            {{ sub.title }}
          </div>
        </li>
      </ul>
    </li>
  </ul>

  <!-- Bottom user card -->
  <div class="gh-sidebar-footer" *ngIf="screenHeight > 500">
    <div class="gh-sidebar-user">
      <div class="gh-sidebar-user-avatar" aria-hidden="true">
        <ng-container *ngIf="user?.photoUrl; else sidebarInitials">
          <img [src]="user.photoUrl" alt="" class="gh-sidebar-user-avatar-img">
        </ng-container>
        <ng-template #sidebarInitials>{{ initials }}</ng-template>
      </div>
      <div class="gh-sidebar-user-info">
        <span class="gh-sidebar-user-name">{{ user?.firstName }} {{ user?.lastName }}</span>
        <span class="gh-sidebar-user-role">Job Seeker</span>
      </div>
    </div>
    <button class="gh-sidebar-settings gh-pressable" (click)="changeRoute('/user/settings')"
      aria-label="Settings">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"
        width="16" height="16" aria-hidden="true">
        <circle cx="9" cy="9" r="2.5"/>
        <path d="M14.6 11.25a1.25 1.25 0 0 0 .25 1.37l.04.04a1.5 1.5 0 0 1-2.12 2.12l-.04-.04a1.25 1.25 0 0 0-1.37-.25 1.25 1.25 0 0 0-.75 1.14V16a1.5 1.5 0 0 1-3 0v-.07a1.25 1.25 0 0 0-.82-1.14 1.25 1.25 0 0 0-1.37.25l-.04.04a1.5 1.5 0 0 1-2.12-2.12l.04-.04a1.25 1.25 0 0 0 .25-1.37 1.25 1.25 0 0 0-1.14-.75H2a1.5 1.5 0 0 1 0-3h.07a1.25 1.25 0 0 0 1.14-.82 1.25 1.25 0 0 0-.25-1.37l-.04-.04a1.5 1.5 0 0 1 2.12-2.12l.04.04a1.25 1.25 0 0 0 1.37.25h.06A1.25 1.25 0 0 0 7.25 2V2a1.5 1.5 0 0 1 3 0v.07a1.25 1.25 0 0 0 .75 1.14 1.25 1.25 0 0 0 1.37-.25l.04-.04a1.5 1.5 0 0 1 2.12 2.12l-.04.04a1.25 1.25 0 0 0-.25 1.37v.06A1.25 1.25 0 0 0 15.5 7.75H16a1.5 1.5 0 0 1 0 3h-.07a1.25 1.25 0 0 0-1.14.75z"/>
      </svg>
    </button>
  </div>

  <p class="gh-sidebar-copyright">&copy; 2026 GetHired</p>

</nav>
