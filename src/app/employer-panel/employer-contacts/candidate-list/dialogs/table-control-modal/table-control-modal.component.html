<div class="candidate-panel">
	<button type="button" class="candidate-panel__close" (click)="dialogRef.close()" aria-label="Close">
		<img src="/assets/images/placeholder/icons/remove-gray.png" alt="">
	</button>

	<div class="candidate-panel__header">
		<img [src]="data?.photo_url || '/assets/images/placeholder/job-post-banner-person.png'" class="candidate-panel__avatar"
		     alt="Applicant photo"
		     (error)="onAvatarError($event)">

		<div class="candidate-panel__identity">
			<strong class="candidate-panel__name text-capitalize">{{data?.full_name}}</strong>
			<span class="candidate-panel__job" *ngIf="data?.job_title">{{data?.job_title}}</span>
			<span class="candidate-panel__status" *ngIf="data?.status" [ngClass]="statusClass">{{data?.status}}</span>
		</div>
	</div>

	<div class="candidate-panel__actions">
		<button type="button" class="candidate-panel__action" *ngFor="let menu of tableControls"
			(click)="openControlMenu(menu)">
			<span class="candidate-panel__action-icon" [ngStyle]="{ background: menu?.background }">
				<img [src]="menu?.icon" alt="">
			</span>
			<span class="candidate-panel__action-title">{{menu.title}}</span>
			<i class="bi bi-chevron-right candidate-panel__action-chevron" aria-hidden="true"></i>
		</button>
	</div>
</div>
