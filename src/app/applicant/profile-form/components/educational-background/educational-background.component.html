<form [formGroup]="educBgForm">
  <div class="mt-2" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
    <div class="row">
      <div class="col-12">
        <div class="row">
          <div class="col-12 col-md-9 align-self-center">
            <h5 class="title-label">
              <span *ngIf="educBgForm.controls.fieldOfStudy.value">
                {{educBgForm.controls.fieldOfStudy.value|| '-'}}
              </span>

              <ng-container *ngIf="educBgForm.controls.school.value">
                <span class="mx-2">|</span>
                <i>{{educBgForm.controls.school.value || '-'}}</i>
              </ng-container>
            </h5>
          </div>
          <div class="col-12 col-md-3">
            <span (click)="cancel()" class="float-end btn btn-add">
              <img src="/assets/images/placeholder/icons/remove-gray.png" style="height: 15px">
            </span>
            <!-- <button class="float-end btn btn-save-draft" type="button"
            [disabled]="!educBgForm.valid"

            (click)="addEducationBackground()" *ngIf="controlIndex == 0">
            {{ 'SKILLS_AND_EXPERIENCE.ADD_ITEM_BUTTON' | translate }}</button>-->
          </div>

        </div>
        <hr style="border: dashed 1px #868686">
      </div>

      <div class="col-12 col-lg-6">
        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.EDUCATION_LEVEL' | translate }}</label>
          <select class="form-select" formControlName="levelOfEducation">
            <option selected disabled [ngValue]="null">Select Level of Education</option>
            <ng-container *ngFor="let item of levelOfEducation; let i = index">
              <option [value]="item">{{item}}</option>
            </ng-container>
          </select>
        </div>

        <div class="row">
          <div class="col-12 col-lg-6">
            <div class="title-container mb-3">
              <label>{{ 'SKILLS_AND_EXPERIENCE.EDUCATION_START_DATE' | translate }}</label>
              <select class="form-select" formControlName="startMonth">
                <option selected disabled [ngValue]=null>Select Month</option>
                <ng-container *ngFor="let item of month; let i = index">
                  <option [value]="item">{{item}}</option>
                </ng-container>
              </select>
            </div>
          </div>

          <div class="col-12 col-lg-6">
            <div class="title-container mb-3 select-option">
              <label> </label>
              <select class="form-select" formControlName="startYear">
                <option selected disabled [ngValue]=null>Select Year</option>
                <ng-container *ngFor="let item of year; let i = index">
                  <option [value]="item">{{item}}</option>
                </ng-container>
              </select>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-lg-6">
            <div class="title-container mb-3">
              <label>{{ 'SKILLS_AND_EXPERIENCE.EDUCATION_END_DATE' | translate }}</label>
              <select class="form-select" formControlName="endMonth">
                <option selected disabled [ngValue]=null>Select Month</option>
                <ng-container *ngFor="let item of month; let i = index">
                  <option [value]="item">{{item}}</option>
                </ng-container>
              </select>
            </div>
          </div>

          <div class="col-12 col-lg-6">
            <div class="title-container mb-3">
              <label> </label>
              <select class="form-select" formControlName="endYear">
                <option selected disabled [ngValue]=null>Select Year</option>
                <ng-container *ngFor="let item of year; let i = index">
                  <option [value]="item">{{item}}</option>
                </ng-container>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.FIELD_OF_STUDY' | translate }}</label>
          <div class="form-group">
            <input type="text" class="form-control" formControlName="fieldOfStudy"
              placeholder="i.e. Communication, Engineering, Advertising, Psychology, etc">
          </div>
        </div>

        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.SCHOOL' | translate }}</label>
          <div class="form-group">
            <input type="text" class="form-control" formControlName="school"
              placeholder="Name of the University or School">
          </div>
        </div>

        <div class="title-container mb-3">
          <label>{{ 'SKILLS_AND_EXPERIENCE.SCHOOL_ADDRESS' | translate }}</label>
          <div class="form-group">
            <input type="text" class="form-control" formControlName="schoolAddress"
              placeholder="School Location or Landmark">
          </div>
        </div>
      </div>
    </div>
    <div class="row justify-content-end">
      <div class="col-12 col-md-3">
            <button class="float-end btn btn-save-draft" type="button"
            [disabled]="!educBgForm.valid"
            (click)="addEducationBackground()">
              Add Item</button>
          </div>
    </div>
  </div>
</form>
