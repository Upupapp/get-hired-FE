<div class="card card-body mt-3">
	<form class="row"
	[formGroup]="profileDetailsForm"
	[@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
		<!-- EMPLOYMENT DETAILS -->
		<div class="col-12">
			<h5 class="title-label">Profile Details</h5>
			<hr style="border: dashed 1px #868686">
		</div>

		<div class="col-12 col-lg-3"  *ngIf="profileImage">
			<div >
				<div class="text-center mb-3 bg-gray" *ngIf="profileImage">
					<img [src]="profileImage" class="avatar-image">
				</div>
			</div>
		</div>

		<div class="col-12 col-lg-9" *ngIf="!profileImage"></div>

		<div class="col-12 col-lg-6" [ngClass]="profileImage ? 'mt-3' : ''">
			<div class="title-container mb-3" >
				<label>Profile Photo</label>

				<app-file-upload
				formControlName="profile_photo"
				(upload)="onUpload($event)"
				label="Select Profile Photo"
				[labelTop]="false"></app-file-upload>
			</div>

			<div class="title-container mb-3"  *ngIf="profileImage">
				<label>Current Job title</label>
				<div class="form-group">
					<input type="text"  class="form-control" placeholder="i.e. Full Stack Developer" >
				</div>
			</div>
		</div>
		
		<div class="col-12 col-lg-6">

			<div class="title-container mb-3"  *ngIf="!profileImage">
				<label>Current Job title</label>
				<div class="form-group">
					<input type="text"  class="form-control" placeholder="i.e. Full Stack Developer" >
				</div>
			</div>
		</div>

		

		<div class="col-lg-6" *ngIf="!profileImage">
		</div>

		<div class="col-12 mb-3"  *ngIf="profileImage">
			<hr style="border: dashed 1px #868686">
		</div>

		<div class="col-12 col-lg-12 mb-3">
			<div class="title-container mb-3">
				<label>Short Bio</label>
				<div class="form-group">
					<textarea type="text"  class="form-control" placeholder="What Is a Short Bio? A short bio is a short paragraph that serves as a brief professional biography for résumés, company websites, personal branding, and more. These little blurbs sum up your current position, your years of experience in education and the workforce, plus your professional goals" rows="4"></textarea>
				</div>
			</div>

			<div class="title-container mb-3">
				<label>Services Provided</label>
				<div class="form-group">
					<textarea type="text"  class="form-control" placeholder="Subject to the terms and conditions set forth in this Agreement, Company will perform the Services described in each Quote/Proposal. Company retains ownership of any portion of Company developed tools or products that are used in or form a part of computer programs or documentation resulting from a particular service provided. " rows="4"></textarea>
				</div>
			</div>
		</div>

		<div class="col-12 col-lg-6 mb-3">
			<div class="title-container mb-3">
				<label>Job Type</label>
				<select class="form-select">
					<option selected disabled value="">Select Job Type</option>
					<ng-container *ngFor="let item of jobType; let i = index">
						<option [value]="item">{{item}}</option>
					</ng-container>
				</select>
			</div>

			<div class="title-container mb-3">
				<label>Work Setup</label>
				<select class="form-select">
					<option selected disabled value="">Select Work Setup</option>
					<ng-container *ngFor="let item of workSetup; let i = index">
						<option [value]="item">{{item}}</option>
					</ng-container>
				</select>
			</div>
		</div>

		<div class="col-12 col-lg-6 mb-3">
			

			<div class="title-container mb-3">
				<label>Level of Experience</label>
				<select class="form-select">
					<option selected disabled value="">Select Level Experience</option>
					<ng-container *ngFor="let item of jobLevel; let i = index">
						<option [value]="item">{{item}}</option>
					</ng-container>
				</select>
			</div>

			<div class="title-container mb-3">
				<label>Expected Salary</label>
				
				<div class="row">
					<div class="col-6 form-group pe-0">
						<input type="number" name="search" class="form-control form-control-main" placeholder="Php 25,000">
					</div>

					<div class="col-6 form-group pe-0">
						<input type="number" name="search" class="form-control form-control-main" placeholder="Php 35,500">
					</div>
				</div>
			</div>
		</div>

		<!-- CONTACT DETAILS -->
		<div class="col-12 mt-3">
			<h5 class="title-label">Contact Details</h5>
			<hr style="border: dashed 1px #868686">
		</div>

		<div class="col-12 col-lg-6 mb-3">
			<div class="title-container mb-3">
				<label>First Name</label>

				<div class="form-group">
					<input type="text"  class="form-control" placeholder="George" >
				</div>
			</div>

			<div class="title-container mb-3">
				<label>Last Name</label>

				<div class="form-group">
					<input type="text"  class="form-control" placeholder="Cruz" >
				</div>
			</div>

			<div class="title-container mb-3">
				<label>Email</label>

				<div class="form-group">
					<input type="email"  class="form-control" placeholder="sample.email@gmail.com" >
				</div>
			</div>

			<div class="title-container mb-3">
				<label>Phone</label>

				<div class="form-group">
					<input type="text"  class="form-control" placeholder="000-000000" >
				</div>
			</div>
		</div>

		<div class="col-12 col-lg-6 mb-3">
			<div class="title-container mb-3">
				<label>Address</label>

				<div class="form-group">
					<input type="text"  class="form-control" placeholder="Subdivision, Street No, Building No, Barangay" >
				</div>
			</div>

			<div class="title-container mb-3">
				<label>City/Municipality</label>

				<div class="form-group">
					<input type="text"  class="form-control" placeholder="Manila" >
				</div>
			</div>

			<div class="title-container mb-3">
				<label>Country</label>

				<div class="form-group">
					<input type="text"  class="form-control" placeholder="Philippines" >
				</div>
			</div>
		</div>
	</form>
</div>

<div class="text-end mt-4" [@animate]="{value:'*', params:{ y:'10px', delay:  (150) + 'ms' }}">
	<button class="btn btn-save-draft me-3">Profile Preview</button>
	<button class="btn btn-save me-2">Submit Changes</button>
</div>
