<div class="p-2 text-center">
  <i [class]="'bi fa-lg bi-' + icon"></i>
  <h4 *ngIf="title" class="fs-4 mt-2 mb-1">{{ title }}</h4>
  <h5 class="fs-5">{{ message }}</h5>

  <!-- External link (e.g. popup-blocked fallback: "Open live job →") -->
  <div *ngIf="linkUrl" class="ud-link-row mt-2 mb-1">
    <a [href]="linkUrl" target="_blank" rel="noopener noreferrer" class="ud-ext-link">
      {{ linkText || linkUrl }}
    </a>
  </div>

  <!-- Action-button mode: custom action cards -->
  <div *ngIf="actions && actions.length; else simpleClose" class="ud-actions mt-4">
    <button
      *ngFor="let a of actions"
      type="button"
      class="ud-action-btn"
      [class.ud-action-btn--primary]="a.primary"
      [class.ud-action-btn--ghost]="!a.primary"
      [disabled]="a.disabled"
      [attr.aria-busy]="a.disabled ? true : null"
      (click)="doAction(a.value)"
    >{{ a.label }}</button>
    <!-- No explicit cdkFocusInitial here: it's a static-selector directive
         (see the simpleClose template below), can't be conditionally bound
         per-action via *ngFor. MatDialog's own default focus-first-focusable
         behavior already covers keyboard-focus-on-open for this template. -->
  </div>

  <!-- Simple close mode (backward-compat) -->
  <ng-template #simpleClose>
    <div class="w-100 my-4">
      <button type="button" (click)="closeDialog()" class="btn btn-primary px-4" cdkFocusInitial>
        Close
      </button>
    </div>
  </ng-template>
</div>
