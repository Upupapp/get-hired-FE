<div class="mt-4 px-5">
  <div class="row">
    <div class="col-12 col-md-6 col-lg-7 mb-3">
      <div class="mb-2 card-application-hired" style="position: relative;"
        [@animate]="{value:'*', params:{ y:'10px', delay:'550ms' }}">
        <h5 class="title-card-hired">Top 5 cities applied from</h5>
        <div style="height:130px; width:400px">
          <canvas baseChart [data]="barChartData" [options]="barChartOptions"
          [type]="barChartType">
        </canvas>
        </div>

      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-5 mb-3">
      <div class="mb-2 card-application" style="position: relative;"
        [@animate]="{value:'*', params:{ y:'10px', delay:'550ms' }}">
        <h5 class="title-card">Candidate Database
          <img src="/assets/images/placeholder/icons/card-applicant-icon.png" class="card-img me-4"
            style="width: 30px; margin-top: 15px;">
        </h5>
        <h3 class="title-stat">{{ details.totalContacts.totalContacts || 0}}</h3>
        <h5 class="title-stat-sub">Total Contacts</h5>
      </div>
    </div>
  </div>
</div>
