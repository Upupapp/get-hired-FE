<div class="mt-4 ps-4 pe-4" id="job-order-main-container">
  <div [@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}">
    <div class="card card-body py-3">
      <div class="w-100">
        <span class="main-title mt-3">{{ 'JOB_POSTS_PAGE.SIDEBAR_JOB_POSTS' | translate }}</span>

        <div class="float-end">
          <button class="gh-btn-primary gh-pressable" (click)="getCompanyRestrictions()">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
            {{ 'JOB_POSTS_PAGE.NEW_JOB_BUTTON' | translate }}
          </button>
        </div>
      </div>
      <!-- GETHIRED 500K TALENT PROOF SYSTEM -- persistent, low-key
           reminder for returning employers, not tied to any specific
           empty/non-empty state (no tailored dashboard states exist in
           this codebase to safely detect -- see placement log). -->
      <app-talent-proof-badge variant="pill" placement="employer_dashboard_job_list"></app-talent-proof-badge>
    </div>
    <br>
    <div class="card card-body" *ngIf="!loading && list$ | async as list">
      <!-- Empty state: when no jobs exist, guide the employer to post their first job
           rather than showing a blank table. -->
      <ng-container *ngIf="list.length === 0; else jobTable">
        <div class="gh-job-list-empty" role="status" aria-label="No jobs yet">
          <div class="gh-job-list-empty-inner">
            <img src="/assets/brand/gethired-wow/hiring-pipeline-lines.svg" alt="" aria-hidden="true"
              class="gh-job-list-empty-icon">
            <h4 class="gh-job-list-empty-title">No jobs yet</h4>
            <p class="gh-job-list-empty-desc">
              Post your first job to start receiving applicants.
            </p>
            <button class="gh-btn-primary gh-pressable gh-job-list-empty-cta"
              (click)="getCompanyRestrictions()"
              aria-label="Post your first job">
              <i class="bi bi-plus-lg" aria-hidden="true"></i>
              Post your first job
            </button>
          </div>
        </div>
      </ng-container>

      <ng-template #jobTable>
        <app-reusable-table
          [loading]="loading"
          [statusArray]="status"
          [statusFilter]="true"
          statusName="Status"
          (deleteSelectedRow)="deleteRow($event)"
          (updateSelectedRowDialog)="viewMenu($event)"
          (viewDetails)="viewMenu($event)"
          [componentTitle]="'Company Jobs'"
          [displayedColumns]="displayedColumns"
          [selectedColumns]="selectedColumns"
          [selectedColumnsMobile]="selectedColumns"
          [searchSource]="searchSource"
          [maxRows]="10" [listDataSource]="list">
        </app-reusable-table>
      </ng-template>
    </div>

    <!-- LOADING ANIMATION SCREEN -->
    <custom-profile-loader [withSideBar]="false" [fromDetailTab]="true" [loading]="loading">
    </custom-profile-loader>
  </div>
</div>
