<div *ngIf="!loading">
  <!-- CONTROLS -->
  <section
    class="bg-upper-gray"
    [ngStyle]="{
      position: delayControl ? '' : 'fixed',
      top: delayControl ? '' : '80px',
      width: delayControl ? '80%' : '83%'
    }"
  >
    <div class="card card-body py-3">
      <div>
        <span class="main-title">{{ jobId ? 'Update':'Create' }} a Job</span>
        <span [ngClass]="delayControl ? 'd-none' : 'float-end'">
          <button
            *ngIf="status === 1"
            class="btn btn-save-draft me-2"
            (click)="saveAsDraft()"
            [disabled]="!initialFormValid"
          >
            Save as Draft
          </button>

          <button class="btn btn-add-service me-2" (click)="cancel()">
            Cancel
          </button>
        </span>
      </div>
    </div>

    <div class="mt-3">
      <div class="mt-2" [ngClass]="delayControl ? 'd-none' : 'float-end'">
        <ng-template [ngTemplateOutlet]="stepperButtons"></ng-template>
      </div>

      <app-main-stepper
        [stepper]="stepper"
        [stepperItems]="stepperItems"
        (changeStepper)="changeStep($event)">
      </app-main-stepper>
    </div>
  </section>

  <!-- FORM -->
  <div class="py-4" style="position: relative">
    <form [formGroup]="jobForm">
      <section
        class="py-3"
        id="job-create-forms"
        [ngStyle]="{ 'margin-top': delayControl ? '-30px' : '140px' }"
        style="padding-left: 25px; padding-right: 45px"
      >
        <ng-container *ngIf="stepper === 1">
          <app-job-post-detail-step
            formGroupName="initialData"
          ></app-job-post-detail-step>
        </ng-container>

        <ng-container *ngIf="stepper === 2">
          <app-create-job-post-step
            formGroupName="jobInfo"
          ></app-create-job-post-step>
        </ng-container>

        <ng-container *ngIf="stepper === 3">
          <app-create-interview-questions
            formGroupName="interview"
          ></app-create-interview-questions>
        </ng-container>

        <ng-container *ngIf="stepper === 4">
          <app-preview-job-post-step></app-preview-job-post-step>
        </ng-container>
      </section>

      <!-- <div class="card card-body py-3">
      <div class="w-100">
        <div class="text-end">
          <button class="btn btn-add-service me-2" (click)="cancel()">
            Cancel
          </button>

          <button class="btn btn-save-draft" (click)="saveAsDraft()" [disabled]="!initialFormValid">
            Save as Draft
          </button>

          <ng-template [ngTemplateOutlet]="stepperButtons"></ng-template>

        </div>
      </div>
    </div> -->
    </form>

    <ng-template #stepperButtons>
      <button
        class="btn btn-next me-2"
        (click)="changeStep(2)"
        *ngIf="stepper == 1"
        [disabled]="!initialFormValid"
        type="submit"
      >
        Next: Job Requirements
      </button>

      <button
        class="btn btn-next me-2"
        (click)="changeStep(1)"
        *ngIf="stepper == 2"
      >
        Prev: Job Details
      </button>

      <button
        class="btn btn-next me-2"
        (click)="changeStep(3)"
        *ngIf="stepper == 2"
        [disabled]="!jobInfoValid"
      >
        Next: Create Interview
      </button>

      <button
        class="btn btn-next me-2"
        (click)="changeStep(2)"
        *ngIf="stepper == 3"
      >
        Prev: Job Requirements
      </button>

      <button
        class="btn btn-next me-2"
        (click)="changeStep(4)"
        *ngIf="stepper == 3"
        [disabled]="!interviewValid"
      >
        Next: Preview Job Post
      </button>

      <button
        class="btn btn-next me-2"
        (click)="changeStep(3)"
        *ngIf="stepper == 4"
      >
        Prev: Create Interview
      </button>

      <button
        class="btn btn-next me-2"
        (click)="publishJobPost()"
        *ngIf="stepper == 4"
      >
        Publish Job Post
      </button>
    </ng-template>
  </div>
</div>

<!-- LOADING ANIMATION SCREEN -->
<custom-profile-loader
  [withSideBar]="false"
  [fromDetailTab]="true"
  [loading]="loading"
>
</custom-profile-loader>
