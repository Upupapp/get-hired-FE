<div class="sectioning">
  <form [formGroup]="addressFormGroup">
    <div class="row mb-3">
      <div class="col-12 col-lg-6">
        <div class="title-container">
          <label>Search your Address</label>

          <div class="form-group input-group">
            <div class="input-group-prepend">
              <div class="input-group-text prepend"><i class="bi bi-search"></i></div>
            </div>

            <input type="text" class="form-control" (keydown.enter)="$event.preventDefault()"
              placeholder="Start typing to begin address search and auto populate fields" formControlName="address"
              #search>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-3">
        <div class="title-container">
          <label>State</label>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="ex. Metro Manila" formControlName="state">
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-3">
        <div class="title-container">
          <label>Country</label>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="ex. Philippines" formControlName="country"
              [class.is-invalid]="country_validators?.invalid && country_validators?.touched">
          </div>
          <div class="mt-1 ms-4" *ngIf="
              (country_validators?.invalid && country_validators?.touched) || country_validators?.dirty">
            <small *ngIf="country_validators?.errors?.required" class="text-danger">
              Country is required</small>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12 col-lg-5">
        <div class="title-container">
          <label>Address 1</label>
          <div class="form-group">
            <input type="text" class="form-control" (keydown.enter)="$event.preventDefault()"
              placeholder="ex. Unit A 117 streetname st." formControlName="addressOne"
              [class.is-invalid]="adressOne_validators?.invalid && adressOne_validators?.touched">
          </div>
          <div class="mt-1 ms-4" *ngIf="
                (adressOne_validators?.invalid && adressOne_validators?.touched) || adressOne_validators?.dirty">
            <small *ngIf="adressOne_validators?.errors?.required" class="text-danger">
              Address line 1 is required</small>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-3">
        <div class="title-container">
          <label>Town / Suburb</label>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="ex. Salcedo" formControlName="town">
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-3">
        <div class="title-container">
          <label>City</label>
          <div class="form-group">
            <input type="text" class="form-control" placeholder="ex. Makati" formControlName="city"
              [class.is-invalid]="city_validators?.invalid && city_validators?.touched">
          </div>
          <div class="mt-1 ms-4" *ngIf="
                (city_validators?.invalid && city_validators?.touched) || city_validators?.dirty">
            <small *ngIf="city_validators?.errors?.required" class="text-danger">
              City is required</small>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-1">
        <div class="title-container">
          <label>Zip Code</label>

          <div class="form-group">
            <input type="text" class="form-control" placeholder="ex. 1011" formControlName="zipcode">
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
