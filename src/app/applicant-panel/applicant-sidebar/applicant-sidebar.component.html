<div class="sidebar-details">
	<div style="position: relative; height: 100vh;">
		<div class="card card-body bg-logo text-center d-flex align-items-center"
		style="height: 120px; cursor: pointer;">
			<img src="/assets/images/placeholder/logo.png" class="hvr-grow img-logo img-fluid"
			[@animate]="{value:'*', params:{ scale:'0.95', delay:'200ms' }}" routerLink="/jobs">
		</div>

		<div class="card card-body p-3 mt-3 bg-menu"
		[@animate]="{value:'*', params:{ scale: '0.95', delay:'200ms' }}">
			<ng-container *ngFor="let item of sidebarItems">
				<div class="w-100 d-flex mb-3"
				[ngClass]="location?.match(item?.route) && !location?.match('expired')
				? 'sidebar-title-active'
				: location?.match('expired') && item?.route === 'expired-jobs'
				? 'sidebar-title-active'
				: ''"

				(click)="changeRoute('/user/' + item?.route)">
					<div class="sidebar-icon ms-lg-3" style="width: 20px">
						<img [src]="'/assets/images/placeholder/icons/company-panel-' + item?.icon"
						[ngClass]="item?.class">
					</div>
					<h5 class="sidebar-title">{{item?.title}}</h5>
				</div>
			</ng-container>
		</div>

		<div class="px-2">
			<div class="card card-body py-4 bg-user"
			[@animate]="{value:'*', params:{ y: '-10px', delay:'200ms' }}">
				<div class="d-flex">
          <img [src]="user.photoUrl"
          *ngIf="user.photoUrl" class="img-avatar me-3">
          <div *ngIf="!user.photoUrl" class="initial-thumbnail-inner" >
            {{ initials }}
          </div>
					<div class="mt-1 d-flex align-items-center">
						<h5 class="img-avatar-full-name text-capitalize">
              			{{ user.firstName + ' ' + user.lastName }}</h5>
					</div>
				</div>

				<button class="btn img-avatar-button mt-2" routerLink="/user/profile/edit">
					{{ 'APPLICANT_DASHBOARD.UPDATE_PROFILE_BUTTON' | translate }}</button>
			</div>

			<h5 class="text-center copy-right mt-4">
				&copy; 2026 GetHired
			</h5>
		</div>


	</div>
</div>
