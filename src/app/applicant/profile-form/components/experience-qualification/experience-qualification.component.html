<form [formGroup]="arrayForm">
  <div class="mb-3 mt-4 ms-2">
    <h5 class="mt-3 main-title">Work Experience</h5>
  </div>

  <ng-container *ngFor="let workFormGroup of workExperience.controls; let i = index">
    <app-work-experience [bindFG]="workFormGroup" [controlIndex]="i" (arrayFormArray)="addMeToArray($event)"
      (removeArrayFormArray)="removeMeToArray($event)"></app-work-experience>
  </ng-container>

  <div class="mb-3 mt-5 ms-2">
    <h5 class="mt-3 main-title">Educational Background</h5>
  </div>
  <ng-container *ngFor="let educFormGroup of educationalBackground.controls; let i = index">
    <app-educational-background [bindFG]="educFormGroup" [controlIndex]="i" (arrayFormArray)="addMeToArray($event)"
      (removeArrayFormArray)="removeMeToArray($event)">
    </app-educational-background>
  </ng-container>

  <div class="card card-body mt-3" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
    <div class="row mt-3">
      <div class="col-12 col-md-6 mb-3">
        <label>Professional Skills</label>

        <div class="form-group d-flex with-add search-group" style="height: 60px;">
          <input type="text" name="search" class="form-control form-control-main" formControlName="skillsTxt"
            placeholder="ex. Data Encoding, Ruby, JavaScript"
            (keyup.up)="addItem('skillsTxt', this.professionalSkills)">
          <button class="btn btn-add-now" (click)="addItem('skillsTxt', this.professionalSkills)">
            Add
          </button>
        </div>

        <div class="d-flex flex-wrap">
          <div class="mt-3" *ngIf="professionalSkills && professionalSkills.controls.length > 0">
            <ng-container *ngFor="let item of professionalSkills.controls; let i = index">
              <h5 class="me-3 w-100 requirement-badge">
                {{item.value}}
                <img src="/assets/images/placeholder/icons/remove-white.png" style="height: 10px; margin-top: 3px"
                  class="ms-2 float-end" (click)="removeItem(i, this.professionalSkills)">
              </h5>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mb-3 mt-5 ms-2">
    <h5 class="mt-3 main-title">Certification / Awards</h5>
  </div>
  <ng-container *ngFor="let certFormGroup of certifications.controls; let i = index">
    <app-awards-details [bindFG]="certFormGroup" [controlIndex]="i" (arrayFormArray)="addMeToArray($event)"
      (removeArrayFormArray)="removeMeToArray($event)">
    </app-awards-details>
  </ng-container>
</form>
