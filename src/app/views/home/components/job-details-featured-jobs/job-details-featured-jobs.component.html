<div class="row">
	<ng-container *ngFor="let data of featuredJobs; let i = index">
		<div class="col-12 col-md-6 col-lg-4" 
		[@animate]="{value:'*', params:{ y:'-10px', delay: (i * 150) + 'ms' }}">
			<ng-container>
				<app-job-card [data]="data" [i]="i"></app-job-card>
			</ng-container>
		</div>
	</ng-container>
</div>
