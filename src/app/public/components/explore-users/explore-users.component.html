
<div class="container mb-5">
	<div class="bg-banner" >
		<div class="p-5">

			<div class="banner-text">
				<ng-container *ngIf="userRole == '3'">
					<h5 class="title-banner mb-3" >{{ 'PUBLIC_PAGE.RESUME_UPLOAD_BOX_MESSAGE' | translate }}</h5>

					<div class="mt-4">
						<button class="btn btn-upload" (click)="redirectToCreate('resume')">
							{{ 'PUBLIC_PAGE.RESUME_UPLOAD_BUTTON' | translate }}</button>
					</div> 
				</ng-container>

				<ng-container *ngIf="!userRole || userRole != '3'">
					<h5 class="title-banner mb-3" >Let's find a solution to your problem</h5>

					<div class="mt-4">
						<button class="btn btn-upload" (click)="redirectToCreate('job')">Create Jobs</button>
					</div>
				</ng-container>
			</div>
		</div>
	</div>


</div>
