<div class="card card-body mb-3" >
	<div class="banner-thumbnail">
		<img [src]="data?.banner_thumbnail" class="img img-fluid imb-banner">
	</div>

	<div class="p-3 py-3">
		<div class="d-flex mb-3">
			<img src="/assets/images/placeholder/icons/{{badge}}.png" 
			*ngFor="let badge of data?.badge"
			style="width: 30px" class="me-3">
		</div>


		<h5 class="title-job-title">{{data?.title}}</h5>
		<p class="title-company">{{data?.company}}</p>

		<div class="d-flex">
			<h5 class="d-flex title-details me-3">
				<img src="/assets/images/placeholder/icons/job-icon-type.png" class="me-2" style="width: 15px; height: 14px; margin-top: 2px;"> 
				{{data?.job_type}}
			</h5>

			<h5 class="d-flex title-details me-2">
				<img src="/assets/images/placeholder/icons/job-icon-type.png" class="me-2" style="width: 15px; height: 14px; margin-top: 2px;"> 
				{{data?.work_setup}}
			</h5>
		</div>

		<div class="d-flex">
			<h5 class="d-flex title-details me-3">
				<img src="/assets/images/placeholder/icons/job-icon-address.png" class="me-2" style="width: 15px; height: 17.5px; margin-top: 2px;"> 
				{{data?.address}}
			</h5>

		</div>

		<div class="d-flex mt-2">
			<h5 class="d-flex title-details me-3">
				<img src="/assets/images/placeholder/icons/job-icon-salary.png" class="me-2" style="width: 18px; height: 13px; margin-top: 3px;"> 
				PHP {{data?.salary_min | number:'1.0':'en-US' }} - PHP {{data?.salary_max | number:'1.0':'en-US' }}
			</h5>
		</div>

		<div class="tags mt-2">
			<div class="title-tags me-2 mb-2" *ngFor="let tag of data?.tags">{{tag}}</div>
		</div>

		<div class="w-100 mt-1">
			<button class="btn btn-primary d-block w-100 hvr-grow">Apply Now</button>
		</div>
	</div>
</div>
