<div class="card card-body" [@animate]="{value:'*', params:{ x:'-10px', delay:'350ms' }}">

		<img src="/assets/images/face-3.jpg" class="img-fluid">
	</div>

	<div class="details text-center mt-3">
		<h5 class="title-main">Jordan Clark</h5>
		<p class="title-job">Frontend Developer</p>
	</div>

	<div class="d-flex align-items-center justify-content-center">
		<button class="btn btn-message me-2 hvr-grow">Message</button>

		<button class="btn btn-invite hvr-grow">
			<img src="/assets/images/placeholder/icons/invite.png">
		</button>

	<div class="mt-3">
		<h5 class="title-contact">Contact</h5>

		<table class="w-100 contact-table">

				</tr>

				</tr>
				<tr>
					<td class="title-label">Address</td>
					<td class="title-details text-end">San Antonio MI 47096</td>
				</tr>
				<tr>
					<td class="title-label">Mobile Phone</td>
					<td class="title-details text-end">(+63) 934 3432</td>
				</tr>
			</tbody>
		</table>
	</div>


	<div class="mt-4">
		<h5 class="title-contact">Documents</h5>

		<table class="w-100 document-table">
			<tbody>
				<tr>
					<td class="title-label"
					style="width: 30px">
						<img src="/assets/images/placeholder/icons/document.png" style="height: 20px">
					</td>
					<td class="title-label">Resume.pdf</td>
					<td class="title-details download text-end">
						<img src="/assets/images/placeholder/icons/download.png">

				</tr>

					<td class="title-label"

					<td class="title-label"
					style="width: 30px">
						<img src="/assets/images/placeholder/icons/document.png" style="height: 20px">
					</td>
					<td class="title-label">Cover Letter 2022.pdf</td>
					<td class="title-details download text-end">
						<img src="/assets/images/placeholder/icons/download.png">
					</td>
				</tr>

		</table>
