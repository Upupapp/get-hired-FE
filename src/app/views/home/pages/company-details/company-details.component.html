<div class="p-4 px-lg-5">
	<h5 class="title-main ms-4 mt-3">Company Details</h5>
	
	<div class="p-lg-3">
		<section class="mb-4">
			<app-company-banner
			[companyData]="selectedCompany"></app-company-banner>
		</section>

		<h5 class="title-main ms-3">Latest Jobs and Careers

		</h5>
		<p class="ms-3">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed <br>do eiusmod tempor incididunt ut labore et dolore magna aliqua. 
			<span class="float-end me-4 view-all">View All</span>
		</p>

		<div class="row px-lg-3">
			<ng-container *ngFor="let data of latestjobs.slice(0, 3); let i = index">
				<div class="col-12 col-md-6 col-lg-4" [@animate]="{value:'*', params:{ y:'-10px', delay: (i * 150) + 'ms' }}">

					<ng-container>
						<app-latest-job-post [data]="data" [i]="i"></app-latest-job-post>
					</ng-container>
				</div>
			</ng-container>
		</div>

		<h5 class="title-main ms-3 mt-3 mb-4">Featured Top Jobs
			<span class="float-end me-4 view-all">View All</span>
		</h5>

		<div class="row px-lg-3">
			<ng-container *ngFor="let data of latestjobs.slice(1, 4); let i = index">
				<div class="col-12 col-md-6 col-lg-4" [@animate]="{value:'*', params:{ y:'-10px', delay: (i * 150) + 'ms' }}">

					<ng-container>
						<app-top-jobs [data]="data" [i]="i"></app-top-jobs>
					</ng-container>
				</div>
			</ng-container>
		</div>
	</div>
</div>
