  <div class="mt-4 ps-4 pe-4" id="job-order-main-container">
  <div [@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}">
    <div class="card card-body py-3">
      <div class="w-100">
        <span class="main-title mt-3">Contact List</span>

        <div class="float-end">
          <button class="gh-btn-primary" (click)="addContacts()">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
            Add Contact
          </button>
        </div>
      </div>
    </div>
    <br>
    <div class="card card-body" *ngIf="listView && !loading">
      <app-reusable-table [loading]="loading" (updateSelectedRowDialog)="editContact($event)"
        (viewDetails)="editContact($event)" [componentTitle]="'Contacts'" [displayedColumns]="displayedColumns"
        [selectedColumns]="selectedColumns" [selectedColumnsMobile]="selectedColumns" [searchSource]="searchSource"
        [maxRows]="10" [listDataSource]="contactList"
        (deleteSelectedRow)="deleteRow($event)" 
        (customButtonEvent)="viewContactGroup($event)"
        (updateSelectedRowDialog)="editContact($event)">
      </app-reusable-table>
    </div>


    <!-- LOADING ANIMATION SCREEN -->
    <custom-profile-loader [withSideBar]="false" [fromDetailTab]="true" [loading]="loading">
    </custom-profile-loader>
  </div>
</div>
