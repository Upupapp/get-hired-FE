<div class="w-100 mb-3" style="height: 20px;">
  <span class="float-end">
    <!-- NOTIFY-FIX-1: close button gets aria-label so screen readers can identify it -->
    <button type="button" class="btn p-0 border-0 bg-transparent" (click)="cancel()" aria-label="Close recorder">
      <img src="/assets/images/placeholder/icons/remove-gray.png" style="height: 15px; width: 15px; cursor: pointer;" aria-hidden="true">
    </button>
  </span>

  <h5 class="title-main" *ngIf="data?.title">{{data?.title}}</h5>
</div>

<div class="row p-2 record-container">
  <div class="col-12 col-md-8">

    <div style="position: relative;">
      <div class="container-bg"></div>

      <div class="get-hired-logo">
        <img src="/assets/images/placeholder/logo.png">
      </div>

      <!-- VIDEO CONTAINER -->
      <section>
        <div class="gh-recorder-preview" [hidden]="!isVideoRecording || !videoBlobUrl">
          <video #videoElement class="w-100" controls autoplay="autoplay">
            <source *ngIf="isVideoRecording" [src]="videoBlobUrl">

            <!-- <source *ngIf="!isVideoRecording && videoBlobUrl" [src]="videoBlobUrl"> -->
          </video>
        </div>

        <div class="video-placeholder" *ngIf="!isVideoRecording || !videoBlobUrl">
        </div>

        <!-- <video #preview id="preview"
        [src]="videoBlobUrl" controls class="w-100 h-100"
        *ngIf="videoBlobUrl"></video> -->
      </section>

      <div style="position: absolute; left: 2%; bottom: 4%;">
        <div class="bg-timer text-center">
          <div class="mt-2 d-flex">
            <h5 class="title-timer me-2">
              <img src="/assets/images/placeholder/icons/record.png" style="height:18px" class="me-1">
              {{display}}
            </h5>
            <p class="title-duration">3 Minutes</p>
          </div>
        </div>
      </div>

      <!-- NOTIFY-FIX-2: surface camera/permission error in-UI; videoRecordingError is set by
           the component on both getUserMedia rejection and the recordingFailed() observable. -->
      <div class="alert alert-danger mt-2 mx-2 py-2 px-3" role="alert"
           *ngIf="videoRecordingError"
           style="position: absolute; top: 0; left: 0; right: 0; z-index: 10;">
        <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
        {{ videoRecordingError }}
        <br><small>Check your browser's camera permission (usually in the address bar) and try again.</small>
      </div>

      <div class="gh-recorder-controls" style="position: absolute; right: 0; top: 0">
        <!-- NOTIFY-FIX-3: decorative record icon gets alt="" since button text is sufficient -->
        <button class="btn btn-take-interview text-truncate my-2 gh-recorder-btn-primary" (click)="startVideoRecording()"
          *ngIf="!isVideoRecording">
          <img src="/assets/images/placeholder/icons/record.png" class="h-100 me-1" alt="">
          Start Recording
        </button>
        <button class="btn btn-take-interview my-2 text-truncate gh-recorder-btn-primary gh-recorder-recording-pulse" (click)="stopVideoRecording()"
          *ngIf="isVideoRecording">
          <img src="/assets/images/stop.png" class="h-100 me-1" alt="">
          Stop Recording
        </button>
      </div>
    </div>
  </div>

  <div class="col-12 col-md-4 bg-white p-3">
    <div class="card card-body">
      <app-recorder-setting></app-recorder-setting>
    </div>

    <div class="mt-2 gh-recorder-controls" style="flex-direction: column; align-items: stretch;">
      <button class="btn btn-primary my-1 w-100 gh-recorder-btn-secondary" (click)="previewVideoRecording()" [disabled]="!videoBlob">
        View Recording
      </button>
      <input #uploadFile hidden type="file" (change)="upload($event)" accept="video/mp4,video/x-m4v,video/*" />
      <button class="btn btn-primary w-100 btn-block mb-3 gh-recorder-btn-secondary" (click)="uploadFile.click()">
        <i class="bi bi-cloud-upload me-3"></i>
        Upload Video Instead
      </button>
    </div>

  </div>
</div>
