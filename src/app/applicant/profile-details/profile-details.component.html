<section class="mt-4 px-4">
	<div class="ps-2 mb-3"
	[@animate]="{value:'*', params:{ x:'10px', delay:'450ms' }}">

		<div class="text-end">
			<h5 class="title-experience float-start mt-3">{{ 'PROFILE.PUBLIC_VIEW_TEXT' | translate }}
			</h5>

			<button class="btn btn-invite me-2 hvr-grow" (click)="redirectToEdit()">{{ 'PROFILE.EDIT_PROFILE_BUTTON' | translate }}</button>
		</div>
	</div>


	<div class="card card-body">
    <app-preview [isApplicantView]="isApplicantView"></app-preview>
	</div>
</section>
