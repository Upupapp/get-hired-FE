<div class="container-fluid" >
	<div class="row">
		<div class="col-12 col-md-12 col-lg-6 bg-left">
			<div class="img-banner text-center"
			style="z-index: 999999 !important; position: relative;">
				<ng-container *ngIf="activeImage === 1">
					<div [@animate]="{value:'*', params:{ y:'-50px', delay:'200ms' }}">
						<img class="main-logo"
						src="/assets/images/placeholder/logo.png"
						routerLink="/">

						<h5 class="title-left-main">
						Bring all your applicants in</h5>
						<h4 class="title-left-gradient">ONE PLATFORM</h4>
						<h5 class="title-left-main">in just  3 clicks.</h5>
					</div>

					<img [@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}"
					src="/assets/images/placeholder/login-object-new-2.png" class="img-object">
				</ng-container>

				<ng-container *ngIf="activeImage === 2">
					<div [@animate]="{value:'*', params:{ y:'-50px', delay:'200ms' }}">
						<img class="main-logo"
						src="/assets/images/placeholder/logo.png"
						routerLink="/">

						<h5 class="title-left-main">
						Interview
							<span class="title-left-gradient">ALL </span> your applicants
						</h5>

						<h4 class="title-left-gradient">AUTOMATICALLY</h4>
					</div>

					<img src="/assets/images/placeholder/login-object-new-1.png"
						[@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}"
						class="img-object">
				</ng-container>

				<ng-container *ngIf="activeImage === 3">
					<div [@animate]="{value:'*', params:{ y:'-50px', delay:'200ms' }}">
						<img class="main-logo"
						src="/assets/images/placeholder/logo.png"
						routerLink="/">

						<h5 class="title-left-main">
						Choose the
							<span class="title-left-gradient">BEST </span> Applicants <br>from their interview answers
						</h5>

						<h4 class="title-left-gradient">Lights, Camera, GetHired.</h4>
					</div>
					<img src="/assets/images/placeholder/login-object-new-3.png"
						[@animate]="{value:'*', params:{ x:'-50px', delay:'200ms' }}"
						class="img-object mt-3">
				</ng-container>
			</div>
		</div>

		<div class="col-12 col-md-12 col-lg-6 bg-form mt-lg-5">
			<div class="card py-5"  [@animate]="{value:'*', params:{ x:'50px', delay:'200ms' }}">
				<!-- Error Message -->
				<form class="px-3" (submit)="loginAdmin($event)" [formGroup]="adminLoginForm">
					<div class="form-group text-start mb-2">
						<h4 class="main-title m-0 mb-3">Sign in to your account</h4>
					</div>

					<div class="alert alert-danger alert-dismissible fade show error-message" [@animate]="{value:'*', params:{ y:'50px', delay:'600ms' }}" *ngIf="error" role="alert">
					  	<button type="button" class="btn-close hvr-buzz-out" data-bs-dismiss="alert" aria-label="Close" (click)="onAlertClose()"></button>
					  	<span [innerHtml]="error"></span>
					</div>

					<div class="form-group">
						<input type="email" class="form-control" formControlName="email" name="email" placeholder="username@mailer.com">

						<label for="email" class="d-flex">

							<div>Email</div>
						</label>
					</div>

					<div class="form-group mt-4">
						<input [type]="inputType" class="form-control" id="password" placeholder="********************" formControlName="password">

						<label for="password" class="d-flex">
							<div>Password</div>
						</label>

						<div>
							<img src="/assets/images/placeholder/icons/hide-password.png" width="23px"
							class="img-fluid me-2 img-plc" *ngIf="inputType === 'password'"
							(click)="inputType = 'text'"
							style="margin-top: -15px;">

							<img src="/assets/images/placeholder/icons/show-password.png" width="23px"
							class="img-fluid me-2 img-plc" *ngIf="inputType === 'text'"
							(click)="inputType = 'password'"
							style="margin-top: -15px;">
						</div>
					</div>

					<div class="mt-3">
						<a [routerLink]="'/forgot-password'" class="mat-primary text-center forget-password hvr-grow float-end">Forgot your password?</a>
					</div>

					<br>
					<button type="submit" class="btn btn-submit d-block w-100 float-end mt-4 mb-3"
					[disabled]="submitting" style="height: 55px !important">
						Sign In
						<img src="/assets/images/placeholder/loading-login.gif" width="20px" class="img-fluid float-end mt-1 me-2" *ngIf="submitting">
					</button>

					<div class="text-center mt-5 join-us">
						<br><br>
						Don't have an account? <a [routerLink]="'/signup'"
						class="register">Register</a>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
