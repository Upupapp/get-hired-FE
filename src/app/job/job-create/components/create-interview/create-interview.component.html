<div class="card card-body mt-3">
	<div class="row"
	[@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
		<!-- EMPLOYMENT DETAILS -->
		<div class="col-12">
			<h5 class="title-label">Interview Questions</h5>
			<hr style="border: dashed 1px #868686">
		</div>
    <app-create-question (addItem)="addQuestion($event)" [questionIndex]="interviewQuestions.length + 1"></app-create-question>
	</div>


</div>

<h5 class="title-label mt-4" *ngIf="interviewQuestions.length > 0"
[@animate]="{value:'*', params:{ y:'10px', delay:  (250) + 'ms' }}">
	Questions Preview
</h5>

<section class="card card-body mt-3"
*ngFor="let item of interviewQuestions.value; let i = index"
[@animate]="{value:'*', params:{ y:'10px', delay:  (i + 150) + 'ms' }}">
	<!-- INTERVIEWS -->
	<div class="mt-2 row">
		<div class="col-12">
			<div class="float-end">
				<div class="text-end">
					<img src="/assets/images/placeholder/icons/remove-gray.png"
					style="height: 14px; margin-top: -17px; cursor: pointer;" class="me-2"
					(click)="removeItem(i, this.interviewQuestions)">
				</div>

				<div class="mt-2">
					<button class="btn btn-upload me-2">Upload</button>

					<button class="btn btn-record"><img src="/assets/images/placeholder/icons/make-video.png" style="height: 10px" class="me-2">Record Interview</button>
				</div>
			</div>

			<div class="d-flex">
				<div class="logo-thumbnail me-3 d-flex align-items-center justify-content-center">
					<img src="/assets/images/placeholder/icons/interview-logo-4.png">
				</div>

				<div class="mt-2">
					<p class="title-label-sub">
						<img src="/assets/images/placeholder/icons/interview-logo-3.png" class="me-2" style="height: 20px;">
						Question {{i + 1}}
					</p>
					<h5 class="title-label">{{item?.question}}</h5>
					<p class="title-label-sub-duration"><span>Estimated Duration:</span> {{item?.answerDuration}} minutes</p>
				</div>
			</div>
		</div>
	</div>
</section>
