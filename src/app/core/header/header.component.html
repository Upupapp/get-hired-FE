<nav class="gh-public-nav fixed-top navbar navbar-expand-lg" [class.gh-public-nav--shadow]="isPublic" role="banner">
  <div class="gh-public-nav-inner">

    <!-- Logo -->
    <a class="gh-nav-logo" routerLink="/home" aria-label="GetHired — go to home" *ngIf="isPublic">
      <img src="assets/brand/Gethired-horizontal-logo.png?v=3"
           class="gh-nav-logo-img"
           alt="GetHired Online">
    </a>

    <!-- Mobile hamburger — stays the same size/shape and swaps its icon to
         a downward-facing arrow while the floating menu panel is open
         (pointing at the panel below it), and doubles as the toggle to
         close it again. -->
    <button
      #mobileMenuBtn
      class="gh-nav-toggler"
      type="button"
      (click)="mobileNavOpen ? closeMobileNav() : openMobileNav()"
      [attr.aria-expanded]="mobileNavOpen"
      [attr.aria-label]="mobileNavOpen ? 'Close navigation menu' : 'Open navigation menu'"
      aria-controls="ghMobileFloatMenu">
      <svg class="gh-menu-icon" *ngIf="!mobileNavOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg class="gh-menu-icon gh-menu-icon--arrow" *ngIf="mobileNavOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <polyline points="6 13 12 19 18 13"/>
      </svg>
    </button>

    <!-- Desktop nav items — unchanged, visible only ≥992px -->
    <div class="gh-nav-desktop-list d-none d-lg-flex">
      <ul class="navbar-nav ms-auto align-items-center gh-nav-list">

        <li class="nav-item" *ngIf="isPublic">
          <a routerLink="/jobs" class="gh-nav-btn-primary gh-pressable">Browse jobs</a>
        </li>

        <li class="nav-item" *ngIf="!isPublic">
          <button class="gh-nav-btn-primary" type="button" (click)="navigateToJobs()">
            Jobs
          </button>
        </li>

        <li class="nav-item gh-nav-lang" *ngIf="!isPublic">
          <app-language-selection title="Language"></app-language-selection>
        </li>

        <!-- Notification bell + center -- shown for any signed-in portal
             user (employer or jobseeker); the backend scopes results to
             the caller's own uid regardless of role. -->
        <li class="nav-item gh-nav-notif-wrap" *ngIf="!isPublic && isUserLoggedIn && user">
          <button class="gh-nav-notif-btn gh-pressable" type="button"
            (click)="toggleNotifPanel()"
            [attr.aria-expanded]="notifPanelOpen"
            aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" width="22" height="22"
                 aria-hidden="true" focusable="false">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="gh-nav-notif-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
          </button>

          <div class="gh-float-menu-catcher gh-float-menu-catcher--visible"
               *ngIf="notifPanelOpen" (click)="closeNotifPanel()" aria-hidden="true"></div>

          <div class="gh-nav-notif-panel" *ngIf="notifPanelOpen" role="dialog" aria-label="Notifications">
            <div class="gh-nav-notif-panel-header">
              <span>Notifications</span>
              <button type="button" class="gh-nav-notif-mark-all" *ngIf="unreadCount > 0"
                (click)="markAllNotificationsRead()">Mark all read</button>
            </div>
            <div class="gh-nav-notif-list">
              <p class="gh-nav-notif-empty" *ngIf="notifications.length === 0">No notifications yet.</p>
              <button type="button" class="gh-nav-notif-item" *ngFor="let n of notifications"
                [class.gh-nav-notif-item--unread]="!n.isRead"
                (click)="onNotificationClick(n)">
                <span class="gh-nav-notif-item-title">{{ n.title }}</span>
                <span class="gh-nav-notif-item-body">{{ n.body }}</span>
                <span class="gh-nav-notif-item-time">{{ n.createdAt | date:'MMM d, h:mm a' }}</span>
              </button>
            </div>
          </div>
        </li>

        <li class="nav-item">
          <div *ngIf="!isUserLoggedIn">
            <button class="gh-nav-btn-signin gh-pressable" type="button"
              (click)="redirectToRegister()" aria-label="Sign in to your account">
              Sign In
            </button>
          </div>

          <div class="gh-nav-avatar-wrap dropdown" *ngIf="isUserLoggedIn && user">
            <button class="gh-nav-avatar gh-pressable" type="button"
              id="navAvatarBtn"
              data-bs-toggle="dropdown" aria-expanded="false"
              [attr.aria-label]="'Account menu for ' + user.firstName">
              <img [src]="user.photoUrl" *ngIf="user.photoUrl" class="gh-nav-avatar-img" alt="">
              <span *ngIf="!user.photoUrl" class="gh-nav-avatar-initials" aria-hidden="true">
                {{ initials }}
              </span>
            </button>
            <ul class="dropdown-menu gh-nav-dropdown" aria-labelledby="navAvatarBtn">
              <li class="gh-nav-dropdown-header" (click)="goToDashboard()">
                <img [src]="user.photoUrl" *ngIf="user.photoUrl" class="gh-dropdown-avatar" alt="">
                <div *ngIf="!user.photoUrl" class="gh-dropdown-avatar gh-dropdown-initials" aria-hidden="true">
                  {{ initials }}
                </div>
                <div>
                  <p class="gh-dropdown-name">{{ user.firstName + ' ' + user.lastName }}</p>
                  <p class="gh-dropdown-company">{{ user.companyName }}</p>
                </div>
              </li>
              <li>
                <!-- A11Y FIX: was a non-focusable <span> for a critical action
                     (logout) -- keyboard users could not reach or activate
                     it. Real <button>, same visual class. -->
                <button type="button" class="gh-nav-dropdown-item" (click)="logout()">Log out</button>
              </li>
            </ul>
          </div>
        </li>

      </ul>
    </div>
  </div>
</nav>

<!-- Invisible click-outside catcher — transparent (this is a floating
     panel, not a modal drawer, so no dark scrim), just enough to dismiss
     on an outside tap. -->
<div class="gh-float-menu-catcher"
     [class.gh-float-menu-catcher--visible]="mobileNavOpen"
     (click)="closeMobileNav()"
     aria-hidden="true">
</div>

<!-- Floating menu panel — anchored top-right with breathing room from both
     edges, morphs in from the hamburger button's own corner (shared
     transform-origin). Has its own explicit close (X); Escape and an
     outside tap also dismiss it. -->
<nav id="ghMobileFloatMenu"
     class="gh-float-menu"
     [class.gh-float-menu--open]="mobileNavOpen"
     role="navigation"
     aria-label="Main navigation"
     cdkTrapFocus
     [cdkTrapFocusAutoCapture]="mobileNavOpen">

  <div class="gh-float-menu-header">
    <span class="gh-float-menu-title">Menu</span>
    <button #firstDrawerLink class="gh-float-menu-close"
            type="button"
            aria-label="Close navigation menu"
            (click)="closeMobileNav()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           width="18" height="18" aria-hidden="true" focusable="false">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <ul class="gh-float-menu-list" role="list">

    <li role="listitem" *ngIf="isPublic">
      <a routerLink="/jobs" class="gh-float-menu-item" (click)="closeMobileNav()">
        <span class="gh-float-menu-label">Browse jobs</span>
      </a>
    </li>

    <li role="listitem" *ngIf="!isPublic">
      <button type="button" class="gh-float-menu-item gh-float-menu-item--btn"
        (click)="navigateToJobs(); closeMobileNav()">
        <span class="gh-float-menu-label">Jobs</span>
      </button>
    </li>

    <li role="listitem" *ngIf="isPublic && !isUserLoggedIn">
      <a routerLink="/employers" class="gh-float-menu-item" (click)="closeMobileNav()">
        <span class="gh-float-menu-label">Start hiring</span>
      </a>
    </li>

    <li role="listitem" class="gh-float-menu-lang" *ngIf="!isPublic">
      <app-language-selection title="Language"></app-language-selection>
    </li>

    <li role="listitem" *ngIf="!isPublic && isUserLoggedIn && user">
      <button type="button" class="gh-float-menu-item gh-float-menu-item--btn"
        (click)="toggleNotifPanel(); closeMobileNav()">
        <span class="gh-float-menu-label">Notifications</span>
        <span class="gh-nav-notif-badge gh-nav-notif-badge--inline" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
      </button>
    </li>

    <!-- Logged out: Sign In -->
    <li role="listitem" *ngIf="!isUserLoggedIn">
      <button type="button" class="gh-float-menu-item gh-float-menu-item--btn gh-float-menu-item--primary"
        (click)="redirectToRegister(); closeMobileNav()" aria-label="Sign in to your account">
        <span class="gh-float-menu-label">Sign In</span>
      </button>
    </li>

    <!-- Logged in: account section, flattened (no nested dropdown) -->
    <ng-container *ngIf="isUserLoggedIn && user">
      <li role="listitem" class="gh-float-menu-account">
        <button type="button" class="gh-float-menu-account-btn" (click)="goToDashboard(); closeMobileNav()">
          <img [src]="user.photoUrl" *ngIf="user.photoUrl" class="gh-float-menu-account-avatar" alt="">
          <span *ngIf="!user.photoUrl" class="gh-float-menu-account-avatar gh-float-menu-account-initials" aria-hidden="true">
            {{ initials }}
          </span>
          <span class="gh-float-menu-account-info">
            <span class="gh-float-menu-account-name">{{ user.firstName + ' ' + user.lastName }}</span>
            <span class="gh-float-menu-account-company" *ngIf="user.companyName">{{ user.companyName }}</span>
          </span>
        </button>
      </li>
      <li role="listitem">
        <button type="button" class="gh-float-menu-item gh-float-menu-item--btn gh-float-menu-item--danger"
          (click)="logout(); closeMobileNav()">
          <span class="gh-float-menu-label">Log out</span>
        </button>
      </li>
    </ng-container>

  </ul>
</nav>
