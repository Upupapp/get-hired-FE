<section id="body-main-container" *ngIf="user$ | async as user">

  <!-- MOBILEVIEW: Admin mobile top bar -->
  <div class="gh-admin-mobile-topbar d-flex d-md-none" role="banner">
    <button
      #mobileMenuBtn
      class="gh-admin-mobile-menu-btn"
      type="button"
      (click)="openMobileNav()"
      [attr.aria-expanded]="mobileNavOpen"
      [attr.aria-label]="mobileNavOpen ? 'Close navigation menu' : 'Open navigation menu'"
      aria-controls="gh-admin-mobile-drawer">
      <svg class="gh-admin-menu-icon" [class.gh-admin-menu-icon--open]="mobileNavOpen"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <line class="gh-admin-menu-line gh-admin-menu-line--top" x1="3" y1="6" x2="21" y2="6"/>
        <line class="gh-admin-menu-line gh-admin-menu-line--mid" x1="3" y1="12" x2="21" y2="12"/>
        <line class="gh-admin-menu-line gh-admin-menu-line--bot" x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="gh-admin-mobile-topbar-title" aria-hidden="true">GetHired Admin</span>
  </div>

  <!-- MOBILEVIEW: Admin scrim overlay -->
  <div class="gh-admin-mobile-scrim"
       [class.gh-admin-mobile-scrim--visible]="mobileNavOpen"
       (click)="closeMobileNav()"
       aria-hidden="true">
  </div>

  <!-- MOBILEVIEW: Admin mobile drawer -->
  <nav id="gh-admin-mobile-drawer"
       class="gh-admin-mobile-drawer"
       [class.gh-admin-mobile-drawer--open]="mobileNavOpen"
       role="navigation"
       aria-label="Admin navigation"
       cdkTrapFocus
       [cdkTrapFocusAutoCapture]="mobileNavOpen">

    <div class="gh-admin-drawer-header">
      <img src="assets/brand/gethired-logo-horizontal-on-light-interim.png"
           class="gh-admin-drawer-logo"
           alt="GetHired Admin"
           aria-hidden="true">
      <button class="gh-admin-drawer-close-btn"
              type="button"
              aria-label="Close navigation menu"
              (click)="closeMobileNav()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             width="20" height="20" aria-hidden="true" focusable="false">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <ul class="gh-admin-drawer-nav" role="list">
      <li role="listitem" *ngFor="let item of navItems">
        <a #drawerLink
           [routerLink]="'/admin/' + item.route"
           routerLinkActive="gh-admin-drawer-nav-item--active"
           [routerLinkActiveOptions]="{ exact: !!item.exact }"
           #drawerRla="routerLinkActive"
           [attr.aria-current]="drawerRla.isActive ? 'page' : null"
           class="gh-admin-drawer-nav-item"
           (click)="closeMobileNav()">
          <app-admin-nav-icon class="gh-admin-drawer-nav-icon" [name]="item.icon" [size]="20"></app-admin-nav-icon>
          <span class="gh-admin-drawer-nav-label">{{ item.title }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="d-flex" id="body-row">
    <!-- SIDEBAR — hidden on mobile -->
    <div class="d-none d-md-block" id="sidebar-container">
      <app-admin-sidebar [user]="user"></app-admin-sidebar>
    </div>

    <div id="main-applicant-component">
      <!-- Header -->
      <div style="margin-bottom: 80px; ">
        <app-header [isPublic]="false"
        [isUserLoggedIn]="isUserLoggedIn" [user]="user"></app-header>
      </div>

      <div id="sub-applicant-component">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

  <!-- MOBILEVIEW: Admin bottom nav bar -->
  <nav class="gh-admin-mobile-nav d-flex d-md-none" aria-label="Mobile admin navigation" role="navigation">
    <a *ngFor="let item of navItems"
      [routerLink]="'/admin/' + item.route"
      routerLinkActive="gh-admin-mobile-nav-item--active"
      [routerLinkActiveOptions]="{ exact: !!item.exact }"
      class="gh-admin-mobile-nav-item"
      [attr.aria-label]="item.title">
      <app-admin-nav-icon [name]="item.icon" [size]="22"></app-admin-nav-icon>
      <span class="gh-admin-mobile-nav-label">{{ item.title }}</span>
    </a>
  </nav>

</section>
