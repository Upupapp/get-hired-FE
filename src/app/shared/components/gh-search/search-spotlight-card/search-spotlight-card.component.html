<div class="gh-spotlight" role="region" aria-label="Company match">

  <!-- Label -->
  <div class="gh-spotlight-label">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
    Company match
  </div>

  <!-- Main content -->
  <div class="gh-spotlight-body">

    <!-- Logo -->
    <div class="gh-spotlight-logo-wrap" aria-hidden="true">
      <img
        *ngIf="spotlight.companyLogoUrl && !logoError"
        [src]="spotlight.companyLogoUrl"
        [alt]="spotlight.companyName + ' logo'"
        class="gh-spotlight-logo"
        loading="eager"
        decoding="async"
        (error)="onLogoError()" />
      <span *ngIf="!spotlight.companyLogoUrl || logoError" class="gh-spotlight-logo-fallback">
        {{ initial }}
      </span>
    </div>

    <!-- Info -->
    <div class="gh-spotlight-info">
      <h2 class="gh-spotlight-name">{{ spotlight.companyName }}</h2>
      <div class="gh-spotlight-meta" role="list">
        <span *ngIf="spotlight.industry" class="gh-spotlight-meta-item" role="listitem">{{ spotlight.industry }}</span>
        <span *ngIf="spotlight.location" class="gh-spotlight-meta-item" role="listitem">{{ spotlight.location }}</span>
        <span class="gh-spotlight-meta-item gh-spotlight-meta-item--jobs" role="listitem">
          {{ spotlight.openJobsCount }} open role{{ spotlight.openJobsCount === 1 ? '' : 's' }}
        </span>
      </div>
    </div>

    <!-- CTAs -->
    <div class="gh-spotlight-ctas">
      <button
        *ngIf="spotlight.companySlug"
        class="gh-spotlight-btn gh-spotlight-btn--secondary"
        type="button"
        [attr.aria-label]="'View ' + spotlight.companyName + ' profile'"
        (click)="viewCompany()">
        Company profile
      </button>
      <button
        class="gh-spotlight-btn gh-spotlight-btn--primary"
        type="button"
        [attr.aria-label]="'View all jobs at ' + spotlight.companyName"
        (click)="viewJobs()">
        View {{ spotlight.openJobsCount }} open role{{ spotlight.openJobsCount === 1 ? '' : 's' }}
      </button>
    </div>

  </div>

  <!-- Top matching jobs -->
  <div *ngIf="spotlight.topJobs && spotlight.topJobs.length > 0" class="gh-spotlight-jobs">
    <div class="gh-spotlight-jobs-label">Open roles</div>
    <div class="gh-spotlight-job-list" role="list">
      <button
        *ngFor="let job of spotlight.topJobs"
        class="gh-spotlight-job-item"
        role="listitem"
        type="button"
        [attr.aria-label]="'View job: ' + job.title"
        (click)="viewJob(job.jobId)">
        <span class="gh-spotlight-job-title">{{ job.title }}</span>
        <span class="gh-spotlight-job-chips">
          <span *ngIf="job.workSetup" class="gh-spotlight-job-chip">{{ job.workSetup }}</span>
          <span *ngIf="job.location" class="gh-spotlight-job-chip">{{ job.location }}</span>
        </span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>

</div>
