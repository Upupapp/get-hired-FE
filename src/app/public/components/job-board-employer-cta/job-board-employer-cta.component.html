<div class="employer-cta-banner" *ngIf="!dismissed" role="complementary" aria-label="Employer hiring message">
  <span class="employer-cta-text">
    Hiring in the Philippines? Post your job on GetHired and reach {{ displayCopy }}.
  </span>
  <div class="employer-cta-actions">
    <button type="button" class="employer-cta-button gh-pressable" (click)="postJob()">Post a job</button>
    <button type="button" class="employer-cta-dismiss" aria-label="Dismiss this message" (click)="dismiss()">
      &times;
    </button>
  </div>
</div>
