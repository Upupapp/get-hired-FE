<div class="p-3">
  <h5 class="title-main ms-4 mt-3">Company Details</h5>

  <div class="p-lg-3" *ngIf="company$ | async as company">
    <section class="mb-4">
      <app-banner-details [details]="company"></app-banner-details>
    </section>
    <app-job-posts-list [label]="'Latest Jobs and Careers'" [companyId]="company.companyId"></app-job-posts-list>
  </div>
</div>
