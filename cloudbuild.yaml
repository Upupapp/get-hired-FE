steps:
- name: 'gcr.io/cloud-builders/npm'
  entrypoint: 'npm'
  args: ['install']
- name: 'gcr.io/cloud-builders/npm'
  entrypoint: 'npm'
  args: ['install', '-g'. '@angular/cli']
- name: 'gcr.io/cloud-builders/npm'
  entrypoint: 'npm'
  args: ['run', 'build-prod']
- name: 'gcr.io/cloud-builders/npm'
  entrypoint: 'npm'
  args: ['run', 'deploy']
timeout: "1600s"
