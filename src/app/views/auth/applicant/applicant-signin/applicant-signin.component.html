<div class="container-fluid bg-white vh-100" >
	<div class="row">
		<div class="col-12 col-md-12 col-lg-6 px-5 py-2 bg-left">
			<div class="img-banner text-center" 
			style="z-index: 999999 !important; position: relative;">
				<img src="/assets/images/placeholder/login-object-1.png" class="img-left mb-3"
				[@animate]="{value:'*', params:{ scale:'0.8', delay:'200ms' }}">
				<img src="/assets/images/placeholder/login-object-2.png" class="img-left-2 mb-3"
				[@animate]="{value:'*', params:{ x:'-10px', delay:'700ms' }}">
				<img src="/assets/images/placeholder/login-object-3.png" class="img-left-3 mb-3"
				[@animate]="{value:'*', params:{ x:'10px', delay:'700ms' }}">
			</div>
		</div>

		<div class="col-12 col-md-12 col-lg-6 bg-form">
			<div class="card py-5"  [@animate]="{value:'*', params:{ x:'50px', delay:'200ms' }}">
				<!-- Error Message -->
				<form class="px-3" (submit)="loginAdmin($event)" [formGroup]="adminLoginForm">
					<div class="form-group text-start mb-5">
						<h4 class="main-title m-0">Sign in
							<img src="/assets/images/placeholder/logo.png" 
							routerLink="/"
							[@animate]="{value:'*', params:{ y:'-50px', delay:'400ms' }}"
							style="width: 100px; cursor: pointer;" class="float-end">
						</h4>
						<br>
					</div>


					<div class="alert alert-danger alert-dismissible fade show error-message" [@animate]="{value:'*', params:{ y:'50px', delay:'600ms' }}" *ngIf="error" role="alert">
					  	<button type="button" class="btn-close hvr-buzz-out" data-bs-dismiss="alert" aria-label="Close" (click)="onAlertClose()"></button>
					  	<span [innerHtml]="error"></span>
					</div>  

					<div class="form-group mt-3">
						<!-- <label>Email Address</label>
 -->
						<input type="email" class="form-control" formControlName="email" name="email" placeholder="username@mailer.com">
					</div>

					<div class="form-group mt-3">
						<!-- <label>Password</label>
 -->
						<input [type]="inputType" class="form-control" id="password" placeholder="********************" formControlName="password">

						<div>
							<img src="/assets/images/placeholder/icons/hide-password.png" width="23px" 
							class="img-fluid me-2 img-plc" *ngIf="inputType === 'password'"
							(click)="inputType = 'text'"
							style="margin-top: -15px;">

							<img src="/assets/images/placeholder/icons/show-password.png" width="23px" 
							class="img-fluid me-2 img-plc" *ngIf="inputType === 'text'"
							(click)="inputType = 'password'"
							style="margin-top: -15px;">
						</div>
					</div>

					<div class="mt-3">
						<a [routerLink]="'/admin/forgot-password'" class="mat-primary text-center forget-password hvr-grow float-end">Forgot your password?</a>

						<a class="mat-primary text-center float-start forget-password" style="margin-top: 5px;">
							<mat-checkbox class="remember-me">Remember me</mat-checkbox>
							
						</a>
					</div>

					<br>
					<button type="submit" class="btn btn-submit d-block w-100 float-end mt-4 mb-3"
					[disabled]="submitting">
						Login
						<img src="/assets/images/placeholder/loading-login.gif" width="20px" class="img-fluid float-end mt-1 me-2" *ngIf="submitting">
					</button>

					<div class="text-center mt-5 join-us">
						<br><br>
						Don't Have an account? <a [routerLink]="'/applicant/signup'" 
						class="register">Register</a>
					</div>
				</form> 
			</div>
		</div>
	</div>
</div>
