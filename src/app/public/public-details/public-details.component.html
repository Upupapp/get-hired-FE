<!-- Loading state -->
<div *ngIf="loading" class="pd-loading" role="status" aria-live="polite">
  <div class="spinner-border text-primary" aria-hidden="true"></div>
  <p class="mt-3 text-muted">Loading job details…</p>
</div>

<!-- Error / not found state -- aligned to the same GetHired visual
     structure as the generic 404 page (see error-not-found.component),
     with job-specific messaging and no duplicate navigation actions. -->
<div *ngIf="!loading && loadError" class="gh-404" role="alert">
  <div class="gh-404__card">

    <div class="gh-404__brandbar">
      <a routerLink="/home" class="gh-404__brand" aria-label="GetHired — go to home">
        <img src="assets/brand/Gethired-horizontal-logo.png?v=3" class="gh-404__brand-logo" alt="GetHired Online">
      </a>
    </div>

    <div class="gh-404__body">
      <p class="gh-404__code">JOB NOT FOUND</p>
      <h1 class="gh-404__title">This job listing is unavailable</h1>
      <p class="gh-404__description">
        The listing you're looking for may have closed, been filled, expired, or been
        taken down by the employer, or the link you followed may be outdated. Try
        browsing our current open jobs instead.
      </p>

      <div class="gh-404__illustration">
        <img
          src="/assets/images/404_3d_img.png"
          alt=""
          aria-hidden="true"
          width="420"
          height="252"
        />
      </div>

      <div class="gh-404__actions">
        <a routerLink="/jobs" class="gh-404__btn gh-404__btn--primary hvr-grow">Browse Jobs</a>
        <a routerLink="/home" class="gh-404__btn gh-404__btn--secondary hvr-grow">Go to Homepage</a>
      </div>
    </div>

  </div>
</div>

<!-- Full-width job detail: job-posts-details owns hero, breadcrumb, and layout -->
<ng-container *ngIf="!loading && !loadError && (details$ | async) as selectedJobPost">
  <app-application-process *ngIf="isApplying" [job]="selectedJobPost" (apply)="apply($event)">
  </app-application-process>
  <app-job-posts-details [withBanner]="true" *ngIf="!isApplying" (apply)="apply($event)">
  </app-job-posts-details>
</ng-container>
