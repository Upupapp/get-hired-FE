<form [formGroup]="jobInfoForm">
  <section class="card card-body" style="transition: all 0.4s ease !important;">
    <div class="row">
      <div class="col-12 col-md-6 mb-3" *ngIf="industry$ | async as industries"
        [@animate]="{value:'*', params:{ y:'10px', delay:'250ms' }}">
        <h5 class="main-title">Industry</h5>
        <label>Describe what industry or field this job post is part of </label>
        <select class="form-select" formControlName="industryId">
          <option selected disabled [ngValue]="null">Select Industry</option>
          <ng-container *ngFor="let item of industries; let i = index">
            <option [ngValue]="item.id">{{item.name}}</option>
          </ng-container>
        </select>
      </div>

      <div class="col-12 col-md-6 mb-3" [@animate]="{value:'*', params:{ y:'10px', delay:'250ms' }}"
        *ngIf="jobRoles$ | async as roles">
        <label style="margin-top: 36px;">Job Role</label>
        <select class="form-select" formControlName="jobRoleId">
          <option selected disabled [ngValue]="null">Select Job Role</option>
          <ng-container *ngFor="let item of roles; let i = index">
            <option [ngValue]="item.id">{{item.name}}</option>
          </ng-container>
        </select>
      </div>
    </div>

    <!-- SKILLS -->
    <div class="mt-3 row" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
      <div class="col-12 col-md-6 mb-3">
        <h5 class="main-title">Relevant Skills</h5>
        <label>Add Skill for your job to see relavant talent</label>

        <div class="form-group d-flex with-add search-group">
          <input type="text" name="skills" class="form-control form-control-main" placeholder="ex. Data Encoding, Ruby, JavaScript" (keyup.enter)="addItem('jobSkillsTxt', this.skills)"
            formControlName="jobSkillsTxt">
          <button class="btn btn-add-now" (click)="addItem('jobSkillsTxt', this.skills)">
            Add
          </button>
        </div>

        <div class="d-flex flex-wrap" *ngIf="skills && skills.controls.length > 0">
          <ng-container *ngFor="let item of skills.controls; let i =index">
            <div class="flex-wrap me-3 talent-badge">{{item.value}}
              <img src="/assets/images/placeholder/icons/remove-white.png" style="height: 10px; margin-top: -3px"
                class="ms-2" (click)="removeItem(i, this.skills)">
            </div>
          </ng-container>
        </div>
      </div>

      <div class="col-12 col-md-6 mb-3">
        <h5 class="main-title">Tags</h5>

        <!-- <h5 class="main-title">Add Tags</h5> -->
        <label>Add tags for others to identify your job post easily</label>

        <div class="form-group d-flex with-add search-group">
          <input type="text" name="tags" class="form-control form-control-main" placeholder="ex. Software, Angular Project, JavaScript" (keyup.enter)="addItem('jobTagsTxt', this.tags)"
            formControlName="jobTagsTxt">
          <button class="btn btn-add-now" (click)="addItem('jobTagsTxt', this.tags)">
            Add
          </button>
        </div>

        <div class="d-flex flex-wrap" *ngIf="tags && tags.controls.length > 0">
          <ng-container *ngFor="let item of tags.controls; let i = index">
            <div class="flex-wrap me-3 talent-badge">{{item.value}}
              <img src="/assets/images/placeholder/icons/remove-white.png" style="height: 10px; margin-top: -3px"
                class="ms-2" (click)="removeItem(i, this.tags)">
            </div>
          </ng-container>
        </div>
      </div>
    </div>

    <!-- RATES -->
    <div class="mt-4 row" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
      <div class="col-12 col-md-6 mb-3">
        <div class="card card-body">
          <h5 class="main-title">Add Rate</h5>
          <label>Add a budget if you one in mind</label>

          <div class="row">
            <ng-container *ngFor="let item of rates">
              <div class="col-12 col-md-6 col-lg-4 hvr-hang" (click)="selectRate(item)">
                <div [ngClass]="selectedRates === item.title ? 'rate-card-active' : 'rate-card'">
                  <img
                    [src]="'/assets/images/placeholder/icons/' + (selectedRates === item.title ? 'check-white.png' : 'check-blank.png')"
                    class="check">

                  <img [src]="'/assets/images/placeholder/icons'
								+ (selectedRates === item.title ? item?.icon + '-white' : item?.icon) + '.png'" style="height: 45px"
                    class="img-fluid mt-2">

                  <h6 class="title-rate mt-3"
                    [ngClass]="selectedRates === item.title ? 'title-rate-active' : 'title-rate'">
                    {{item?.title}}</h6>
                </div>
              </div>
            </ng-container>
          </div>

          <div class="mt-3 row">
            <div class="col-12 col-md-12" [@animate]="{value:'*', params:{ y:'10px', delay:'200ms' }}">
              <hr style="border-style: dashed;">

              <label>Budget</label>

              <div class="row">
                <div class="col-4 form-group pe-0">
                  <input type="number" name="search" class="form-control form-control-main" placeholder="Php 25,000"
                    formControlName="salaryMinimum">
                </div>

                <div class="col-2 text-center">
                  <h5 class="title-label-sub mt-2">To</h5>
                </div>

                <div class="col-4 form-group pe-0">
                  <input type="number" name="search" class="form-control form-control-main" placeholder="Php 35,500"
                    formControlName="salaryMaximum">
                </div>

                <div class="col-2 text-center">
                  <label class="label-rate mt-2">/ {{selectedRates}}</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 mb-3">
        <div class="rate-selection">
          <h5 class="title-rate-selection">Contract Duration</h5>

          <h6 class="title-rate-range">Start Date</h6>
          <div class="row">
            <div class="col-12 col-lg-6">
              <select class="form-select">
                <option *ngFor="let month of months">{{month}}</option>
              </select>
            </div>

            <div class="col-12 col-lg-3">
              <select class="form-select">
                <option *ngFor="let day of days">{{day}}</option>
              </select>
            </div>

            <div class="col-12 col-lg-3">
              <select class="form-select">
                <option selected>2022</option>
                <option>2023</option>
                <option>2024</option>
                <option>2025</option>
              </select>
            </div>
          </div>

          <h6 class="title-rate-range mt-3">End Date</h6>
          <div class="row">
            <div class="col-12 col-lg-6">
              <select class="form-select">
                <option *ngFor="let month of months">{{month}}</option>
              </select>
            </div>

            <div class="col-12 col-lg-3">
              <select class="form-select">
                <option selected>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
              </select>
            </div>

            <div class="col-12 col-lg-3">
              <select class="form-select">
                <option selected>2022</option>
                <option>2023</option>
                <option>2024</option>
                <option>2025</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</form>
