<div class="gh-role-gate" *ngIf="visible">
  <section class="gh-role-dialog" role="dialog" aria-modal="true" aria-labelledby="gh-role-dialog-title"
    aria-describedby="gh-role-dialog-description">
    <app-brand-logo variant="horizontal" tone="on-light" [height]="34" alt="GetHired"></app-brand-logo>
    <p class="gh-role-eyebrow">WELCOME TO GETHIRED</p>
    <h1 id="gh-role-dialog-title">What brings you here today?</h1>
    <p id="gh-role-dialog-description">Choose the option that best describes you so we can take you to the right page.</p>
    <div class="gh-role-options">
      <button #employerChoice type="button" class="gh-role-option gh-role-option--employer" (click)="choose(2)">
        <span class="gh-role-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"></path></svg>
        </span>
        <span class="gh-role-copy">
          <strong>Are you hiring?</strong>
          <small>Post jobs, review applicants, and build your team.</small>
          <span class="gh-role-cta">{{ actionLabel }} as an employer <b aria-hidden="true">→</b></span>
        </span>
      </button>
      <button type="button" class="gh-role-option gh-role-option--seeker" (click)="choose(3)">
        <span class="gh-role-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4M8.5 11h5M11 8.5v5"></path></svg>
        </span>
        <span class="gh-role-copy">
          <strong>Are you looking for a job?</strong>
          <small>Discover opportunities and connect with employers.</small>
          <span class="gh-role-cta">{{ actionLabel }} as a job seeker <b aria-hidden="true">→</b></span>
        </span>
      </button>
    </div>
  </section>
</div>
