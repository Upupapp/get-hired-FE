<ng-container *ngIf="!hasError; else errorState">
  <img
    class="gh-ri"
    [class]="radiusClass + ' ' + fitClass"
    [src]="displaySrc"
    [srcset]="srcset || null"
    [sizes]="srcset ? sizes : null"
    [alt]="alt"
    [attr.loading]="loading"
    [attr.width]="width || null"
    [attr.height]="height || null"
    (error)="onError()"
  />
</ng-container>

<ng-template #errorState>
  <div class="gh-ri gh-ri--error" [class]="radiusClass" role="img" [attr.aria-label]="alt || 'Image unavailable'">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
      <path d="M3 15l5-4 4 3 3-2 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</ng-template>
