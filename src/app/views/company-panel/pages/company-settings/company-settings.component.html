<div class="bg-gray">
	<div style="position: relative;">
		<!-- STEPPER CONTAINER changeStepper-->
		<div class="bg-upper-gray">
			<app-tab-selectors
			[stepper]="stepper"
			[stepperItems]="stepperItems"
			(changeStepper)="changeStep($event)"></app-tab-selectors>
		</div>

		<div class="p-4" style="margin-top: 50px;">
			<ng-container *ngIf="stepper === 1">
				<app-company-settings-details></app-company-settings-details>
			</ng-container>
			
			<ng-container *ngIf="stepper === 2">
				<app-account-settings></app-account-settings>
			</ng-container>
		</div>
	</div>


</div>
