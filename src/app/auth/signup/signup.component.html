<div class="container-fluid bg-white ">
  <div class="row">
    <div class="col-12 col-md-12 col-lg-6 px-5 py-2 bg-left">
      <div class="img-banner text-center" style="z-index: 999999 !important; position: relative;">
        <img src="/assets/images/placeholder/signup-object-1.png" class="img-left mb-3"
          [@animate]="{value:'*', params:{ scale:'0.8', delay:'200ms' }}">
        <img src="/assets/images/placeholder/signup-object-3.png" class="img-left-2 mb-3"
          [@animate]="{value:'*', params:{ x:'-20px', delay:'700ms' }}">
        <img src="/assets/images/placeholder/signup-object-2.png" class="img-left-3 mb-3"
          [@animate]="{value:'*', params:{ x:'20px', delay:'700ms' }}">
      </div>
    </div>

    <div class="col-12 col-md-6 bg-form">
      <div class="card py-5" [@animate]="{value:'*', params:{ x:'50px', delay:'200ms' }}">
        <!-- Error Message -->
        <form class="px-3" (submit)="register($event)" [formGroup]="registerForm">
          <div class="form-group text-start mb-5">
            <h4 class="main-title m-0">Sign Up
              <img src="/assets/images/placeholder/logo.png" routerLink="/"
                [@animate]="{value:'*', params:{ y:'-50px', delay:'400ms' }}" style="width: 100px; cursor: pointer"
                class="float-end">
            </h4>
          </div>


          <div class="alert alert-danger alert-dismissible fade show error-message"
            [@animate]="{value:'*', params:{ y:'50px', delay:'600ms' }}" *ngIf="error" role="alert">
            <button type="button" class="btn-close hvr-buzz-out" data-bs-dismiss="alert" aria-label="Close"
              (click)="onAlertClose()"></button>
            <span [innerHtml]="error"></span>
          </div>

          <div class="form-inline row">
            <div class="form-group col">
              <input type="text" class="form-control" formControlName="firstName" name="firstName"
                placeholder="First Name">
            </div>
            <div class="form-group col">
              <input type="text" class="form-control" formControlName="lastName" name="lastName"
                placeholder="Last Name">
            </div>
          </div>


          <div class="form-group mt-3">
            <input type="email" class="form-control" formControlName="email" name="email" placeholder="Email">
          </div>

          <div class="form-group mt-3">
            <input [type]="inputType" class="form-control" id="password" placeholder="Password"
              formControlName="password">

            <div>
              <img src="/assets/images/placeholder/icons/hide-password.png" width="23px" class="img-fluid me-2 img-plc"
                *ngIf="inputType === 'password'" (click)="inputType = 'text'" style="margin-top: -16px;">

              <img src="/assets/images/placeholder/icons/show-password.png" width="23px" class="img-fluid me-2 img-plc"
                *ngIf="inputType === 'text'" (click)="inputType = 'password'" style="margin-top: -16px;">
            </div>
            <div *ngIf="
              (pw_validators?.invalid && pw_validators?.touched) ||
              pw_validators?.dirty
            ">
              <small *ngIf="pw_validators?.errors?.required" class="text-danger">Password is required</small>
              <small *ngIf="pw_validators?.errors?.pattern" class="text-danger">
                Password must be 8 characters long with mixed uppercase, special
                characters and numbers.
              </small>
            </div>
          </div>

          <div class="form-group mt-3">
            <input [type]="inputType" class="form-control" id="confirmPassword" placeholder="Confirm Password"
              formControlName="confirmPassword">

            <div>
              <img src="/assets/images/placeholder/icons/hide-password.png" width="23px" class="img-fluid me-2 img-plc"
                *ngIf="inputType === 'password'" (click)="inputType = 'text'" style="margin-top: -16px;">

              <img src="/assets/images/placeholder/icons/show-password.png" width="23px" class="img-fluid me-2 img-plc"
                *ngIf="inputType === 'text'" (click)="inputType = 'password'" style="margin-top: -16px;">
            </div>
            <div *ngIf="
              (pw_reValidators?.invalid && pw_reValidators?.touched) ||
              pw_reValidators?.dirty
            ">
              <small *ngIf="pw_reValidators?.errors?.required" class="text-danger">Re-enter Password is required</small>
              <small *ngIf="pw_reValidators?.hasError('notEquivalent')" class="text-danger">
                Passwords do not match
              </small>
            </div>
          </div>

          <select class="form-select mt-3" formControlName="role" name="role" aria-label="Default select example">
            <option [value]="null" disabled>I want to register as</option>
            <option [value]="3">Applicant</option>
            <option [value]="2">Company</option>
          </select>

          <div class="mt-3">

            <a class="mat-primary float-start forget-password">
              <mat-checkbox formControlName="agreeToTerms" class="remember-me  mt-1"></mat-checkbox>
              <span class="ms-2">
                By creating your account, you agree to GetHired's Privacy Policy and Terms of Use.
              </span>

            </a>
          </div>

          <br>
          <button type="submit" class="btn btn-submit d-block w-100 float-end mt-4 mb-3" [disabled]="submitting">
            Register
            <img src="/assets/images/placeholder/loading-login.gif" width="20px" class="img-fluid float-end mt-1 me-2"
              *ngIf="submitting">
          </button>

          <div class="text-center mt-5 join-us">
            <br><br>
            Already Have an account? <a [routerLink]="'/signin'">Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
