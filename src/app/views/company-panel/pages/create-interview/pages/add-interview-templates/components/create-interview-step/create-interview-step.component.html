<div class="text-end submit-container" 
[@animate]="{value:'*', params:{ y:'10px', delay:  (150) + 'ms' }}">
	<button class="btn btn-save-draft me-2" >Back</button>
	<button class="btn btn-save me-2">Next Step</button>
</div>

<div class="card card-body mt-3">
	<form class="row"
	[@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
		<!-- EMPLOYMENT DETAILS -->
		<div class="col-12">
			<h5 class="title-label">Interview Questions</h5>
			<hr style="border: dashed 1px #868686">
		</div>

		
		<div class="col-12 col-lg-6 mb-2">
			<div class="title-container" >
				<label>Title</label>
				<div class="form-group">
					<input type="text"  class="form-control" placeholder="i.e. Web dev interview questions, Business interview questions" >
				</div>
			</div>
		</div>

		<div class="col-12 col-lg-6 mb-2">
			<div class="title-container" >
				<label>Created By</label>
				<div class="form-group">
					<input type="text"  class="form-control" placeholder="Full Name" >
				</div>
			</div>
		</div>

		<div class="col-12 col-lg-12">
			<hr class="my-4" style="border: dashed 1px #868686">
			<h5 class="title-label mt-3">Question {{interview_questions?.length + 1}}
				<button class="btn btn-create-interview float-end"
				[disabled]="!interviewInput?.question" 
				(click)="addItem()">Add</button>
			</h5>
		</div>

		<div class="col-12 col-md-8 mb-3">
			<p class="title-label-sub mb-3">Add interview questions that can be linked to a job posts later</p>

			<div class="form-group d-flex">
				<textarea type="text" name="search" class="form-control" 
				[(ngModel)]="interviewInput.question" rows="6"
				[ngModelOptions]="{standalone: true}"
				placeholder="i.e. What have been your key as a web designer?">
				</textarea>
			</div>
		</div>

		<div class="row col-4">
			<div class="mb-3">
				<div class="title-container mb-3" >
					<label>Answer Duration <i>(In minutes)</i></label>
					<div class="form-group">
						<input type="number" min="3" 
						class="form-control" 
						[ngModelOptions]="{standalone: true}"
						[(ngModel)]="interviewInput.duration"
						placeholder="Duration in minutes" >
					</div>
				</div>
			</div>

			<div class="mb-3">
				<div class="title-container mb-3" >
					<label>Number of Retakes</label>
					<div class="form-group">
						<input type="number" min="3"
						[ngModelOptions]="{standalone: true}"
						[(ngModel)]="interviewInput.number_of_retakes"
						class="form-control" placeholder="Number of retakes" >
					</div>
				</div>
			</div>
		</div>
		
	</form>


</div>

<h5 class="title-label mt-4" *ngIf="interview_questions?.length > 0"
[@animate]="{value:'*', params:{ y:'10px', delay:  (250) + 'ms' }}">
	Questions Preview
</h5>

<section class="card card-body mt-3" *ngFor="let item of interview_questions; let i = index"
[@animate]="{value:'*', params:{ y:'10px', delay:  (i + 150) + 'ms' }}">
	<!-- INTERVIEWS -->
	<div class="mt-2 row">
		<div class="col-12">
			<div class="float-end">
				<div class="text-end">
					<img src="/assets/images/placeholder/icons/remove-gray.png" 
					style="height: 14px; margin-top: -17px; cursor: pointer;" class="me-2"
					(click)="removeItem(item, this.interview_questions, 'interview_questions')">
				</div>

				<div class="mt-2">
					<button class="btn btn-upload me-2">Upload</button>

					<button class="btn btn-record"><img src="/assets/images/placeholder/icons/make-video.png" style="height: 10px" class="me-2">Record Interview</button>
				</div>
			</div>

			<div class="d-flex">
				<div class="logo-thumbnail me-3 d-flex align-items-center justify-content-center">
					<img src="/assets/images/placeholder/icons/interview-logo-4.png">
				</div>

				<div class="mt-2">
					<p class="title-label-sub">
						<img src="/assets/images/placeholder/icons/interview-logo-3.png" class="me-2" style="height: 20px;">
						Question {{i + 1}}
					</p>
					<h5 class="title-label">{{item?.question}}</h5>
					<p class="title-label-sub-duration"><span>Estimated Duration:</span> {{item?.duration}} minutes</p>
				</div>
			</div>
		</div>
	</div>
</section>
