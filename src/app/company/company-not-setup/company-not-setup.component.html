<div class="main-banner" [@animate]="{value:'*', params:{ y:'-10px', delay: (150) + 'ms' }}" style="min-height: 400px;">
  <div class="row bg-details">
    <div class="col-12 col-lg-12 d-flex flex-column justify-content-center">
      <h5 class="title-company-description">
        Complete your company profile to start posting jobs and reviewing applicants.
      </h5>
      <p class="mb-3" style="color: #666; font-size: 0.9rem; font-family: Manrope, sans-serif;">
        A company profile is required to use the hiring features on GetHired.
      </p>
      <button class="btn btn-review text-center mt-2 gh-pressable"
      (click)="redirectToSetup()"
      aria-label="Complete company profile — go to company setup">
        Complete company profile
      </button>
    </div>
  </div>
</div>
