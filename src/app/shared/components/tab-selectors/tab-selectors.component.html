<div class="d-flex">
	<ng-container *ngFor="let item of stepperItems; let i = index">
		<button class="btn" (click)="changeStep(item?.id)"
		[ngClass]="stepper === item?.id ? 'btn-stepper-active-2'
		: 'btn-stepper-next'">
			<div class="text-center">
				{{item?.title}}
			</div>
		</button>
	</ng-container>
</div>
