<div class="card card-body">
  <div class="border-solid">
    <div class="d-flex p-1">
      <!-- NOTIFY-FIX-5: decorative icon gets aria-hidden so screen readers skip it -->
      <img src="/assets/images/placeholder/icons/success.png" class="mt-1"
      style="height: 34px" aria-hidden="true">

      <div class="ms-3">
        <h5 class="title-label">{{ data.title || 'Message:' }}</h5>
        <p>
          {{data?.subtitle || 'The data have been successfully updated'}}
        </p>
      </div>
    </div>

    <div class="w-100 mt-1 text-end">
      <!-- BL-011: cdkFocusInitial — focus lands on the primary action on dialog open. -->
      <button type="button" (click)="dialogRef.close()"
      class="btn btn-primary px-2 me-2" cdkFocusInitial>
        Continue
      </button>
    </div>
  </div>
</div>
