<div class="text-end" style="margin-top: -55px; margin-bottom: 20px;" 
[@animate]="{value:'*', params:{ y:'10px', delay:  (150) + 'ms' }}">
	<button class="btn btn-save-draft me-3" routerLink="/applicant/profile">Profile Preview</button>
	<button class="btn btn-save me-2">Submit Changes</button>
</div>

<div class="mt-3 card card-body">
	<div class="row">
		<div class="col-12 col-lg-12 mb-3 " 
		[@animate]="{value:'*', params:{ x:'10px', delay:'350ms' }}">
			<h5 class="mb-2 title-main">Profile Documents</h5>

			<div class="card card-body mt-3">
				
				<p>You can upload your CV, resume and other documents that might help you <br>with your job application.</p>
				
				<div class="px-3">
					<app-file-upload-document
					[labelTop]="true"
					[multiple]="true"
					label="Upload documents you want to share"></app-file-upload-document>
				</div>
			</div>
		</div>


		<div class="col-12 col-lg-6 text-center mt-lg-5"
		[@animate]="{value:'*', params:{ x:'10px', delay:'350ms' }}">
			<p>----- and ----</p>

			<h5 class="title-main mt-5">Create Video Introduction</h5>
			
			<div class="px-5 mt-4">
				<button class="btn btn-create w-100 btn-block mb-3">
					<img src="/assets/images/placeholder/icons/video-create.png" style="height: 17px;" class="me-3">Create Video 
				</button>


				<button class="btn btn-upload w-100 btn-block mb-3">
					<img src="/assets/images/placeholder/icons/video-upload.png" style="height: 17px;" class="me-3">Upload Video
				</button>
			</div>
		</div>

		<div class="col-12 col-lg-6"
		[@animate]="{value:'*', params:{ x:'10px', delay:'350ms' }}">
			<div class="card card-body">
				<h5 class="title-preview mb-4">Preview Video File</h5>

				<video width="100%" height="340" controls>
				  <source src="" type="video/mp4">
				  <source src="" type="video/ogg">
					Your browser does not support the video tag.
				</video>
			</div>
		</div>
	</div>
</div>

<div class="text-end mt-4" [@animate]="{value:'*', params:{ y:'10px', delay:  (150) + 'ms' }}">
	<!-- <button class="btn btn-save-draft me-3" routerLink="/applicant/profile">Profile Preview</button> -->
	<button class="btn btn-save me-2">Submit Changes</button>
</div>
