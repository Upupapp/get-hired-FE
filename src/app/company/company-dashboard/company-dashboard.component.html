<div class="pt-5" *ngIf="loading$ | async">
  <app-inline-loading></app-inline-loading>
</div>

<section *ngIf="!(loading$ | async) && dashboard$ | async as dashboard">
  <app-dashboard-banner
  [details]="dashboard.company" [charts]="dashboard.charts"></app-dashboard-banner>
  <app-dashboard-charts [details]="dashboard.graph"></app-dashboard-charts>
  <app-dashboard-statistics [details]="dashboard.stat"></app-dashboard-statistics>
</section>
