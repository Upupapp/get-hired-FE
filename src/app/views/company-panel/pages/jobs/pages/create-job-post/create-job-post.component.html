<!-- {{jobPostData | json}}
 -->

<div class="">
	<div class="bg-upper-gray">
		<app-main-stepper
		[stepper]="stepper"
		[stepperItems]="stepperItems"
		(changeStepper)="changeStep($event)"></app-main-stepper>
	</div>
	
	<!-- SECTION CREATE JOB POST -->
	<div class="p-4" style="margin-top: 50px;">
		<ng-container *ngIf="stepper === 1">
			<app-job-post-detail-step
			(jobPostDetailsEvent)="updateObject($event, 'jobPostDetails')"
			[jobPostDetails]="jobPostData?.jobPostDetails"></app-job-post-detail-step>
		</ng-container>

		<ng-container *ngIf="stepper === 2">
			<app-create-job-post-step
			(jobPostIndustryEvent)="updateObject($event, 'jobPostIndustry')"
			[jobPostIndustry]="jobPostData?.jobPostIndustry"></app-create-job-post-step>
		</ng-container>

		<ng-container *ngIf="stepper === 3">
			<app-create-interview-questions
			(jobPostInterviewQuestionsEvent)="updateObject($event, 'jobPostInterviewQuestions')"
			[jobPostInterviewQuestions]="jobPostData?.jobPostInterviewQuestions"></app-create-interview-questions>
		</ng-container>

		<ng-container *ngIf="stepper === 4">
			<app-preview-job-post-step
			[jobPostData]="jobPostData"></app-preview-job-post-step>
		</ng-container>

		<section class="submit-container">
			<div class="text-end mt-3">
				<button class="btn btn-save-draft me-2"  (click)="saveAsDraft()">Save as Draft</button>

				<button class="btn btn-preview-job-post" (click)="changeStep(2)" *ngIf="stepper === 1">
					Add Rates and Budget
				</button>

				<button class="btn btn-preview-job-post" (click)="changeStep(3)" *ngIf="stepper === 2">
					Create Interview
				</button>

				<button class="btn btn-preview-job-post" (click)="changeStep(4)" *ngIf="stepper === 3">
					Preview Job Post
				</button>

				<button class="btn btn-preview-job-post" (click)="publishJobPost()" *ngIf="stepper === 4">
					Publish Job Post
				</button>
			</div>
		</section>
	</div>
</div>
