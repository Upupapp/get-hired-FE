
<!-- Banner section -->
<app-banner
[screenSize]="screenSize"></app-banner>


<!-- Companies -->
<app-companies></app-companies>


<div class="container-fluid  px-5 mb-5">
	<div class="mt-5 px-lg-5">
		<div class="row">
			<div class="col-12 mb-3 ps-4">
				<h5 class="title-latest-job" 
				[@animate]="{value:'*', params:{ y:'10px', delay: '200ms' }}">Start your career now
					<span class="float-end d-flex">
						<span class="me-3 filter-by">View All</span>
						<span class="me-3 filter-by">Development</span>
						<span class="me-3 filter-by">Data Science</span>
						<span class="me-3 filter-by">Business</span>
						<span class="me-2 filter-by">Marketing</span>
						<img src="/assets/images/placeholder/icons/arrow-down.png" 
						class="mt-1" style="width: 12px; height: 12px;">
					</span>
				</h5>
				<p class="title-latest-job-description"
				[@animate]="{value:'*', params:{ y:'10px', delay: '200ms' }}">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt<br> ut labore et dolore magna aliqua. </p>
			</div>

			<ng-container *ngFor="let data of jobLists; let i = index">
				<div class="col-12 col-md-6 col-lg-3"
				[@animate]="{value:'*', params:{ y:'-10px', delay: (i * 150) + 'ms' }}">
					<app-job-card [data]="data"></app-job-card>
				</div>
			</ng-container>

			<ng-container *ngFor="let data of jobLists; let i = index">
				<div class="col-12 col-md-6 col-lg-3"
				[@animate]="{value:'*', params:{ y:'-10px', delay: (i * 150) + 'ms' }}">
					<app-job-card [data]="data"
					[i]="i"></app-job-card>
				</div>
			</ng-container>
		</div>
	</div>
</div>
