<div class="locked-match-teaser" [ngClass]="'variant-' + variant" role="group" aria-label="Unlock your match grade by creating a profile">
  <div class="locked-match-teaser__icon" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="locked-match-teaser__body">
    <p class="locked-match-teaser__title">Unlock your Match Grade</p>
    <p class="locked-match-teaser__subtitle" *ngIf="variant !== 'card'">
      Create a profile to see your fit, document readiness, and application checklist for this job.
    </p>
  </div>

  <div class="locked-match-teaser__actions">
    <button type="button" class="btn btn-primary btn-sm" (click)="createProfile()">
      Create free profile
    </button>
    <button type="button" class="btn btn-link btn-sm" (click)="logIn()">
      Log in
    </button>
  </div>
</div>
