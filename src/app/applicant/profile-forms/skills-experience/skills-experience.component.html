<div class="card card-body mt-3" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
  <form [formGroup]="skillsFG">

    <div class="row">
      <div class="col-12 col-md-6 mb-3">
        <label class="text-center">Professional Skills</label>
        <div class="form-group d-flex with-add search-group" style="height: 60px;">
          <input type="text" name="search" class="form-control form-control-main" formControlName="skillsTxt"
            style="background: white !important" placeholder="ex. Data Encoding, Ruby, JavaScript"
            (keyup.up)="addSkills()">
          <button class="btn btn-add-default text-white" (click)="addSkills()">
            Add
          </button>
        </div>
        <div class="d-flex flex-wrap">
          <div class="mt-3 d-flex" *ngIf="professionalSkills && professionalSkills.length > 0">
            <ng-container *ngFor="let item of professionalSkills; let i = index">
              <div class="flex-wrap me-2">
                <h5 class="w-100 requirement-badge">
                  {{item}}
                  <img src="/assets/images/placeholder/icons/remove-white.png" style="height: 10px; margin-top: 3px"
                    class="ms-2 float-end" (click)="removeItem(i, 'professionalSkills')">
                </h5>
              </div>
            </ng-container>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-2 mb-3 d-flex align-items-center">
        <button class="btn btn-save" [ngClass]="professionalSkills && professionalSkills.length != 0 ? 'mb-4':''"
          (click)="submitSkills()" [disabled]="!skillChanged">
          Apply Change
        </button>
      </div>
    </div>
  </form>
</div>

<!-- Work Experience -->
<div [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
  <div class="my-3 ms-2 w-100 d-flex justify-content-between">
    <h5 class="mt-3 main-title">Work Experience</h5>
    <span class="text-primary-red cursor-pointer align-self-center" (click)="addWorkExperience()"
      *ngIf="workExperience && workExperience.length != 0">Add more</span>
  </div>
  <div class="ms-2 w-100 card m-0 p-3">
    <div class="" *ngIf="workExperience && workExperience.length > 0; else emptyWorkExp">
      <ng-container *ngFor="let item of workExperience; let i = index">
        <hr style="border-color: #909090" *ngIf="i > 0">
        <div class="row d-flex p-2 list" (mouseenter)="forChange[i] = true" (mouseleave)="forChange[i] = false">
          <div class="col-12 col-lg-9">
            <h5 class="title-experience">{{item?.jobTitle}}</h5>
            <div class="d-flex">
              <p class="title-other">
                <img src="/assets/images/placeholder/icons/applicant-company.png" style="height: 14px"
                  class="me-2">{{item?.companyName}}
              </p>

              <p class="title-other">
                <img src="/assets/images/placeholder/icons/applicant-location.png" style="height: 14px"
                  class="me-1">{{item?.location}}
              </p>
            </div>
            <p class="title-details mt-3 w-75">{{item?.details}}</p>
          </div>
          <div class="col-12 col-lg-3 text-end">
            <div class="title-duration mb-2 justify-content-end">
              <img src="/assets/images/placeholder/icons/applicant-date.png" style="height: 14px" class="me-2">
              {{item?.startMonth}}, {{ item.startYear }} - <span *ngIf="item.endYear">{{item?.endMonth}}, {{
                item.endYear }}</span><span *ngIf="!item.endYear"> Present </span>
            </div>
            <span class="title-job-type">{{item?.jobTypeName}}</span>
            <div class="mt-3" *ngIf="forChange[i]">
              <!-- <button class="btn btn-save-draft btn-sm mx-2 px-2 py-2" type="button" (click)="updateArray()">
                  Edit</button>
                <button class="btn btn-save-draft btn-sm px-2 py-2" type="button"
                  (click)="removeItem(i, this.workExperience)">
                  Delete</button> -->
            </div>
          </div>
        </div>
      </ng-container>
    </div>
    <ng-template #emptyWorkExp>
      <img src="assets/images/empty-list-grayscale.png" style="width: 5rem" class="text-center mx-auto" />
      <h5 class="text-center sub-title">No Work Experience</h5>
      <button class="btn btn-light-red mx-auto w-20 text-primary-red" (click)="addWorkExperience()" type="button">
        Add</button>
    </ng-template>
  </div>
</div>
