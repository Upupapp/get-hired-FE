<div class="container-fluid bg-light-green-transparent">
	<div class="row" style="min-height: 650px; position: relative; overflow: hidden;">

		<div class="col-12 col-md-8 col-lg-6 offset-md-2 offset-lg-3 text-center mt-5 pt-5">
			<h1 class="title-main" style="font-size: 1.75rem;">Page Not Found</h1>
			<p class="title-description px-lg-5">
				The page you are looking for doesn't seem to be available.
				Try browsing open jobs or return to the homepage.
			</p>

			<!-- Desktop CTAs -->
			<div class="text-center py-5 d-none d-lg-block">
				<button class="btn btn-primary me-4 hvr-grow" (click)="goToJobs()">Browse Jobs</button>
				<button class="btn back-home ms-2 hvr-grow" (click)="goHome()">Go to Homepage</button>
			</div>

			<!-- Mobile CTAs -->
			<div class="text-center py-3 d-block d-lg-none">
				<button class="btn btn-primary btn-block w-100 mb-3 hvr-grow" (click)="goToJobs()">Browse Jobs</button>
				<button class="btn back-home btn-block w-100 hvr-grow" (click)="goHome()">Go to Homepage</button>
			</div>

			<!-- Fallback text links for crawlers -->
			<nav aria-label="Recovery navigation" class="mt-3" style="font-size: 0.9rem;">
				<a href="/home" class="me-3 text-muted">Homepage</a>
				<a href="/jobs" class="text-muted">Browse Jobs</a>
			</nav>
		</div>
	</div>
</div>
