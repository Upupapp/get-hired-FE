<div class="card card-body mt-3" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
  <form [formGroup]="skillsFG">

    <div class="row">
      <div class="col-12 col-md-6 mb-3">
        <label class="text-center">Professional Skills</label>
        <div class="form-group d-flex with-add search-group" style="height: 60px;">
          <input type="text" name="search" class="form-control form-control-main" formControlName="skillsTxt"
            style="background: white !important" placeholder="ex. Data Encoding, Ruby, JavaScript"
            (keyup.up)="addSkills()">
          <button class="btn btn-add-default text-white" (click)="addSkills()">
            Add
          </button>
        </div>
        <div class="d-flex flex-wrap">
          <div class="mt-3 d-flex" *ngIf="professionalSkills && professionalSkills.length > 0">
            <ng-container *ngFor="let item of professionalSkills; let i = index">
              <div class="flex-wrap me-2">
                <h5 class="w-100 requirement-badge">
                  {{item}}
                  <img src="/assets/images/placeholder/icons/remove-white.png" style="height: 10px; margin-top: 3px"
                    class="ms-2 float-end" (click)="removeItem(i, 'professionalSkills')">
                </h5>
              </div>
            </ng-container>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-2 mb-3 d-flex align-items-center">
        <button class="btn btn-save" [ngClass]="professionalSkills && professionalSkills.length != 0 ? 'mb-4':''"
          (click)="submitSkills()" [disabled]="!skillChanged">
          Apply Change
        </button>
      </div>
    </div>
  </form>
</div>
