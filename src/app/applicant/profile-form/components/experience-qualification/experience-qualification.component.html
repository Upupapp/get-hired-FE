<form [formGroup]="arrayForm">
  <div class="mb-3 mt-4 ms-2 w-100">
    <h5 class="mt-3 main-title text-center">Work Experience</h5>
  </div>

  <div *ngIf="!workRendering">
    <ng-container *ngFor="let workFormGroup of workExperience?.value; let i = index;">
      <app-work-experience [data]="workFormGroup" [controlIndex]="i" (arrayFormArray)="addMeToArray($event)"
        (removeArrayFormArray)="removeMeToArray($event)"></app-work-experience>
    </ng-container>
  </div>

  <div class="mb-3 mt-5 ms-2 w-100">
    <h5 class="mt-3 main-title text-center">Educational Background</h5>
  </div>

  <div *ngIf="!educRendering">
    <ng-container *ngFor="let educFormGroup of educationalBackground.value let i = index">
      <app-educational-background [data]="educFormGroup" [controlIndex]="i" (arrayFormArray)="addMeToArray($event)"
        (removeArrayFormArray)="removeMeToArray($event)">
      </app-educational-background>
    </ng-container>
  </div>


  <div class="card card-body mt-3" [@animate]="{value:'*', params:{ y:'50px', delay:'200ms' }}">
    <div class="row mt-3">
      <div class="col-12 col-md-6 mb-3">
        <label class="text-center">Professional Skills</label>

        <div class="form-group d-flex with-add search-group" style="height: 60px;">
          <input type="text" name="search" class="form-control form-control-main" formControlName="skillsTxt" style="background: white !important"
            placeholder="ex. Data Encoding, Ruby, JavaScript"
            (keyup.up)="addItem('skillsTxt', this.professionalSkills)">
          <button class="btn btn-add-now" (click)="addItem('skillsTxt', this.professionalSkills)">
            Add
          </button>
        </div>

        <div class="d-flex flex-wrap">
          <div class="mt-3 d-flex"
          *ngIf="professionalSkills && professionalSkills.controls.length > 0">
            <ng-container *ngFor="let item of professionalSkills.controls; let i = index">
              <div class="flex-wrap me-2">
                <h5 class="w-100 requirement-badge">
                  {{item.value}}
                  <img src="/assets/images/placeholder/icons/remove-white.png" style="height: 10px; margin-top: 3px"
                    class="ms-2 float-end" (click)="removeItem(i, this.professionalSkills)">
                </h5>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mb-3 mt-5 ms-2 w-100">
    <h5 class="mt-3 main-title text-center">Certification / Awards</h5>
  </div>

  <div *ngIf="!awardRendering">
    <ng-container *ngFor="let certFormGroup of certifications.value let i = index">
      <app-awards-details [data]="certFormGroup" [controlIndex]="i" (arrayFormArray)="addMeToArray($event)"
        (removeArrayFormArray)="removeMeToArray($event)">
      </app-awards-details>
    </ng-container>
  </div>


</form>
