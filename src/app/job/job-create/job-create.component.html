<div class="card card-body py-3">
  <div class="w-100">
    <span class="main-title mt-3">Create a Job</span>

    <div class="float-end">
      <button class="btn btn-add-service" (click)="saveAsDraft()">
        Save as Draft
        <img src="/assets/images/placeholder/icons/add-new.png"
        style="width: 16px;" class="ms-1">
      </button>

      <button class="btn btn-add-service me-2" (click)="cancel()">
        Cancel
        <img src="/assets/images/placeholder/icons/add-new.png"
        style="width: 16px;" class="ms-1">
      </button>
    </div>
  </div>
</div>
