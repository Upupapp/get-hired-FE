<div class="mt-3 card card-body">
  <div class="row">
    <div class="col-12 col-lg-12 mb-3 " [@animate]="{value:'*', params:{ x:'10px', delay:'350ms' }}">
      <h5 class="mb-2 title-main">Profile Documents</h5>

      <div class="card card-body mt-3">
        <div class="row flex">
          <div class="col-12 col-lg-6">
            <p>You can upload your CV, resume and other documents that might help you <br>with your job application.</p>
          </div>
          <div class="col-12 col-lg-6 text-end">
            <button class="btn btn-save"
              (click)="uploadDocs()" *ngIf="tempDocs.length >= docs.length">
              Upload Files
            </button>
          </div>
        </div>

        <div class="px-3">
          <app-file-upload-document [labelTop]="true" [multiple]="true" (upload)="onUpload($event)" [fileArray]="docs"
            label="Upload documents you want to share"></app-file-upload-document>
        </div>
      </div>
    </div>
  </div>
</div>
