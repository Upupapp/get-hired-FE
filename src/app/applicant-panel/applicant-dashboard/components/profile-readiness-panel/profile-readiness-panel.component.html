<div class="readiness-panel" role="status" aria-live="polite">
  <h3 class="readiness-panel-title">Your profile readiness</h3>

  <div class="readiness-cards">
    <div class="readiness-card" *ngIf="profileQuality">
      <div class="readiness-card-score">{{ profileQuality.score }}%</div>
      <div class="readiness-card-label">Profile: {{ profileQuality.label }}</div>
    </div>

    <div class="readiness-card" *ngIf="documentQuality">
      <div class="readiness-card-score">{{ documentQuality.score }}%</div>
      <div class="readiness-card-label">Documents: {{ documentQuality.label }}</div>
    </div>
  </div>

  <div class="readiness-next-action" *ngIf="loadingProfileQuality">
    <p class="readiness-next-action-text">Checking your profile readiness…</p>
  </div>

  <div class="readiness-next-action" *ngIf="!loadingProfileQuality && nextBestAction">
    <p class="readiness-next-action-label">Next best action</p>
    <p class="readiness-next-action-text">{{ nextBestAction }}</p>
    <button type="button" class="btn btn-readiness-primary" (click)="goToProfile()">Update profile</button>
    <button type="button" class="btn-link-cta" (click)="goToCvBuilder()">Check CV readiness</button>
  </div>

  <div class="readiness-next-action" *ngIf="!loadingProfileQuality && !nextBestAction">
    <p class="readiness-next-action-text">Your profile looks complete. Find jobs that match your profile.</p>
    <button type="button" class="btn btn-readiness-primary" (click)="goToJobs()">Find jobs</button>
  </div>
</div>
